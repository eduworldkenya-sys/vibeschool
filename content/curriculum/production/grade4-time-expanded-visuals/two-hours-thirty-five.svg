<svg viewBox="0 0 340 158" width="340" height="158" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two bars of 60 minutes and a shorter 35-minute bar: total 155 minutes">
    <text x="10" y="18" fill="#1F2C3B" font-weight="600" font-size="12">Each full hour contains 60 minutes</text>
    <rect x="10" y="38" width="120" height="51" rx="6" fill="#227A72"/>
    <rect x="136" y="38" width="120" height="51" rx="6" fill="#227A72"/>
    <rect x="262" y="38" width="70" height="51" rx="6" fill="#E9B968"/>
    <text x="70" y="60" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">60 min</text>
    <text x="196" y="60" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">60 min</text>
    <text x="297" y="60" text-anchor="middle" font-size="11" fill="#243344" font-weight="600">35 min</text>
    <text x="70" y="77" text-anchor="middle" font-size="10" fill="#FFFFFF">1 hour</text>
    <text x="196" y="77" text-anchor="middle" font-size="10" fill="#FFFFFF">1 hour</text>
    <text x="297" y="77" text-anchor="middle" font-size="10" fill="#243344">extra</text>
    <text x="170" y="119" text-anchor="middle" font-size="15" fill="#1F2C3B" font-weight="700">60 + 60 + 35 = 155 minutes</text>
    <text x="170" y="143" text-anchor="middle" font-size="11" fill="#1F2C3B">2 complete hours and 35 extra minutes</text>
  </svg>