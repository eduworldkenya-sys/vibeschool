<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img"><title>Three quarters of one whole</title><desc>Four equal rectangles, with three shaded and one unshaded.</desc><text x="22" y="65" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="600">3/4</text><rect x="115" y="36" width="130" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="245" y="36" width="130" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="375" y="36" width="130" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="505" y="36" width="130" height="37" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="115" y="118" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="600">Three of four equal parts are shaded.</text></svg>