<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img"><title>Nine sixths as a mixed number</title><desc>Nine sixths fill one complete six-piece bar and three additional sixths of a second equal bar. The sum is one and one half.</desc><text x="12" y="55" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="600">6/6</text><rect x="115" y="27" width="86.66666666666667" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="201.66666666666669" y="27" width="86.66666666666667" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="288.33333333333337" y="27" width="86.66666666666667" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="375" y="27" width="86.66666666666667" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="461.6666666666667" y="27" width="86.66666666666667" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="548.3333333333333" y="27" width="86.66666666666667" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><text x="12" y="119" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="600">3/6</text><rect x="115" y="91" width="86.66666666666667" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="201.66666666666669" y="91" width="86.66666666666667" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="288.33333333333337" y="91" width="86.66666666666667" height="37" fill="#1f8c76" stroke="#475569" stroke-width="1.5"/><rect x="375" y="91" width="86.66666666666667" height="37" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="461.6666666666667" y="91" width="86.66666666666667" height="37" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="548.3333333333333" y="91" width="86.66666666666667" height="37" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="115" y="196" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="600">9/6 = 1 and 3/6 = 1 and 1/2</text></svg>