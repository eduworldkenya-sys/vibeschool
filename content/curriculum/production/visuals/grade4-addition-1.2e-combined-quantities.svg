<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Join two groups to find a total</title><desc id="desc">A school garden has 2,450 seed packets from one term and 1,325 from another. Combine matching units to get 3,775 seed packets.</desc><rect width="1000" height="560" fill="#f8fafc"/><rect x="25" y="24" width="950" height="512" rx="22" fill="#fff" stroke="#abc1d2" stroke-width="2"/><text x="55" y="78" fill="#143047" font-size="32" font-family="Arial,sans-serif" font-weight="700">Join two groups to find a total</text><g font-family="Arial,sans-serif"><text x="70" y="150" font-size="24" fill="#30485d">Two school-garden collections:</text><rect x="90" y="185" width="490" height="115" rx="10" fill="#dceefb" stroke="#1f5f94" stroke-width="2"/><rect x="580" y="185" width="290" height="115" rx="10" fill="#e6f6e8" stroke="#17764c" stroke-width="2"/><g font-size="24" text-anchor="middle" fill="#143047" font-weight="700"><text x="335" y="231">Term 1</text><text x="335" y="271">2,450 packets</text><text x="725" y="231">Term 2</text><text x="725" y="271">1,325 packets</text></g><path d="M90 333 V357 H870 V333" stroke="#355267" fill="none" stroke-width="4"/><path d="M480 358 V385" stroke="#355267" stroke-width="3"/><rect x="304" y="388" width="350" height="80" rx="14" fill="#e3f8ee" stroke="#08765f" stroke-width="2"/><text x="479" y="420" font-size="21" text-anchor="middle" fill="#08765f">Combined total</text><text x="479" y="452" font-size="28" text-anchor="middle" font-weight="700" fill="#143047">3,775 packets</text></g><text x="55" y="510" font-family="Arial,sans-serif" fill="#30485d" font-size="19">VibeSchool • Grade 4 Mathematics • Editorial candidate</text></svg>
