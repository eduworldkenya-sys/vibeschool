<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Estimate before you add</title><desc id="desc">Round 2,463 down to 2,460 and 1,328 up to 1,330. The estimate is 3,790 and the exact sum is 3,791.</desc><rect width="1000" height="560" fill="#f8fafc"/><rect x="25" y="24" width="950" height="512" rx="22" fill="#fff" stroke="#abc1d2" stroke-width="2"/><text x="55" y="78" fill="#143047" font-size="32" font-family="Arial,sans-serif" font-weight="700">Estimate before you add</text><g font-family="Arial,sans-serif" fill="#18344a"><text x="70" y="145" font-size="25" font-weight="700">First number: 2,463</text><line x1="190" y1="206" x2="780" y2="206" stroke="#18344a" stroke-width="4"/><g font-size="22"><text x="157" y="246">2,460</text><text x="743" y="246">2,470</text></g><circle cx="367" cy="206" r="12" fill="#08765f"/><text x="320" y="176" font-size="22" fill="#08765f">2,463</text><text x="800" y="211" font-size="20">Round down</text><text x="70" y="295" font-size="25" font-weight="700">Second number: 1,328</text><line x1="190" y1="357" x2="780" y2="357" stroke="#18344a" stroke-width="4"/><g font-size="22"><text x="155" y="398">1,320</text><text x="740" y="398">1,330</text></g><circle cx="662" cy="357" r="12" fill="#08765f"/><text x="616" y="325" font-size="22" fill="#08765f">1,328</text><text x="800" y="361" font-size="20">Round up</text><rect x="75" y="430" width="835" height="55" rx="10" fill="#e2f7ec"/><text x="100" y="465" font-size="23" font-weight="700">Estimate: 2,460 + 1,330 = 3,790  •  Exact: 3,791</text></g><text x="55" y="510" font-family="Arial,sans-serif" fill="#30485d" font-size="19">VibeSchool • Grade 4 Mathematics • Editorial candidate</text></svg>
