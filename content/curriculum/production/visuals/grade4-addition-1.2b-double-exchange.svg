<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Two exchanges: 2,478 + 1,347</title><desc id="desc">In the ones column 8 plus 7 makes 15, so carry one ten. In the tens column 7 plus 4 plus one carried makes 12, so carry one hundred. The sum is 3,825.</desc><rect width="1000" height="560" fill="#f8fafc"/><rect x="25" y="24" width="950" height="512" rx="22" fill="#fff" stroke="#abc1d2" stroke-width="2"/><text x="55" y="78" fill="#143047" font-size="32" font-family="Arial,sans-serif" font-weight="700">Two exchanges: 2,478 + 1,347</text><text x="60" y="137" font-family="Arial,sans-serif" font-size="23" fill="#34485c">The carried 1 represents a group of ten in the next column.</text>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#18344a">
<rect x="220" y="164" width="558" height="272" rx="12" fill="#f2f7fa" stroke="#9caebd"/><g font-size="20" font-weight="700"><text x="291" y="201">Thousands</text><text x="435" y="201">Hundreds</text><text x="580" y="201">Tens</text><text x="723" y="201">Ones</text></g>
<g font-size="43"><text x="291" y="279">2</text><text x="435" y="279">4</text><text x="580" y="279">7</text><text x="723" y="279">8</text><text x="291" y="341">1</text><text x="435" y="341">3</text><text x="580" y="341">4</text><text x="723" y="341">7</text></g>
<path d="M241 357 H759" stroke="#4a6577" stroke-width="3"/>
<g font-size="45" font-weight="700"><text x="291" y="419">3</text><text x="435" y="419">8</text><text x="580" y="419">2</text><text x="723" y="419">5</text></g>
<g font-size="23" font-weight="700" fill="#08765f"><text x="435" y="236">+1</text><text x="580" y="236">+1</text></g>
</g><text x="55" y="471" fill="#08765f" font-size="22" font-weight="700" font-family="Arial,sans-serif">15 ones = 1 ten + 5 ones   •   12 tens = 1 hundred + 2 tens</text><text x="55" y="510" font-family="Arial,sans-serif" fill="#30485d" font-size="19">VibeSchool • Grade 4 Mathematics • Editorial candidate</text></svg>
