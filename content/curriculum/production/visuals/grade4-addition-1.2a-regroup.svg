<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">One regrouping when adding 2,413 and 1,258</title>
<desc id="desc">A four-column place-value chart from thousands to ones. Adding 3 and 8 produces 11 ones. Exchange 10 ones for one ten, write 1 one, then add tens 1 plus 5 plus the carried 1 to get 7. Final sum: 3,671.</desc>
<rect x="20" y="20" width="860" height="480" rx="22" fill="#f8fafc" stroke="#273b52" stroke-width="3"/>
<text x="48" y="70" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#142b45">Add 2,413 + 1,258</text>
<text x="48" y="110" font-family="Arial,sans-serif" font-size="19" fill="#32465c">Line up the place values. Start with ones.</text>
<g transform="translate(55 142)">
<rect x="0" y="0" width="790" height="252" rx="10" fill="#ffffff" stroke="#5c7389" stroke-width="2"/>
<g stroke="#9aafbf" stroke-width="2"><line x1="197.5" y1="0" x2="197.5" y2="252"/><line x1="395" y1="0" x2="395" y2="252"/><line x1="592.5" y1="0" x2="592.5" y2="252"/><line x1="0" y1="60" x2="790" y2="60"/><line x1="0" y1="186" x2="790" y2="186"/></g>
<g fill="#142b45" font-family="Arial,sans-serif" text-anchor="middle" font-size="21" font-weight="700"><text x="99" y="38">Thousands</text><text x="296" y="38">Hundreds</text><text x="493" y="38">Tens</text><text x="692" y="38">Ones</text></g>
<g fill="#273b52" font-family="Arial,sans-serif" text-anchor="middle" font-size="38"><text x="99" y="112">2</text><text x="296" y="112">4</text><text x="493" y="112">1</text><text x="692" y="112">3</text><text x="99" y="165">1</text><text x="296" y="165">2</text><text x="493" y="165">5</text><text x="692" y="165">8</text></g>
<rect x="397" y="187" width="194" height="63" fill="#e1f8ef"/><rect x="594" y="187" width="195" height="63" fill="#e1f8ef"/>
<g fill="#123c34" font-family="Arial,sans-serif" text-anchor="middle" font-size="43" font-weight="700"><text x="99" y="233">3</text><text x="296" y="233">6</text><text x="493" y="233">7</text><text x="692" y="233">1</text></g>
<rect x="474" y="60" width="39" height="28" rx="7" fill="#0a7260"/><text x="493" y="81" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#fff">+1</text>
</g>
<text x="59" y="435" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#134e4a">11 ones = 1 ten + 1 one.</text>
<text x="59" y="468" font-family="Arial,sans-serif" font-size="19" fill="#273b52">Carry one ten to the tens column: 1 + 5 + 1 = 7 tens.</text>
</svg>
