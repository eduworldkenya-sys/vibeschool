<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Addition pattern: add 125 each time</title><desc id="desc">Five terms are 1,150, 1,275, 1,400, 1,525 and 1,650. Each arrow adds 125, and the same step repeats every time.</desc><rect width="1000" height="560" fill="#f8fafc"/><rect x="25" y="24" width="950" height="512" rx="22" fill="#fff" stroke="#abc1d2" stroke-width="2"/><text x="55" y="78" fill="#143047" font-size="32" font-family="Arial,sans-serif" font-weight="700">Addition pattern: add 125 each time</text><g font-family="Arial,sans-serif"><text x="65" y="145" font-size="24" fill="#30485d">Rule: add 125 to the previous term.</text><g fill="#e5f6ee" stroke="#08765f" stroke-width="2"><rect x="50" y="230" rx="12" width="165" height="95"/><rect x="240" y="230" rx="12" width="165" height="95"/><rect x="430" y="230" rx="12" width="165" height="95"/><rect x="620" y="230" rx="12" width="165" height="95"/><rect x="810" y="230" rx="12" width="165" height="95"/></g><g fill="#123d32" font-size="27" font-weight="700" text-anchor="middle"><text x="132" y="286">1,150</text><text x="322" y="286">1,275</text><text x="512" y="286">1,400</text><text x="702" y="286">1,525</text><text x="892" y="286">1,650</text></g><g fill="#1c5170" font-size="21" font-weight="700" text-anchor="middle"><text x="227" y="207">+125</text><text x="417" y="207">+125</text><text x="607" y="207">+125</text><text x="797" y="207">+125</text></g><text x="70" y="400" font-size="24" fill="#143047">Check with subtraction: 1,400 − 1,275 = 125.</text><text x="70" y="449" font-size="23" fill="#08765f" font-weight="700">Each neighbouring pair differs by exactly 125.</text></g><text x="55" y="510" font-family="Arial,sans-serif" fill="#30485d" font-size="19">VibeSchool • Grade 4 Mathematics • Editorial candidate</text></svg>
