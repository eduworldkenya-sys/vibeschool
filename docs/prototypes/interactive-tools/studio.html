<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f8"><title>VibeSchool · Teaching tools</title><style>
:root{color-scheme:light;--bg:#f5f5f7;--paper:#fff;--ink:#202124;--muted:#666b73;--line:#e5e6ea;--accent:#1769e0;--soft:#eaf2ff;--shadow:0 2px 12px #18243609;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit;color:inherit;min-width:0;max-width:100%}button{min-height:44px;cursor:pointer;background:var(--paper);border:1px solid #dfe2e7;border-radius:9px;padding:9px 14px;font-weight:550;transition:background .15s,transform .15s}button:hover{background:#f0f3f7}button:active{transform:scale(.98)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1769e0;outline-offset:2px}button[aria-pressed=true]{background:var(--soft);color:#0757c6;border-color:#b5d1ff}input:not([type=range]),select,textarea{width:100%;min-height:44px;padding:10px 12px;background:white;border:1px solid #dfe2e7;border-radius:9px}input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--accent)}h1,h2,p{margin:0}h1{font-size:16px;font-weight:700;letter-spacing:-.035em}h2{font-size:clamp(24px,3vw,34px);line-height:1.1;letter-spacing:-.05em;font-weight:700}label{display:grid;gap:6px;margin:10px 0;font-weight:500}.muted,.hint{color:var(--muted);font-size:13px}.hint{margin:0 0 12px}.shell{max-width:1600px;margin:auto;display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100dvh;grid-template-rows:60px 1fr}.bar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5}.brand,.bar-actions,.row,.between{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.brand{flex-wrap:nowrap}.brandmark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#202124;color:white;font-weight:800;letter-spacing:-.1em}.brand small{font-size:11px;display:block;color:var(--muted);font-weight:500}.bar-actions{flex-wrap:nowrap}.prototype{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:5px;white-space:nowrap}.iconbtn{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent}.iconbtn svg{width:18px;height:18px;flex:none}.sidebar{background:var(--paper);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:60px;align-self:start;max-height:calc(100dvh - 60px);overflow:auto;scrollbar-width:thin}.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:0 7px 10px}.sidebar-head strong{font-size:15px;letter-spacing:-.02em}.searchbox{position:relative;margin:4px 3px 10px}.searchbox svg{position:absolute;top:14px;left:11px;width:16px;height:16px;color:var(--muted);pointer-events:none}.searchbox input{padding-left:34px;background:#f5f5f7;border-color:transparent;font-size:14px}.filter{display:block;margin:0 3px 8px;font-size:12px;color:var(--muted)}.filter select{margin-top:4px;font-size:13px;color:var(--ink);background:#fff}.list-meta{display:flex;justify-content:space-between;padding:8px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.055em;font-weight:600}#tool-list{display:grid;gap:2px}#tool-list button{display:flex;align-items:center;gap:9px;text-align:left;border:0;min-height:46px;width:100%;padding:7px 8px;background:transparent;border-radius:8px;font-size:13px;line-height:1.25;font-weight:550}#tool-list button:hover{background:#f5f5f7}#tool-list button[aria-current=true]{background:var(--soft);color:#0757c6;font-weight:650}.tool-icon{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:7px;background:#eff1f4;color:#505966}.tool-icon svg{width:17px;height:17px}#tool-list button[aria-current=true] .tool-icon{background:white;color:#1769e0}.tool-info{min-width:0;flex:1}.tool-info small{display:block;font-size:10px;color:var(--muted);font-weight:450;margin-top:3px}.tool-chevron{font-size:17px;color:#999}.native-picker{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}.stage{padding:clamp(14px,2.3vw,28px);min-width:0;max-width:1150px;width:100%;margin:0 auto}.stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}.stage-actions{display:flex;gap:4px;flex:none}.stage-actions button{border:0;background:transparent}.stage-actions button:hover{background:#e9e9ed}.board{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0;overflow:hidden}.board-top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.mode-label{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:550}.mode-label:before{content:'';width:7px;height:7px;border-radius:50%;background:#858b96}.workspace{padding:clamp(14px,2.5vw,24px);min-width:0}.workspace>button{margin:5px 6px 5px 0}.visual{background:#fbfbfc;border:1px solid #ebecf0;border-radius:10px;overflow:hidden}.visual svg{display:block;width:100%;max-height:clamp(180px,calc(100dvh - 440px),360px)}.visual svg[data-direct]{touch-action:none;cursor:crosshair}.feedback{display:block;padding:12px 14px;margin:10px 0;font-size:16px;font-weight:650;letter-spacing:-.02em;overflow-wrap:anywhere;border-radius:9px;background:#f4f6f9;color:#263b57}.feedback:empty{display:none}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:6px 18px;margin-top:8px}.controls label{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;font-size:13px}.controls strong{font-variant-numeric:tabular-nums;color:var(--accent)}.between{justify-content:space-between}.stack{display:grid;gap:8px}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.panel{background:#f7f7f9;border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}.counter-area{display:flex;flex-wrap:wrap;min-height:100px;gap:3px;margin:8px 0;align-content:start}.counter-area button{min-width:44px;min-height:44px;border:0;background:transparent;font-size:29px;padding:0;line-height:1}.counter-area button:hover{background:#e4e7ec}.counter-area button:active{transform:scale(.9)}.cells{display:grid;gap:3px}.cells button{padding:0;min-height:0;aspect-ratio:1;background:#edf0f4;border-radius:4px}.position-field{position:relative;overflow:hidden;aspect-ratio:1.6;background:#f6f8fb;border:1px solid #d8dee7;border-radius:10px;margin:8px 0;background-image:linear-gradient(#dce2eb 1px,transparent 1px),linear-gradient(90deg,#dce2eb 1px,transparent 1px);background-size:10% 10%}.position-field .object{position:absolute;transform:translate(-50%,-50%);padding:5px;font-size:clamp(10px,2.5vw,15px);touch-action:none;min-height:34px;max-width:25%;overflow-wrap:anywhere;line-height:1.2;box-shadow:0 1px 4px #0001}.position-field .object:active{transform:translate(-50%,-50%)}.pitch{background:#b1d7ad;background-image:linear-gradient(90deg,transparent 49.7%,white 49.7%,white 50.3%,transparent 50.3%)}.court{background:#e8c1a8;background-image:linear-gradient(90deg,transparent 49.7%,white 49.7%,white 50.3%,transparent 50.3%)}.staff{background:repeating-linear-gradient(0deg,white 0 20px,#384c63 21px 22px,white 23px 40px)}.venn{background:radial-gradient(circle at 39% 50%,#78b5ec80 0 29%,transparent 30%),radial-gradient(circle at 61% 50%,#e4a34080 0 29%,transparent 30%),white}.regions{background:linear-gradient(135deg,#dcecd5 50%,#d4e8fa 50%)}.canvas{display:block;width:100%;height:auto;touch-action:none;border:1px solid var(--line);border-radius:8px}.stage-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 2px;font-size:11px;color:var(--muted)}.navbtn{min-height:44px;border:0;background:transparent;padding:8px 10px;white-space:nowrap}.navbtn:disabled{opacity:.3}.mobile-only{display:none}.overlay{display:none}.focus .shell{grid-template-columns:minmax(0,1fr)}.focus .sidebar{display:none}.focus .stage{max-width:1200px}.focus .stage-head{margin-bottom:12px}.focus .stage-foot .disclosure{display:none}
@media(max-width:760px){.shell{grid-template-columns:minmax(0,1fr);grid-template-rows:54px 1fr}.bar{padding:0 10px}.brand small{display:none}.brandmark{width:28px;height:28px}h1{font-size:14px}.prototype{display:none}.bar-actions{gap:1px}.mobile-only{display:inline-flex}.desktop-only{display:none}.sidebar{display:none;position:fixed;z-index:12;top:54px;left:0;bottom:0;max-height:none;width:min(88vw,350px);border:0;box-shadow:8px 0 40px #0002;padding:12px;overflow:auto}.library-open .sidebar{display:block}.library-open .overlay{display:block;position:fixed;inset:54px 0 0;background:#161b2760;z-index:11;border:0;border-radius:0;padding:0;min-height:0;width:100%}.stage{padding:14px 10px}.stage-head{align-items:center;margin-bottom:12px}.stage-actions{gap:0}.stage-actions .iconbtn{padding:8px}.eyebrow{font-size:11px;margin-bottom:4px}.board{border-radius:12px}.board-top{padding:8px 12px}.workspace{padding:12px}.visual svg{max-height:300px}.controls{grid-template-columns:1fr;gap:6px}.controls label{padding:7px 10px}.stage-foot{flex-wrap:wrap}.disclosure{order:2;width:100%}.counter-area button{min-width:44px}.two .panel{padding:9px}.stage-actions .label-text{display:none}.focus .stage{padding-top:8px}.focus .stage-head h2{font-size:20px}.focus .stage-head .eyebrow{display:none}.focus .sidebar{display:none}.focus.library-open .sidebar{display:block}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.counter-token{position:relative;touch-action:none}.counter-token:before{content:"";display:block;width:28px;height:28px;border-radius:50%;background:var(--token);border:1px solid #0002;box-shadow:inset 0 0 0 3px #ffffff30,0 2px 3px #0002;margin:auto}.counter-token:active{transform:none}.counter-area{overflow:visible}
</style></head><body><main class="shell"><header class="bar"><div class="brand"><span class="brandmark" aria-hidden="true">V</span><div><h1>VibeSchool</h1><small>Teaching tools</small></div></div><div class="bar-actions"><span class="prototype">Local preview</span><button id="library-toggle" class="iconbtn mobile-only" aria-expanded="false" aria-controls="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>Tools</button><button id="focus-toggle" class="iconbtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span id="focus-label">Focus</span></button></div></header><button class="overlay" id="overlay" aria-label="Close tool library"></button><aside class="sidebar" id="library"><div class="sidebar-head"><strong>Tool library</strong><button id="close-library" class="iconbtn mobile-only" aria-label="Close tool library">×</button></div><div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" aria-label="Find a tool" type="search" placeholder="Search tools"></div><label class="filter">Learning area<select id="category"></select></label><div class="list-meta"><span>Tools</span><span id="count"></span></div><label class="native-picker">Choose tool<select id="selected" tabindex="-1"></select></label><div id="tool-list" aria-label="Available tools"></div></aside><section class="stage"><div class="stage-head"><div><div class="eyebrow" id="subject-name"></div><h2 id="tool-title"></h2></div><div class="stage-actions"><button id="reset" class="iconbtn" aria-label="Reset tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/></svg><span class="label-text">Reset</span></button></div></div><div class="board"><div class="board-top"><span class="mode-label" id="tool-mode">Interactive model</span><span>Explore</span></div><div id="workspace" class="workspace"></div></div><footer class="stage-foot"><span class="disclosure">Local prototype · virtual measurements · no classroom connection</span><div><button id="prev" class="navbtn" aria-label="Previous tool">← Previous</button><button id="next" class="navbtn" aria-label="Next tool">Next →</button></div></footer></section></main><script>/* VibeSchool interactive tool prototypes. All quantities are virtual. No network or user data. */
const catalogue=[];
let subject='';
const category=s=>subject=s;
const add=(name,kind,config)=>catalogue.push({id:catalogue.length+1,subject,name,kind,...config});
const r=(label,min,max,value,step=1)=>({label,min,max,value,step});
const param=(name,inputs,view)=>add(name,'param',{inputs,view});
const tiles=(name,items,target,desc='Tap tiles to assemble your answer. Tap your answer to remove a tile.')=>add(name,'tiles',{items,target,desc});
const sequence=(name,items,desc='Put the steps in order.')=>add(name,'sequence',{items,desc});
const sort=(name,groups,items)=>add(name,'sort',{groups,items});
const match=(name,pairs)=>add(name,'match',{pairs});
const choice=(name,question,options,answer,explain)=>add(name,'choice',{question,options,answer,explain});
const grid=(name,rows,cols,desc,colors=['#2868c7','#e4a340','#29956d','#dd5960'])=>add(name,'grid',{rows,cols,desc,colors});
const draw=(name,desc,mode='free')=>add(name,'draw',{desc,mode});
const notes=(name,keys,desc)=>add(name,'notes',{keys,desc});
const positions=(name,objects,desc,bg='plain')=>add(name,'positions',{objects,desc,bg});
const clock=(h,m)=>{let hand=(a,len,w)=>`<line x1="160" y1="90" x2="${160+len*Math.sin(a*Math.PI/180)}" y2="${90-len*Math.cos(a*Math.PI/180)}" stroke="#18304b" stroke-width="${w}" stroke-linecap="round"/>`;return svg(`<circle cx="160" cy="90" r="75" fill="white" stroke="#18304b" stroke-width="2"/>${Array.from({length:12},(_,i)=>T(160+61*Math.sin(i*Math.PI/6),94-61*Math.cos(i*Math.PI/6),i||12)).join('')}${hand(h*30+m/2,40,5)}${hand(m*6,59,3)}`)};
const svg=(s)=>`<svg viewBox="0 0 320 180" role="img" aria-label="Interactive model visualization">${s}</svg>`;
const T=(x,y,t,size=12)=>`<text x="${x}" y="${y}" font-size="${size}" text-anchor="middle" fill="#23374c">${t}</text>`;
const rect=(x,y,w,h,c='#2868c7')=>`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" rx="2" fill="${c}" stroke="#32475a" stroke-width=".5"/>`;
const dot=(x,y,c='#2868c7',rad=9)=>`<circle cx="${x}" cy="${y}" r="${rad}" fill="${c}" stroke="#32475a" stroke-width=".5"/>`;
const line=(x,y,X,Y,c='#23374c',w=2)=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${c}" stroke-width="${w}"/>`;
const arr=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
const out=(visual,answer)=>({visual,answer});
const bars=(values,labels)=>svg(values.map((v,i)=>{let w=240/values.length;let h=120*v/Math.max(1,...values);return rect(40+i*w,145-h,w-12,h,['#2868c7','#e4a340','#29956d'][i%3])+T(40+i*w+(w-12)/2,140-h,v)+T(40+i*w+(w-12)/2,163,labels[i])}).join('')+line(28,145,300,145));
const objects=(a,b)=>svg(arr(a,i=>dot(28+i%6*22,45+Math.floor(i/6)*23))+arr(b,i=>dot(178+i%6*22,45+Math.floor(i/6)*23,'#e4a340'))+line(160,15,160,155)+T(80,170,'A')+T(240,170,'B'));
const axis=(a,b,lo=-10,hi=10)=>{const x=v=>20+280*(v-lo)/(hi-lo);return svg(line(20,90,300,90)+arr(hi-lo+1,i=>line(x(lo+i),85,x(lo+i),95)+((i%2===0||hi-lo<=10)?T(x(lo+i),112,lo+i,9):''))+dot(x(a),90)+dot(x(b),90,'#e4a340')+line(x(a),70,x(b),70,'#2868c7',3));};
const fraction=(a,b,circle)=>{a=Math.min(a,b);if(!circle)return svg(arr(b,i=>rect(20+i*280/b,60,280/b,60,i<a?'#2868c7':'#e2e8f0')));let pt=d=>[160+68*Math.sin(d),90-68*Math.cos(d)];return svg(b===1?dot(160,90,a?'#2868c7':'#e2e8f0',68):arr(b,i=>{let [x,y]=pt(i*2*Math.PI/b),[X,Y]=pt((i+1)*2*Math.PI/b);return `<path d="M160 90L${x} ${y}A68 68 0 ${b===1?1:0} 1 ${X} ${Y}Z" stroke="#23374c" fill="${i<a?'#2868c7':'#e2e8f0'}"/>`}));};
const balance=(a,b)=>{let slope=Math.max(-30,Math.min(30,(b-a)*2));return svg(`<path d="M160 78L135 154H185Z" fill="#b6c8dc"/>${line(50,78-slope,270,78+slope)}${line(65,78-slope,65,125-slope)}${line(255,78+slope,255,125+slope)}${rect(25,125-slope,80,12)}${rect(215,125+slope,80,12,'#e4a340')}${T(65,119-slope,a+' g')}${T(255,119+slope,b+' g')}`)};
const liquid=(v,max=100)=>svg(rect(122,20,76,140,'#e2e8f0')+rect(125,157-134*v/max,70,134*v/max,'#70b9ea')+arr(6,i=>line(181,157-i*26.8,198,157-i*26.8)+T(218,161-i*26.8,i*max/5,10)));
const dial=(v,max=180)=>svg(`<path d="M30 145A130 130 0 0 1 290 145Z" fill="#e6f0fa" stroke="#23374c"/>${arr(19,i=>{let a=i*Math.PI/18;return T(160+110*Math.cos(a),149-110*Math.sin(a),Math.round(i*max/18),9)})}${line(160,145,160+100*Math.cos(v*Math.PI/max),145-100*Math.sin(v*Math.PI/max),'#dd5960',3)}`);
const chart=(a,b,c)=>out(bars([a,b,c],['A','B','C']),`Total: ${a+b+c}`);
const pie=(a,b,c)=>{let vs=[a,b,c],total=a+b+c,angle=0;return svg(total?vs.map((v,i)=>{let start=angle;angle+=v*2*Math.PI/total;let x=160+68*Math.sin(start),y=90-68*Math.cos(start),X=160+68*Math.sin(angle),Y=90-68*Math.cos(angle);return v===0?'':v===total?dot(160,90,['#2868c7','#e4a340','#29956d'][i],68):`<path d="M160 90L${x} ${y}A68 68 0 ${v*2>total?1:0} 1 ${X} ${Y}Z" fill="${['#2868c7','#e4a340','#29956d'][i]}" stroke="white"/>`}).join(''):T(160,90,'No data'));};
category('Mathematics');
param('Ruler',[r('Start (cm)',0,10,2),r('End (cm)',0,10,7)],([a,b])=>out(svg(`<rect x="12" y="77" width="296" height="58" rx="5" fill="#f5dca0" stroke="#ad8d4e"/>`+arr(101,i=>line(20+i*2.8,78,20+i*2.8,78+(i%10===0?19:i%5===0?12:6),'#725b32',.7))+arr(11,i=>T(20+i*28,111,i,10))+T(20,128,'cm',9)+line(20+a*28,64,20+b*28,64,'#1769e0',3)+[a,b].map((n,i)=>line(20+n*28,55,20+n*28,78,i?'#cb8a22':'#1769e0',1.5)+dot(20+n*28,64,i?'#e4a340':'#2868c7',5)).join('')+T(160,34,`${Math.abs(a-b)} cm`,17)),`Length: ${Math.abs(a-b)} virtual cm`));
param('Compass',[r('Radius (virtual cm)',1,10,5),r('Sweep (°)',0,360,120)],([a,b])=>{let R=a*6,t=b*Math.PI/180;return out(svg(dot(160,90,'#23374c',3)+line(160,90,160+R*Math.cos(t),90+R*Math.sin(t))+ (b===360?`<circle cx="160" cy="90" r="${R}" fill="none" stroke="#2868c7"/>`:`<path d="M${160+R} 90 A${R} ${R} 0 ${b>180?1:0} 1 ${160+R*Math.cos(t)} ${90+R*Math.sin(t)}" fill="none" stroke="#2868c7" stroke-width="3"/>`)),`Radius ${a}, arc ${b}°`)});
param('Protractor',[r('Angle (°)',0,180,60)],([a])=>out(dial(a),`${a}°`));
param('Set square',[r('Rotation (°)',0,360,30)],([a])=>out(svg(`<g transform="rotate(${a} 160 90)"><path d="M115 130V45L205 130Z" fill="#f9e6a8" stroke="#23374c"/><path d="M115 115H130V130" fill="none" stroke="#23374c"/></g>`),'The marked corner stays 90°.'));
add('Counters','counters',{});
positions('Counting sticks',['I','I','I','I','I','I','I','I','I','I'],'Move ten sticks into a bundle; count groups.');
param('Abacus',[r('Hundreds',0,9,1),r('Tens',0,9,3),r('Ones',0,9,5)],vs=>out(svg(vs.map((v,i)=>line(40,42+i*47,280,42+i*47)+arr(v,j=>dot(50+j*23,42+i*47,['#2868c7','#e4a340','#29956d'][i],10))).join('')),`${vs[0]*100+vs[1]*10+vs[2]}`));
param('Base-ten blocks',[r('Tens',0,9,2),r('Ones',0,9,4)],([a,b])=>out(svg(arr(a,i=>rect(18+i*20,25,15,120))+arr(b,i=>rect(210+i%3*27,40+Math.floor(i/3)*27,18,18,'#e4a340'))),`${10*a+b}`));
param('Number line',[r('Start',-10,10,-3),r('End',-10,10,4)],([a,b])=>out(axis(a,b),`Signed change: ${b-a}`));
for(const [name,circle] of [['Fraction circles',true],['Fraction bars',false]])param(name,[r('Shaded parts',0,12,2),r('Total parts',1,12,4)],([a,b])=>out(fraction(a,b,circle),`${Math.min(a,b)}/${b}`));

draw(t,p){promptText(p,t.desc);let color='#2868c7',tools=wrap(p),canvas=el('canvas');canvas.width=640;canvas.height=400;canvas.className='canvas';canvas.setAttribute('aria-label','Drawing board');let c=canvas.getContext('2d'),down=null,history=[];const base=()=>{c.fillStyle='#fff';c.fillRect(0,0,640,400);c.strokeStyle='#e0e7ef';c.lineWidth=1;for(let i=0;i<640;i+=20){c.beginPath();c.moveTo(i,0);c.lineTo(i,400);c.stroke()}for(let i=0;i<400;i+=20){c.beginPath();c.moveTo(0,i);c.lineTo(640,i);c.stroke()}if(t.mode==='mirror'){c.strokeStyle='#dd5960';c.beginPath();c.moveTo(320,0);c.lineTo(320,400);c.stroke()}};base();['#2868c7','#dd5960','#29956d','#222222'].forEach(k=>{let b=button('■',()=>color=k);b.style.color=k;tools.append(b)});tools.append(button('Undo',()=>{if(history.length)c.putImageData(history.pop(),0,0)}));p.append(canvas);function point(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*400/r.height]}function stroke(a,b){c.strokeStyle=color;c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke();if(t.mode==='mirror'){c.beginPath();c.moveTo(640-a[0],a[1]);c.lineTo(640-b[0],b[1]);c.stroke()}}canvas.onpointerdown=e=>{history.push(c.getImageData(0,0,640,400));if(history.length>15)history.shift();down=point(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!down||t.mode==='line')return;let b=point(e);stroke(down,b);down=b};canvas.onpointerup=e=>{if(down)stroke(down,point(e));down=null};canvas.onpointercancel=()=>down=null;tools.append(button('Draw sample',()=>{history.push(c.getImageData(0,0,640,400));stroke([100,120],[240,240])}))},

function score(t,p,prefix){let counts=t.options.map(()=>0),o=feedback(p),row=wrap(p);t.options.forEach((s,i)=>row.append(button(prefix+s,()=>{counts[i]++;update()})));function update(){o.textContent=t.options.map((s,i)=>`${s}: ${counts[i]}`).join(' · ')}update()}
let audio;function tone(f,type){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let n=audio.createOscillator(),g=audio.createGain();n.type=type;n.frequency.value=f;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);n.connect(g).connect(audio.destination);n.start();n.stop(audio.currentTime+.22)}catch{}}
const iconPaths={param:'<path d="M4 17h16M6 17V7m4 10V4m4 13v-7m4 7V6"/>',counters:'<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="8" cy="16" r="3"/><circle cx="16" cy="16" r="3"/>',tiles:'<rect x="3" y="5" width="8" height="8" rx="1"/><rect x="13" y="11" width="8" height="8" rx="1"/>',positions:'<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>',draw:'<path d="m4 20 4-1 12-12-4-4L4 15zM13 6l4 4"/>',grid:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/>',default:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/>'};
const modeNames={param:'Adjustable model',counters:'Manipulative',positions:'Movable objects',draw:'Drawing canvas',grid:'Interactive grid',sequence:'Ordering activity',sort:'Sorting activity',match:'Matching activity',tiles:'Building activity',choice:'Question activity',notes:'Writing activity'};
let visibleTools=[];
function syncNavigation(){const i=visibleTools.findIndex(t=>t.id===active.id);$('#prev').disabled=i<=0;$('#next').disabled=i<0||i===visibleTools.length-1;for(const b of $('#tool-list').children)b.setAttribute('aria-current',String(Number(b.dataset.id)===active.id));}
function openTool(t){cleanup();cleanup=()=>{};active=t;$('#tool-title').textContent=t.name;$('#subject-name').textContent=t.subject;$('#tool-mode').textContent=modeNames[t.kind]||'Interactive activity';let p=$('#workspace');p.replaceChildren();renderers[t.kind](t,p);$('#selected').value=String(t.id);$('#reset').disabled=false;$('#reset').onclick=()=>openTool(t);syncNavigation()}
function library(open){document.body.classList.toggle('library-open',open);$('#library-toggle').setAttribute('aria-expanded',String(open));if(open)$('#search').focus();else if(matchMedia('(max-width:760px)').matches)$('#library-toggle').focus()}
function populate(){let cat=$('#category').value,search=$('#search').value.trim().toLowerCase();let list=catalogue.filter(t=>(cat==='All subjects'||cat===t.subject)&&(t.name+' '+t.subject).toLowerCase().includes(search));visibleTools=list;let select=$('#selected'),menu=$('#tool-list');select.replaceChildren();menu.replaceChildren();list.forEach(t=>{let o=el('option',`${t.name} — ${t.subject}`);o.value=t.id;select.append(o);let b=button('',()=>{openTool(t);if(matchMedia('(max-width:760px)').matches)library(false)});b.dataset.id=t.id;let icon=el('span',undefined,'tool-icon');icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(iconPaths[t.kind]||iconPaths.default)+'</svg>';let info=el('span',t.name,'tool-info');info.append(el('small',modeNames[t.kind]||'Interactive activity'));b.append(icon,info,el('span','›','tool-chevron'));menu.append(b)});$('#count').textContent=`${list.length} / ${catalogue.length}`;if(list.length){let t=list.find(x=>x.id===active.id)||list[0];if(t!==active||!$('#workspace').children.length||$('#reset').disabled)openTool(t);else syncNavigation()}else{cleanup();cleanup=()=>{};$('#workspace').replaceChildren(el('p','No matching tools. Try another search.'));$('#tool-title').textContent='No results';$('#subject-name').textContent='';$('#tool-mode').textContent='Tool library';$('#reset').disabled=true;syncNavigation()}}
['All subjects',...new Set(catalogue.map(t=>t.subject))].forEach(x=>$('#category').append(el('option',x)));$('#category').onchange=populate;$('#search').oninput=populate;$('#selected').onchange=()=>openTool(catalogue.find(t=>t.id===Number($('#selected').value)));$('#library-toggle').onclick=()=>library(!document.body.classList.contains('library-open'));$('#close-library').onclick=$('#overlay').onclick=()=>library(false);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('library-open'))library(false)});$('#focus-toggle').onclick=()=>{let on=document.body.classList.toggle('focus');$('#focus-toggle').setAttribute('aria-pressed',String(on));$('#focus-label').textContent=on?'Exit focus':'Focus'};$('#prev').onclick=()=>{let i=visibleTools.findIndex(t=>t.id===active.id);if(i>0)openTool(visibleTools[i-1])};$('#next').onclick=()=>{let i=visibleTools.findIndex(t=>t.id===active.id);if(i>=0&&i<visibleTools.length-1)openTool(visibleTools[i+1])};populate();
</script></body></html>
