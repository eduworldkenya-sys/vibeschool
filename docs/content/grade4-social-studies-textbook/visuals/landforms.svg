<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Different shapes of land</title><desc id="desc">A mountain, a valley, a small hill, a raised flat plateau and a low flat plain shown in a simple cross-section.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315f4e"/></marker></defs><rect width="800" height="360" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18352e">Different shapes of land</text><path d="M45 280 L115 270 L195 95 L270 260 L333 195 L385 260 L465 133 L600 133 L655 280 L755 280 L755 316 L45 316 Z" fill="#dcebdd" stroke="#315f4e" stroke-width="3"/><text x="180" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#18352e">Mountain</text><text x="325" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#18352e">Hill</text><text x="532" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#18352e">Plateau</text><text x="272" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#18352e">Valley</text><line x1="272" y1="287" x2="272" y2="262" stroke="#315f4e" stroke-width="3" marker-end="url(#arrow)"/><text x="705" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#18352e">Plain</text></svg>
