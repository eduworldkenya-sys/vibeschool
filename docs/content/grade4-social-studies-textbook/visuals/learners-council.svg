<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Example of a learner council</title><desc id="desc">A chairperson coordinates meetings; the secretary, class representatives and welfare representatives support the council. School adults retain responsibility for safety.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315f4e"/></marker></defs><rect width="800" height="360" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18352e">Example of a learner council</text><rect x="260" y="72" width="280" height="67" rx="9" fill="#d4e9da" stroke="#56816f" stroke-width="2"/><text x="400" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#18352e">Chairperson</text><line x1="400" y1="139" x2="400" y2="174" stroke="#315f4e" stroke-width="3"/><line x1="140" y1="174" x2="660" y2="174" stroke="#315f4e" stroke-width="3"/><line x1="140" y1="174" x2="140" y2="205" stroke="#315f4e" stroke-width="3" marker-end="url(#arrow)"/><line x1="400" y1="174" x2="400" y2="205" stroke="#315f4e" stroke-width="3" marker-end="url(#arrow)"/><line x1="660" y1="174" x2="660" y2="205" stroke="#315f4e" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="205" width="230" height="70" rx="9" fill="#f1f6f3" stroke="#56816f" stroke-width="2"/><text x="140" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#18352e">Class representatives</text><rect x="285" y="205" width="230" height="70" rx="9" fill="#f1f6f3" stroke="#56816f" stroke-width="2"/><text x="400" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#18352e">Secretary</text><rect x="545" y="205" width="230" height="70" rx="9" fill="#f1f6f3" stroke="#56816f" stroke-width="2"/><text x="660" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#18352e">Welfare representatives</text><text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#18352e">Example roles: schools may organise them differently.</text></svg>
