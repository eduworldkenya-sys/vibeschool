<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">How people are spread out</title><desc id="desc">Three equal rectangles show a cluster of dots, dots aligned beside a road and scattered dots. Each dot represents the same number of people.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315f4e"/></marker></defs><rect width="800" height="360" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18352e">How people are spread out</text><rect x="35" y="85" width="228" height="228" rx="9" fill="#f8faf7" stroke="#56816f" stroke-width="2"/><text x="149" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#18352e">Clustered</text><circle cx="129" cy="185" r="9" fill="#26734c"/><circle cx="155" cy="185" r="9" fill="#26734c"/><circle cx="181" cy="185" r="9" fill="#26734c"/><circle cx="129" cy="211" r="9" fill="#26734c"/><circle cx="155" cy="211" r="9" fill="#26734c"/><circle cx="181" cy="211" r="9" fill="#26734c"/><rect x="286" y="85" width="228" height="228" rx="9" fill="#f8faf7" stroke="#56816f" stroke-width="2"/><text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#18352e">Along a route</text><line x1="400" y1="96" x2="400" y2="302" stroke="#c2b69d" stroke-width="5"/><circle cx="387" cy="134" r="9" fill="#26734c"/><circle cx="387" cy="164" r="9" fill="#26734c"/><circle cx="387" cy="194" r="9" fill="#26734c"/><circle cx="387" cy="224" r="9" fill="#26734c"/><circle cx="387" cy="254" r="9" fill="#26734c"/><circle cx="387" cy="284" r="9" fill="#26734c"/><rect x="537" y="85" width="228" height="228" rx="9" fill="#f8faf7" stroke="#56816f" stroke-width="2"/><text x="651" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#18352e">Scattered</text><circle cx="575" cy="129" r="9" fill="#26734c"/><circle cx="717" cy="134" r="9" fill="#26734c"/><circle cx="621" cy="190" r="9" fill="#26734c"/><circle cx="704" cy="215" r="9" fill="#26734c"/><circle cx="585" cy="274" r="9" fill="#26734c"/><circle cx="727" cy="283" r="9" fill="#26734c"/><text x="400" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#18352e">Each dot stands for the same number of people.</text></svg>
