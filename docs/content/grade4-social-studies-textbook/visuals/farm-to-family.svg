<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">From farm to family</title><desc id="desc">Four connected boxes show a farmer growing beans, a transport worker carrying them, a trader selling them and a family buying and cooking them.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315f4e"/></marker></defs><rect width="800" height="360" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18352e">From farm to family</text><rect x="24" y="124" width="160" height="112" rx="9" fill="#f1f6f3" stroke="#56816f" stroke-width="2"/><text x="104" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#18352e">Farmer</text><text x="104" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#18352e">Grows beans</text><line x1="187" y1="180" x2="217" y2="180" stroke="#315f4e" stroke-width="3" marker-end="url(#arrow)"/><rect x="221" y="124" width="160" height="112" rx="9" fill="#f1f6f3" stroke="#56816f" stroke-width="2"/><text x="301" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#18352e">Transport worker</text><text x="301" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#18352e">Carries beans</text><line x1="384" y1="180" x2="414" y2="180" stroke="#315f4e" stroke-width="3" marker-end="url(#arrow)"/><rect x="418" y="124" width="160" height="112" rx="9" fill="#f1f6f3" stroke="#56816f" stroke-width="2"/><text x="498" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#18352e">Trader</text><text x="498" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#18352e">Sells beans</text><line x1="581" y1="180" x2="611" y2="180" stroke="#315f4e" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="124" width="160" height="112" rx="9" fill="#f1f6f3" stroke="#56816f" stroke-width="2"/><text x="695" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#18352e">Family</text><text x="695" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#18352e">Buys and cooks</text><text x="400" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#18352e">Each person contributes to the next step.</text></svg>
