<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Two parts of a county government</title><desc id="desc">County government branches into the county executive led by the governor and the county assembly with MCAs and other members. The executive delivers functions; the assembly makes county laws and oversees executive work.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315f4e"/></marker></defs><rect width="800" height="360" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18352e">Two parts of a county government</text><rect x="250" y="70" width="300" height="66" rx="9" fill="#d4e9da" stroke="#56816f" stroke-width="2"/><text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#18352e">County government</text><line x1="400" y1="136" x2="400" y2="162" stroke="#315f4e" stroke-width="3"/><line x1="220" y1="162" x2="580" y2="162" stroke="#315f4e" stroke-width="3"/><line x1="220" y1="162" x2="220" y2="190" stroke="#315f4e" stroke-width="3" marker-end="url(#arrow)"/><line x1="580" y1="162" x2="580" y2="190" stroke="#315f4e" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="190" width="350" height="128" rx="9" fill="#f1f6f3" stroke="#56816f" stroke-width="2"/><text x="220" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#18352e">County executive</text><text x="220" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#18352e">Governor and deputy</text><text x="220" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#18352e">Implements county functions</text><rect x="405" y="190" width="350" height="128" rx="9" fill="#f1f6f3" stroke="#56816f" stroke-width="2"/><text x="580" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#18352e">County assembly</text><text x="580" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#18352e">MCAs and other members</text><text x="580" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#18352e">Laws and oversight</text></svg>
