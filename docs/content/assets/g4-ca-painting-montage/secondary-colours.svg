<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-label="Paint mixtures: red and yellow make orange, yellow and blue make green, blue and red make purple"><rect width="620" height="320" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#17202a"><text x="120" y="65">RED + YELLOW</text><text x="300" y="65">YELLOW + BLUE</text><text x="480" y="65">BLUE + RED</text><circle cx="120" cy="155" r="58" fill="#e67e22"/><circle cx="300" cy="155" r="58" fill="#27ae60"/><circle cx="480" cy="155" r="58" fill="#8e44ad"/><text x="120" y="240">ORANGE</text><text x="300" y="240">GREEN</text><text x="480" y="240">PURPLE</text></g></svg>