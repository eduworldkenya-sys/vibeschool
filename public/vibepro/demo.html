<script>
(function(){'use strict';
const C=n=>Math.round(Number(n)*100), money=n=>'KSh '+(n/100).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10), id=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4), fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-KE',{day:'numeric',month:'short',year:'numeric'}):'—';
const AC=[['1000','Cash & Bank','asset'],['1100','Accounts Receivable','asset'],['1200','Inventory','asset'],['1500','Equipment','asset'],['2000','Accounts Payable','liability'],['3000','Owner Capital','equity'],['4000','Sales Revenue','income'],['4100','Other Income','income'],['5000','Cost of Goods Sold','expense'],['6000','Operating Expenses','expense']];
function company(name,seed){const c={id:id(),name,people:[{id:'cust1',type:'customer',name:'Kijani Builders',email:'accounts@sample.invalid'},{id:'cust2',type:'customer',name:'Riverside Interiors',email:''},{id:'cust3',type:'customer',name:'Sunrise Homes',email:''},{id:'sup1',type:'supplier',name:'Metro Wholesale',email:''}],products:[{id:'p1',sku:'PT-100',name:'Premium Paint · 20L',price:C(3900),cost:C(2600),qty:0,reorder:8},{id:'p2',sku:'PR-210',name:'Wall Primer · 10L',price:C(2100),cost:C(1350),qty:0,reorder:10},{id:'p3',sku:'DB-300',name:'Drywall Board',price:C(1480),cost:C(920),qty:0,reorder:15}],invoices:[],expenses:[],purchases:[],journals:[],feed:[],team:[{id:'t1',name:'Jean K.',role:'Accountant',email:'demo@sample.invalid'},{id:'t2',name:'Alex M.',role:'Owner',email:'owner@sample.invalid'}]};if(!seed)return c;
 post(c,'OPEN-001','Opening capital',[['1000',C(950000),0],['3000',0,C(950000)]],'2026-11-01','opening');
 addStock(c,'p1',24,'sup1','2026-11-02');addStock(c,'p2',30,'sup1','2026-11-02');addStock(c,'p3',50,'sup1','2026-11-02');
 addExpense(c,'Office rent',C(28000),'paid','2026-11-03');addExpense(c,'Internet and software',C(4500),'paid','2026-11-05');
 let i=makeInvoice(c,'cust1','p1',6,'2026-11-04','2026-11-25');issueInvoice(c,i);receivePayment(c,i,C(14000),'2026-11-06');
 i=makeInvoice(c,'cust2','p2',12,'2026-11-06','2026-11-28');issueInvoice(c,i);
 i=makeInvoice(c,'cust3','p3',10,'2026-11-07','2026-11-20');issueInvoice(c,i);receivePayment(c,i,C(14800),'2026-11-09');
 payPurchase(c,c.purchases[0],C(40000),'2026-11-10');
 c.feed=[{id:'b1',date:'2026-11-06',desc:'Kijani Builders bank transfer',amount:C(14000),matched:null},{id:'b2',date:'2026-11-03',desc:'Rent payment',amount:-C(28000),matched:null},{id:'b3',date:'2026-11-09',desc:'Sunrise Homes transfer',amount:C(14800),matched:null},{id:'b4',date:'2026-11-10',desc:'Metro Wholesale settlement',amount:-C(40000),matched:null},{id:'b5',date:'2026-11-05',desc:'Software subscription',amount:-C(4500),matched:null},{id:'b6',date:'2026-11-11',desc:'Monthly bank charge',amount:-C(650),matched:null}];return c;}
function post(c,ref,memo,rows,date= today(),type='manual'){const lines=rows.map(([a,dr,cr])=>({a,dr,cr}));if(!lines.length||lines.some(x=>!AC.find(a=>a[0]===x.a)||x.dr<0||x.cr<0||(!x.dr&&!x.cr)||x.dr&&x.cr))throw Error('Invalid journal line');const debit=lines.reduce((n,x)=>n+x.dr,0),credit=lines.reduce((n,x)=>n+x.cr,0);if(debit!==credit||debit===0)throw Error('Journal must balance');let j={id:id(),ref,memo,lines,date,type,createdAt:Date.now()};c.journals.push(j);return j;}
function addStock(c,pid,qty,sid,date=today()){const p=c.products.find(x=>x.id===pid);if(!p||qty<1||!Number.isInteger(qty))throw Error('Invalid stock quantity');const total=p.cost*qty;p.qty+=qty;const pu={id:id(),no:'BILL-'+String(c.purchases.length+1).padStart(3,'0'),vendor:sid,product:pid,qty,amount:total,paid:0,date};c.purchases.push(pu);post(c,pu.no,'Inventory purchase — '+p.name,[['1200',total,0],['2000',0,total]],date,'purchase');return pu;}
function makeInvoice(c,cid,pid,qty,date=today(),due=date){let p=c.products.find(x=>x.id===pid);if(!p||!c.people.find(x=>x.id===cid&&x.type==='customer')||!Number.isInteger(qty)||qty<1)throw Error('Check customer, item and quantity');const inv={id:id(),no:'INV-'+String(c.invoices.length+1).padStart(4,'0'),customer:cid,product:pid,qty,unitPrice:p.price,amount:p.price*qty,unitCost:p.cost,paid:0,date,due,status:'draft'};c.invoices.push(inv);return inv;}
function issueInvoice(c,inv){if(inv.status!=='draft')throw Error('This invoice is already posted');const p=c.products.find(x=>x.id===inv.product);if(p.qty<inv.qty)throw Error('Not enough stock. Restock before posting.');p.qty-=inv.qty;inv.status='posted';post(c,inv.no,'Customer invoice',[['1100',inv.amount,0],['4000',0,inv.amount]],inv.date,'sale');let cost=inv.unitCost*inv.qty;post(c,inv.no+'-COGS','Cost of goods sold',[['5000',cost,0],['1200',0,cost]],inv.date,'cogs');}
function receivePayment(c,inv,amount,date=today()){if(inv.status!=='posted'||amount<=0||amount>inv.amount-inv.paid)throw Error('Invalid payment amount');inv.paid+=amount;return post(c,'PAY-'+inv.no,'Payment received · '+inv.no,[['1000',amount,0],['1100',0,amount]],date,'payment');}
function addExpense(c,desc,amount,status,date=today()){if(!desc.trim()||amount<1)throw Error('Enter a description and valid amount');const e={id:id(),no:'EXP-'+String(c.expenses.length+1).padStart(4,'0'),desc,amount,paid:status==='paid'?amount:0,date};c.expenses.push(e);post(c,e.no,desc,[['6000',amount,0],[status==='paid'?'1000':'2000',0,amount]],date,'expense');return e;}
function payExpense(c,e,date=today()){if(e.paid>=e.amount)throw Error('Already paid');let amt=e.amount-e.paid;e.paid+=amt;post(c,'SET-'+e.no,'Bill paid · '+e.desc,[['2000',amt,0],['1000',0,amt]],date,'billpay');}
function payPurchase(c,p,amount,date=today()){if(amount<=0||amount>p.amount-p.paid)throw Error('Invalid supplier payment');p.paid+=amount;post(c,'SET-'+p.no,'Supplier payment',[['2000',amount,0],['1000',0,amount]],date,'supplierpay');}
function bal(c,a){return c.journals.reduce((sum,j)=>sum+j.lines.filter(l=>l.a===a).reduce((s,l)=>s+l.dr-l.cr,0),0)}
function figures(c){let bank=bal(c,'1000'),ar=bal(c,'1100'),inventory=bal(c,'1200'),equipment=bal(c,'1500'),ap=-bal(c,'2000'),capital=-bal(c,'3000'),sales=-bal(c,'4000'),other=-bal(c,'4100'),cogs=bal(c,'5000'),op=bal(c,'6000');return {bank,ar,inventory,equipment,ap,capital,sales,other,cogs,op,profit:sales+other-cogs-op,assets:bank+ar+inventory+equipment};}
const ICONS={overview:'▦',sales:'▤',expenses:'▧',banking:'⇄',inventory:'▣',ledger:'≡',reports:'▥',contacts:'♙',templates:'▩',team:'♧',integrations:'◇'};const NAV=[['overview','Overview'],['sales','Sales & Invoices'],['expenses','Bills & Expenses'],['banking','Banking'],['inventory','Inventory'],['ledger','General Ledger'],['reports','Reports'],['contacts','Contacts'],['templates','Templates'],['team','Team & Roles'],['integrations','Integrations']];
let store;try{store=JSON.parse(localStorage.getItem('vibepro-demo-v2')||'null')}catch(e){}if(!store?.companies?.length){const first=company('ApexPlaster · Demo',true),other=company('Gilowinc · Demo',false);store={companies:[first,other],active:first.id};}
let view='overview',search='',report='pnl',only='all';function current(){return store.companies.find(c=>c.id===store.active)||store.companies[0]}function persist(){try{localStorage.setItem('vibepro-demo-v2',JSON.stringify(store))}catch(e){}}function save(msg){persist();render();if(msg)toast(msg)}function toast(msg){let h=document.getElementById('toastHost');h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(window.__vpt);window.__vpt=setTimeout(()=>h.innerHTML='',3500)}function nam(c,pid){return c.people.find(p=>p.id===pid)?.name||'Unknown'}function product(c,pid){return c.products.find(x=>x.id===pid)}function stateInvoice(i){return i.status==='draft'?'Draft':i.paid>=i.amount?'Paid':i.paid>0?'Part paid':'Unpaid'}function tag(text){let cls= /paid|matched|active/i.test(text)&&!(/unpaid|part paid/i.test(text))?'green':/draft|pending|part paid/i.test(text)?'orange':/unpaid|overdue|low/i.test(text)?'red':'gray';return `<span class="tag ${cls}">${esc(text)}</span>`}function minPage(title,desc,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}function btn(label,act,kind=''){return `<button class="btn ${kind}" data-act="${act}">${label}</button>`}function table(headers,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="empty"><strong>Nothing here yet</strong>Use the action above to add your first record.</div></td></tr>`}</tbody></table></div>`}function emptyRow(n,msg='No matching records'){return `<tr><td colspan="${n}"><div class="empty">${msg}</div></td></tr>`}
function render(){const c=current();document.getElementById('nav').innerHTML=NAV.map(([k,n])=>`<button data-nav="${k}" class="${view===k?'active':''}"><span style="width:18px;font-size:19px;text-align:center;line-height:1">${ICONS[k]}</span><span>${n}</span></button>`).join('');document.getElementById('section-name').textContent=NAV.find(([k])=>k===view)?.[1]||'Overview';document.getElementById('companySelect').innerHTML=store.companies.map(x=>`<option value="${x.id}" ${x.id===store.active?'selected':''}>${esc(x.name)}</option>`).join('')+'<option value="new">＋ New demo company</option>';document.getElementById('searchBox').value=search;renderPanel()}
function renderPanel(){let c=current(),f=figures(c),html='';switch(view){case 'overview':html=overview(c,f);break;case 'sales':html=sales(c);break;case 'expenses':html=expenses(c);break;case 'banking':html=banking(c);break;case 'inventory':html=inventory(c);break;case 'ledger':html=ledger(c);break;case 'reports':html=reports(c,f);break;case 'contacts':html=contacts(c);break;case 'templates':html=templates(c);break;case 'team':html=team(c);break;case 'integrations':html=integrations(c);break;default:html=proPage(view,c,f);break;}document.getElementById('workspace').innerHTML=html+`<div class="footer-note">VibePro interactive prototype · All figures and identities are fictional · Browser-only demo · No live connections, tax submissions or payments</div>`;}
function overview(c,f){let pending=c.invoices.filter(i=>i.status==='posted'&&i.paid<i.amount).length,unmatched=c.feed.filter(x=>!x.matched).length,low=c.products.filter(x=>x.qty<=x.reorder).length;let recent=c.journals.slice(-5).reverse();const max=Math.max(f.sales+f.other,f.cogs+f.op,1);return `<div class="intro"><div><div class="eyebrow" style="color:#bcb8ff;margin-bottom:6px">ACCOUNTANT WORKSPACE</div><h2>Good to see you, Jean.</h2><p>${esc(c.name)} · All financial activity in one place.</p></div>${btn('New invoice','new-invoice')}</div>${minPage('Financial overview','Live calculations from this demo company’s journal')}
<div class="grid4"><div class="card stat"><div class="stat-top">Cash & Bank<span class="stat-icon">↗</span></div><strong>${money(f.bank)}</strong><small>Ledger balance</small></div><div class="card stat"><div class="stat-top">Receivables<span class="stat-icon">◎</span></div><strong>${money(f.ar)}</strong><small>${pending} open invoices</small></div><div class="card stat"><div class="stat-top">Sales revenue<span class="stat-icon">▤</span></div><strong>${money(f.sales)}</strong><small>Posted invoices</small></div><div class="card stat"><div class="stat-top">Net result<span class="stat-icon">◈</span></div><strong class="${f.profit>=0?'green':'red'}">${money(f.profit)}</strong><small>Sales − COGS − expenses</small></div></div>
<div style="height:17px"></div><div class="grid2"><div class="card panel"><div class="panel-h"><h2>Quick actions</h2><small>Daily accounting tasks</small></div><div class="shortcuts"><button class="shortcut" data-act="new-invoice"><span class="emoji">＋</span><b>New invoice</b></button><button class="shortcut" data-act="new-expense"><span class="emoji">▧</span><b>Record expense</b></button><button class="shortcut" data-nav="banking"><span class="emoji">⇄</span><b>Reconcile bank</b></button><button class="shortcut" data-nav="reports"><span class="emoji">▥</span><b>View reports</b></button></div><div style="height:20px"></div><div class="panel-h"><h2>Recent journal activity</h2><button class="text-link" data-nav="ledger">View ledger →</button></div>${recent.map(j=>`<div class="kv"><div><strong>${esc(j.ref)}</strong><div class="hint">${esc(j.memo)} · ${fmtDate(j.date)}</div></div><strong>${money(j.lines.reduce((a,l)=>a+l.dr,0))}</strong></div>`).join('')||'<div class="empty">No transactions posted yet.</div>'}</div><div class="card panel"><div class="panel-h"><h2>Cash flow & attention</h2><small>Since demo opening</small></div><div class="barline"><div class="barlbl"><span>Revenue</span><strong>${money(f.sales+f.other)}</strong></div><div class="track"><div class="fill greenfill" style="width:${100*(f.sales+f.other)/max}%"></div></div></div><div class="barline"><div class="barlbl"><span>Cost of goods + expenses</span><strong>${money(f.cogs+f.op)}</strong></div><div class="track"><div class="fill amber" style="width:${100*(f.cogs+f.op)/max}%"></div></div></div><hr class="sep"><div class="kv"><span>Bank lines to review</span><strong>${unmatched}</strong></div><div class="kv"><span>Unpaid supplier bills</span><strong>${c.purchases.filter(p=>p.paid<p.amount).length+c.expenses.filter(e=>e.paid<e.amount).length}</strong></div><div class="kv"><span>Items near reorder level</span><strong>${low}</strong></div><div class="kv"><span>Ledger balance check</span>${tag(c.journals.every(j=>j.lines.reduce((s,l)=>s+l.dr-l.cr,0)===0)?'Balanced':'Review needed')}</div></div></div>`}
function sales(c){let rows=c.invoices.filter(i=>(i.no+' '+nam(c,i.customer)+' '+product(c,i.product)?.name).toLowerCase().includes(search.toLowerCase())&&(only==='all'||(only==='open'&&i.status==='posted'&&i.paid<i.amount)||(only==='draft'&&i.status==='draft'))).slice().reverse().map(i=>`<tr><td><strong>${esc(i.no)}</strong><div class="hint">${fmtDate(i.date)}</div></td><td>${esc(nam(c,i.customer))}</td><td>${esc(product(c,i.product)?.name)} × ${i.qty}</td><td class="dnum">${money(i.amount)}</td><td class="dnum">${money(Math.max(0,i.amount-i.paid))}</td><td>${tag(stateInvoice(i))}</td><td><div class="rowactions"><button class="btn small" data-act="invoice-detail" data-id="${i.id}">Open</button>${i.status==='draft'?`<button class="btn small soft" data-act="issue-invoice" data-id="${i.id}">Post</button>`:i.status==='posted'&&i.paid<i.amount?`<button class="btn small soft" data-act="pay-invoice" data-id="${i.id}">Receive</button>`:''}</div></td></tr>`).join('');return minPage('Sales & invoices','Create invoices, post them and record customer payments',btn('+ Create invoice','new-invoice','primary'))+`<div class="notice"><span>ⓘ</span><div>Drafts do not affect accounts. <b>Posting an invoice</b> updates receivables, sales, cost of goods and stock; payments update the bank and receivables.</div></div><div class="tabbar">${[['all','All invoices'],['open','Outstanding'],['draft','Drafts']].map(([k,v])=>`<button class="${only===k?'on':''}" data-filter="${k}">${v}</button>`).join('')}</div><div class="card">${table(['Invoice','Customer','Item','Total','Balance due','Status','Actions'],rows||emptyRow(7))}</div>`}
function expenses(c){const rows=[...c.expenses.map(e=>({kind:'expense',obj:e,no:e.no,desc:e.desc,amount:e.amount,due:e.amount-e.paid,date:e.date})),...c.purchases.map(p=>({kind:'purchase',obj:p,no:p.no,desc:'Stock · '+product(c,p.product)?.name,amount:p.amount,due:p.amount-p.paid,date:p.date}))].filter(e=>(e.no+' '+e.desc).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td><strong>${e.no}</strong><div class="hint">${fmtDate(e.date)}</div></td><td>${esc(e.desc)}</td><td>${e.kind==='purchase'?'Inventory bill':'Operating expense'}</td><td>${money(e.amount)}</td><td>${money(e.due)}</td><td>${tag(e.due?'Unpaid':'Paid')}</td><td>${e.due?`<button class="btn small soft" data-act="pay-bill" data-kind="${e.kind}" data-id="${e.obj.id}">Pay</button>`:'—'}</td></tr>`).join('');return minPage('Bills & expenses','Supplier obligations and daily costs',btn('+ Record expense','new-expense','primary')+btn('Restock inventory','new-restock'))+`<div class="card">${table(['Reference','Description','Type','Amount','Balance','Status','Action'],rows||emptyRow(7))}</div>`}
function bankCandidates(c,b){const used=new Set(c.feed.map(x=>x.matched).filter(Boolean));return c.journals.filter(j=>!used.has(j.id)&&j.lines.some(l=>l.a==='1000'&&l.dr-l.cr===b.amount))}
function banking(c){const unmatched=c.feed.filter(b=>!b.matched).length,matched=c.feed.length-unmatched;const rows=c.feed.filter(b=>(b.desc+' '+b.date).toLowerCase().includes(search.toLowerCase())).map(b=>{let opt=bankCandidates(c,b);return `<tr><td>${fmtDate(b.date)}</td><td><strong>${esc(b.desc)}</strong><div class="hint">${esc(b.id.toUpperCase())}</div></td><td class="${b.amount>=0?'green':'red'} dnum">${b.amount>=0?'+':'−'}${money(Math.abs(b.amount))}</td><td>${tag(b.matched?'Matched':'Unmatched')}</td><td>${b.matched?'<span class="hint">Reconciled</span>':`<div class="rowactions">${opt.length?`<button class="btn small soft" data-act="match-bank" data-id="${b.id}">Match ${opt.length>1?'('+opt.length+')':''}</button>`:''}${b.amount<0?`<button class="btn small" data-act="record-bank-fee" data-id="${b.id}">Record charge</button>`:`<button class="btn small" data-act="record-bank-income" data-id="${b.id}">Record income</button>`}</div>`}</td></tr>`}).join('');return minPage('Bank reconciliation','Compare statement entries with posted bank transactions',btn('+ Add statement line','new-bank-line','primary'))+`<div class="grid4" style="margin-bottom:15px"><div class="card stat"><div class="stat-top">Book bank balance</div><strong>${money(bal(c,'1000'))}</strong><small>From general ledger</small></div><div class="card stat"><div class="stat-top">Statement entries</div><strong>${c.feed.length}</strong><small>Imported demo lines</small></div><div class="card stat"><div class="stat-top">Matched</div><strong class="green">${matched}</strong><small>Linked to bank journals</small></div><div class="card stat"><div class="stat-top">Needs review</div><strong class="orange">${unmatched}</strong><small>Unmatched statement lines</small></div></div><div class="notice"><span>ⓘ</span><div>These are <b>sample statement lines</b>, not live M-PESA or bank data. Matching connects an existing ledger entry; it does not post it again.</div></div><div class="card">${table(['Date','Statement description','Amount','Status','Actions'],rows||emptyRow(5))}</div>`}
function inventory(c){let rows=c.products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(search.toLowerCase())).map(p=>`<tr><td><strong>${esc(p.name)}</strong><div class="hint">${esc(p.sku)}</div></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td><strong>${p.qty}</strong></td><td>${money(p.qty*p.cost)}</td><td>${tag(p.qty<=p.reorder?'Low stock':'In stock')}</td><td><button class="btn small soft" data-act="restock-item" data-id="${p.id}">Restock</button></td></tr>`).join('');return minPage('Inventory','Stock value updates with purchases and issued sales',btn('+ Restock','new-restock','primary'))+`<div class="grid4" style="margin-bottom:15px"><div class="card stat"><div class="stat-top">Stock value</div><strong>${money(bal(c,'1200'))}</strong><small>At recorded cost</small></div><div class="card stat"><div class="stat-top">Products</div><strong>${c.products.length}</strong><small>Active SKUs</small></div><div class="card stat"><div class="stat-top">Units available</div><strong>${c.products.reduce((s,p)=>s+p.qty,0)}</strong><small>All products</small></div><div class="card stat"><div class="stat-top">Low stock</div><strong>${c.products.filter(p=>p.qty<=p.reorder).length}</strong><small>At or below reorder</small></div></div><div class="card">${table(['Product','Unit cost','Sell price','Units','Value','Status','Action'],rows||emptyRow(7))}</div>`}
function ledger(c){const rows=c.journals.filter(j=>(j.memo+' '+j.ref+' '+j.lines.map(l=>AC.find(a=>a[0]===l.a)?.[1]).join(' ')).toLowerCase().includes(search.toLowerCase())).slice().reverse().map(j=>`<tr><td>${fmtDate(j.date)}</td><td><strong>${esc(j.ref)}</strong></td><td>${esc(j.memo)}</td><td><div class="hint">${j.lines.map(l=>`${esc(AC.find(a=>a[0]===l.a)?.[1])} ${l.dr?'Dr':'Cr'} ${money(l.dr||l.cr)}`).join('<br>')}</div></td><td>${money(j.lines.reduce((a,l)=>a+l.dr,0))}</td><td>${tag('Balanced')}</td></tr>`).join('');return minPage('General ledger','Every posted action creates balanced accounting entries',btn('+ Manual journal','new-journal','primary')+btn('Export CSV','export-ledger'))+`<div class="notice"><span>✓</span><div><b>Accounting check:</b> ${c.journals.length} posted entries. All journals ${c.journals.every(j=>j.lines.reduce((s,l)=>s+l.dr-l.cr,0)===0)?'balance.':'need review.'} Posted demo entries cannot be edited directly.</div></div><div class="card">${table(['Date','Reference','Narration','Double-entry lines','Amount','Check'],rows||emptyRow(6))}</div>`}
function reports(c,f){let body;if(report==='pnl')body=`<div class="reportline"><strong>Sales revenue</strong><strong>${money(f.sales)}</strong></div><div class="reportline"><span>Other income</span><strong>${money(f.other)}</strong></div><div class="reportline indent"><span>Cost of goods sold</span><span>(${money(f.cogs)})</span></div><div class="reportline"><strong>Gross profit</strong><strong>${money(f.sales-f.cogs)}</strong></div><div class="reportline indent"><span>Operating expenses</span><span>(${money(f.op)})</span></div><div class="report-total"><span>Net profit / (loss)</span><span>${money(f.profit)}</span></div>`;else if(report==='balance'){const e=f.capital+f.profit;body=`<div class="eyebrow" style="margin:9px 0">Assets</div>${[['Cash and bank',f.bank],['Accounts receivable',f.ar],['Inventory',f.inventory],['Equipment',f.equipment]].map(([n,v])=>`<div class="reportline"><span>${n}</span><span>${money(v)}</span></div>`).join('')}<div class="reportline"><strong>Total assets</strong><strong>${money(f.assets)}</strong></div><div class="eyebrow" style="margin:20px 0 8px">Liabilities and equity</div><div class="reportline"><span>Accounts payable</span><span>${money(f.ap)}</span></div><div class="reportline"><span>Owner capital</span><span>${money(f.capital)}</span></div><div class="reportline"><span>Current earnings</span><span>${money(f.profit)}</span></div><div class="report-total"><span>Total liabilities + equity</span><span>${money(f.ap+e)}</span></div>${f.assets===f.ap+e?`<div class="notice">✓ <b>Balance sheet balances</b></div>`:`<div class="notice">⚠ Balance sheet needs review</div>`}`;}else{body=table(['Code','Account','Debit','Credit'],AC.map(([a,n])=>{const b=bal(c,a);return `<tr><td>${a}</td><td>${esc(n)}</td><td>${b>0?money(b):'—'}</td><td>${b<0?money(-b):'—'}</td></tr>`}).join('')+`<tr><td></td><td><strong>Totals</strong></td><td><strong>${money(AC.reduce((s,[a])=>s+Math.max(0,bal(c,a)),0))}</strong></td><td><strong>${money(AC.reduce((s,[a])=>s+Math.max(0,-bal(c,a)),0))}</strong></td></tr>`)}return minPage('Financial reports','Computed from the same journals as sales, expenses and stock',btn('Export CSV','export-report','primary')+btn('Print','print-report'))+`<div class="tabbar">${[['pnl','Profit & loss'],['balance','Balance sheet'],['trial','Trial balance']].map(([k,n])=>`<button class="${report===k?'on':''}" data-report="${k}">${n}</button>`).join('')}</div><div class="card panel" style="max-width:790px"><div class="panel-h"><div><h2>${report==='pnl'?'Profit and loss statement':report==='balance'?'Statement of financial position':'Trial balance'}</h2><div class="hint">${esc(c.name)} · Cumulative sample activity</div></div>${tag('Demo')}</div>${body}</div>`}
function contacts(c){const rows=c.people.filter(p=>(p.name+' '+p.email).toLowerCase().includes(search.toLowerCase())).map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${tag(p.type==='customer'?'Customer':'Supplier')}</td><td>${esc(p.email||'—')}</td><td>${p.type==='customer'?money(c.invoices.filter(i=>i.customer===p.id&&i.status==='posted').reduce((s,i)=>s+i.amount-i.paid,0)):money(c.purchases.filter(i=>i.vendor===p.id).reduce((s,i)=>s+i.amount-i.paid,0))}</td></tr>`).join('');return minPage('Contacts','Customers and suppliers linked to transactions',btn('+ Add contact','new-contact','primary'))+`<div class="card">${table(['Name','Type','Email','Outstanding'],rows||emptyRow(4))}</div>`}
function templates(c){const cards=[['▤','Invoice','Generate a customer sales document','new-invoice'],['▥','Trial balance','Inspect balanced account totals','open-trial'],['▧','Expense voucher','Record approved business expenses','new-expense'],['≡','Journal entry','Post an adjusting entry','new-journal'],['▣','Stock receipt','Receive new inventory','new-restock'],['⇄','Bank matching','Review banking transactions','open-banking']];return minPage('Business templates','Reusable operational workflows, linked to the ledger')+`<div class="modulegrid">${cards.map(([ic,n,d,act])=>`<div class="modulecard"><div class="bubble">${ic}</div><div style="flex:1"><h3>${n}</h3><p>${d}</p><button class="btn small soft" data-act="${act}">Open template →</button></div></div>`).join('')}</div>`}
function team(c){let rows=c.team.map(t=>`<tr><td><strong>${esc(t.name)}</strong></td><td>${esc(t.email)}</td><td>${tag(t.role)}</td><td>${tag('Demo member')}</td></tr>`).join('');return minPage('Team & roles','Prototype users only; access control requires a production backend',btn('+ Add demo member','new-member','primary'))+`<div class="notice"><span>ⓘ</span><div>Company isolation, authenticated invitations, role permissions and immutable audit logs are <b>production requirements</b>. This preview does not enforce server-side security.</div></div><div class="card">${table(['Name','Email','Role','Access'],rows)}</div>`}
function integrations(){const cards=[['⇄','M-PESA Daraja','Payment confirmation, collections and settlement reconciliation.','Not connected'],['▥','KRA eTIMS','Certified electronic invoicing and reporting.','Not connected'],['▣','Bank feeds','Bank-authorised APIs or secure statement imports.','Not connected'],['✉','Email delivery','Customer invoices, statements and reminders.','Not connected'],['↓','CSV exports','Download trial balance, journal and reports locally.','Available in demo'],['◈','VibeSchool identity','Separate access to the wider VibeSchool ecosystem.','Not connected']];return minPage('Integrations','Connect services safely when production credentials and approvals exist',btn('Export journal CSV','export-ledger','primary')+btn('Reset demo data','reset-demo'))+`<div class="modulegrid">${cards.map(([ic,n,d,status])=>`<div class="modulecard"><div class="bubble">${ic}</div><div style="flex:1"><h3>${n}</h3><p>${d}</p>${tag(status)} <button class="btn small" style="margin-left:6px" data-act="integration-info" data-name="${esc(n)}">Details</button></div></div>`).join('')}</div>`}
function showModal(title,content,foot=''){document.getElementById('modalHost').innerHTML=`<div class="modal-bg" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close-modal" aria-label="Close">✕</button></div><div class="modal-body">${content}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`;document.querySelector('#modalHost input:not([type=hidden]),#modalHost select')?.focus()}
function closeModal(){document.getElementById('modalHost').innerHTML=''}function opt(list,selected){return list.map(([v,n])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(n)}</option>`).join('')}
function newInvoice(){let c=current(),customers=c.people.filter(x=>x.type==='customer');if(!customers.length||!c.products.length)return toast('Add a customer and product first');showModal('Create invoice draft',`<form data-form="invoice"><div class="fgrid"><div class="field"><label>Customer</label><select name="customer" required>${opt(customers.map(p=>[p.id,p.name]))}</select></div><div class="field"><label>Product / service</label><select name="product" required id="invoiceProduct">${opt(c.products.map(p=>[p.id,p.name+' · '+money(p.price)]))}</select></div><div class="field"><label>Quantity</label><input type="number" name="qty" min="1" step="1" value="1" required></div><div class="field"><label>Available stock</label><input id="availableStock" disabled value="${c.products[0].qty} units"></div><div class="field"><label>Invoice date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Due date</label><input name="due" type="date" value="${today()}" required></div></div><div class="notice">Creates an unposted draft. Open it to approve and post. Taxes are excluded in this demonstration.</div><div class="modal-foot" style="padding:0;border:0">${btn('Cancel','close-modal')}<button class="btn primary" type="submit">Create draft</button></div></form>`)}
function detailInvoice(iid){let c=current(),i=c.invoices.find(x=>x.id===iid);if(!i)return;const due=Math.max(0,i.amount-i.paid);showModal(i.no,`<div class="kv"><span>Customer</span><strong>${esc(nam(c,i.customer))}</strong></div><div class="kv"><span>Invoice date</span><strong>${fmtDate(i.date)}</strong></div><div class="kv"><span>Due date</span><strong>${fmtDate(i.due)}</strong></div><div class="kv"><span>Status</span>${tag(stateInvoice(i))}</div><hr class="sep"><div class="kv"><span>${esc(product(c,i.product)?.name)} × ${i.qty}</span><strong>${money(i.amount)}</strong></div><div class="kv"><span>Received</span><strong>${money(i.paid)}</strong></div><div class="kv big-kv"><span>Balance due</span><strong>${money(due)}</strong></div><div class="hint">Tax excluded in this demonstration · Reference ${esc(i.no)}</div>`,`${btn('Close','close-modal')}${i.status==='draft'?`<button class="btn primary" data-act="issue-invoice" data-id="${i.id}">Approve & post</button>`:due?`<button class="btn primary" data-act="pay-invoice" data-id="${i.id}">Receive payment</button>`:''}`)}
function payInvoice(iid){let i=current().invoices.find(x=>x.id===iid);if(!i)return;showModal('Receive payment · '+i.no,`<form data-form="payment"><input type="hidden" name="id" value="${i.id}"><div class="field"><label>Amount received (KSh)</label><input type="number" min="0.01" max="${((i.amount-i.paid)/100).toFixed(2)}" step="0.01" name="amount" value="${((i.amount-i.paid)/100).toFixed(2)}" required></div><div class="field"><label>Date</label><input type="date" name="date" value="${today()}"></div><p class="hint">Posts bank debit and receivables credit. This records a fictional payment; it does not collect money.</p><div class="modal-foot" style="padding:0;border:0">${btn('Cancel','close-modal')}<button type="submit" class="btn primary">Record payment</button></div></form>`)}
function newExpense(){showModal('Record expense / supplier bill',`<form data-form="expense"><div class="field"><label>Description</label><input name="desc" required placeholder="e.g. Office electricity"></div><div class="fgrid"><div class="field"><label>Amount (KSh)</label><input type="number" name="amount" min="0.01" step="0.01" required placeholder="2500"></div><div class="field"><label>Payment status</label><select name="status"><option value="paid">Paid from bank</option><option value="unpaid">Unpaid supplier bill</option></select></div></div><div class="field"><label>Date</label><input type="date" name="date" value="${today()}" required></div><p class="hint">Expenses debit operating expenses and credit bank or payables.</p><div class="modal-foot" style="padding:0;border:0">${btn('Cancel','close-modal')}<button class="btn primary" type="submit">Post expense</button></div></form>`)}
function newRestock(pid){let c=current();showModal('Receive inventory',`<form data-form="restock"><div class="field"><label>Product</label><select name="product">${opt(c.products.map(p=>[p.id,p.name]),pid)}</select></div><div class="field"><label>Supplier</label><select name="supplier">${opt(c.people.filter(p=>p.type==='supplier').map(p=>[p.id,p.name]))}</select></div><div class="fgrid"><div class="field"><label>Quantity received</label><input type="number" name="qty" min="1" step="1" value="10" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div></div><p class="hint">Restocking records inventory at the existing unit cost and creates an unpaid supplier bill.</p><div class="modal-foot" style="padding:0;border:0">${btn('Cancel','close-modal')}<button class="btn primary" type="submit">Receive stock</button></div></form>`)}
function newJournal(){const allowed=AC.filter(a=>!['1100','1200','2000'].includes(a[0]));showModal('Post manual journal',`<form data-form="journal"><div class="field"><label>Explanation / memo</label><input name="memo" required placeholder="e.g. Adjustment for equipment"></div><div class="fgrid"><div class="field"><label>Debit account</label><select name="debit">${opt(allowed.map(a=>[a[0],a[0]+' · '+a[1]]),'1500')}</select></div><div class="field"><label>Credit account</label><select name="credit">${opt(allowed.map(a=>[a[0],a[0]+' · '+a[1]]),'1000')}</select></div><div class="field"><label>Amount (KSh)</label><input type="number" name="amount" min="0.01" step="0.01" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div></div><div class="notice">Control accounts (receivables, payables, inventory) are not selectable here. This is a simplified two-line journal editor.</div><div class="modal-foot" style="padding:0;border:0">${btn('Cancel','close-modal')}<button class="btn primary" type="submit">Post journal</button></div></form>`)}
function newBankLine(){showModal('Add sample bank statement line',`<form data-form="bankline"><div class="field"><label>Statement description</label><input name="desc" required placeholder="e.g. Payment from customer"></div><div class="fgrid"><div class="field"><label>Amount (KSh)</label><input name="amount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>Direction</label><select name="direction"><option value="in">Money in</option><option value="out">Money out</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div></div><div class="modal-foot" style="padding:0;border:0">${btn('Cancel','close-modal')}<button class="btn primary" type="submit">Add line</button></div></form>`)}
function newContact(){showModal('Add contact',`<form data-form="contact"><div class="field"><label>Contact name</label><input name="name" required></div><div class="fgrid"><div class="field"><label>Type</label><select name="type"><option value="customer">Customer</option><option value="supplier">Supplier</option></select></div><div class="field"><label>Email (optional)</label><input type="email" name="email"></div></div><div class="modal-foot" style="padding:0;border:0">${btn('Cancel','close-modal')}<button class="btn primary" type="submit">Save contact</button></div></form>`)}
function newCompany(){showModal('Create demo company',`<form data-form="company"><div class="field"><label>Company name</label><input name="name" placeholder="e.g. My Company · Demo" minlength="2" required></div><p class="hint">Creates a separate empty workspace with no financial entries. No real business account is registered.</p><div class="modal-foot" style="padding:0;border:0">${btn('Cancel','close-modal')}<button type="submit" class="btn primary">Create workspace</button></div></form>`)}
function newMember(){showModal('Add demo team member',`<form data-form="member"><div class="field"><label>Full name</label><input name="name" required></div><div class="fgrid"><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Role label</label><select name="role">${opt([['Accountant','Accountant'],['Owner','Owner'],['Cashier','Cashier'],['Auditor','Auditor'],['Viewer','Viewer']])}</select></div></div><p class="hint">This only adds a demo row; it does not invite someone or provide real access.</p><div class="modal-foot" style="padding:0;border:0">${btn('Cancel','close-modal')}<button type="submit" class="btn primary">Add demo member</button></div></form>`)}
function bankMatch(id){const c=current(),b=c.feed.find(x=>x.id===id);if(!b||b.matched)return;let opts=bankCandidates(c,b);if(opts.length===1){b.matched=opts[0].id;save('Bank statement matched without duplicating the journal.');return}if(!opts.length)return toast('No existing bank entry matches that amount.');showModal('Choose ledger match',`<p class="hint">Statement: ${esc(b.desc)} · ${money(b.amount)}</p>${opts.map(j=>`<div class="kv"><span>${esc(j.ref)} · ${esc(j.memo)}</span><button class="btn small primary" data-act="select-match" data-id="${b.id}" data-jid="${j.id}">Match</button></div>`).join('')}`)}
function recordBank(id,kind){const c=current(),b=c.feed.find(x=>x.id===id);if(!b||b.matched)return;let options=bankCandidates(c,b);if(options.length){toast('This amount matches a posted bank entry. Review the match first.');return}if(kind==='fee'&&b.amount>=0||kind==='income'&&b.amount<=0)return;showModal('Confirm statement entry',`<p>Post <strong>${money(Math.abs(b.amount))}</strong> for <strong>${esc(b.desc)}</strong>?</p><p class="hint">${kind==='fee'?'Debit operating expenses; credit bank.':'Debit bank; credit other income.'} The statement will be marked matched to the newly posted journal.</p>`,`${btn('Cancel','close-modal')}<button class="btn primary" data-act="confirm-bank-post" data-id="${b.id}" data-kind="${kind}">Post & match</button>`)}
function info(name){showModal(name,`<div class="notice"><span>ⓘ</span><div><b>Not connected in this prototype.</b> Production use needs approved provider credentials, server-side secrets, transaction verification, permission controls and monitored reconciliation.</div></div><p style="font-size:12px;line-height:1.7">The in-chat prototype does not transmit company information, connect live business accounts or claim regulatory certification. For practical testing, try invoices, expenses, ledgers, banking matches and the financial reports.</p>`,btn('Close','close-modal'))}
function download(name,body){const blob=new Blob([body],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('CSV generated locally.')}function csvRow(a){return a.map(s=>'"'+String(s??'').replace(/"/g,'""')+'"').join(',')}
function exportLedger(){const c=current();const rows=[['Date','Reference','Memo','Account','Debit KES','Credit KES']];c.journals.forEach(j=>j.lines.forEach(l=>rows.push([j.date,j.ref,j.memo,l.a,(l.dr/100).toFixed(2),(l.cr/100).toFixed(2)])));download('vibepro-journal-demo.csv',rows.map(csvRow).join('\n'))}
function exportReport(){const c=current(),f=figures(c);let rows;if(report==='pnl')rows=[['Profit and loss', 'KES'],['Revenue',(f.sales/100).toFixed(2)],['Other income',(f.other/100).toFixed(2)],['Cost of sales',(f.cogs/100).toFixed(2)],['Operating expenses',(f.op/100).toFixed(2)],['Net result',(f.profit/100).toFixed(2)]];else if(report==='balance')rows=[['Statement of financial position','KES'],...['1000','1100','1200','1500','2000','3000'].map(a=>[AC.find(x=>x[0]===a)?.[1],(bal(c,a)/100).toFixed(2)]),['Current earnings',(f.profit/100).toFixed(2)]];else rows=[['Code','Account','Debit','Credit'],...AC.map(([a,n])=>[a,n,(Math.max(bal(c,a),0)/100).toFixed(2),(Math.max(-bal(c,a),0)/100).toFixed(2)])];download('vibepro-'+report+'-demo.csv',rows.map(csvRow).join('\n'))}
const formHandlers={invoice(d){const c=current(),q=Number(d.qty);if(d.due<d.date)throw Error('Due date must not be before invoice date');let i=makeInvoice(c,d.customer,d.product,q,d.date,d.due);closeModal();save(i.no+' created as a draft. Open and post it when ready.');view='sales';render();},payment(d){const c=current(),i=c.invoices.find(i=>i.id===d.id);receivePayment(c,i,amount(d.amount),d.date);closeModal();save('Payment posted to bank and receivables.');},expense(d){addExpense(current(),d.desc,amount(d.amount),d.status,d.date);closeModal();save('Expense posted successfully.');},restock(d){addStock(current(),d.product,Number(d.qty),d.supplier,d.date);closeModal();save('Inventory received; supplier bill recorded.');},journal(d){if(d.debit===d.credit)throw Error('Debit and credit must use different accounts');let c=current(),n=amount(d.amount);post(c,'JRN-'+String(c.journals.length+1).padStart(4,'0'),d.memo,[[d.debit,n,0],[d.credit,0,n]],d.date);closeModal();save('Balanced journal posted.');},bankline(d){let n=amount(d.amount);current().feed.unshift({id:id(),date:d.date,desc:d.desc,amount:d.direction==='in'?n:-n,matched:null});closeModal();save('Sample bank statement line added.');},contact(d){current().people.push({id:id(),name:d.name,type:d.type,email:d.email||''});closeModal();save('Contact created.');},company(d){let n=company(d.name.trim(),false);store.companies.push(n);store.active=n.id;view='overview';closeModal();save('New separate demo company created.');},member(d){current().team.push({id:id(),name:d.name,email:d.email,role:d.role});closeModal();save('Demo member added (no real access granted).')}};
function amount(s){const v=String(s).trim();if(!/^\d+(\.\d{1,2})?$/.test(v))throw Error('Enter a valid positive amount with up to two decimal places');let n=Math.round(Number(v)*100);if(!Number.isSafeInteger(n)||n<1)throw Error('Amount must be greater than zero');return n}
function perform(action,el){const c=current(),eid=el.dataset.id;try{switch(action){case 'menu':document.getElementById('side').classList.add('open');document.getElementById('overlay').classList.add('open');return;case 'close-menu':document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('open');return;case 'close-modal':closeModal();return;case 'new-invoice':newInvoice();return;case 'invoice-detail':detailInvoice(eid);return;case 'issue-invoice':{let i=c.invoices.find(i=>i.id===eid);issueInvoice(c,i);closeModal();save('Invoice posted to sales, receivables and inventory.');return;}case 'pay-invoice':payInvoice(eid);return;case 'new-expense':newExpense();return;case 'new-restock':newRestock();return;case 'restock-item':newRestock(eid);return;case 'new-journal':newJournal();return;case 'new-bank-line':newBankLine();return;case 'new-contact':newContact();return;case 'new-member':newMember();return;case 'export-ledger':exportLedger();return;case 'export-report':exportReport();return;case 'print-report':window.print();return;case 'pay-bill':{let obj=el.dataset.kind==='purchase'?c.purchases.find(x=>x.id===eid):c.expenses.find(x=>x.id===eid);if(!obj)return;showModal('Confirm bill payment',`<div class="kv"><span>Bill</span><strong>${esc(obj.no)}</strong></div><div class="kv"><span>Balance to pay</span><strong>${money(obj.amount-obj.paid)}</strong></div><p class="hint">This records a fictional bank payment against the payable.</p>`,`${btn('Cancel','close-modal')}<button class="btn primary" data-act="confirm-bill-pay" data-kind="${el.dataset.kind}" data-id="${eid}">Post payment</button>`);return;}case 'confirm-bill-pay':{let obj=el.dataset.kind==='purchase'?c.purchases.find(x=>x.id===eid):c.expenses.find(x=>x.id===eid);if(el.dataset.kind==='purchase')payPurchase(c,obj,obj.amount-obj.paid);else payExpense(c,obj);closeModal();save('Supplier payment posted.');return;}case 'match-bank':bankMatch(eid);return;case 'select-match':{let b=c.feed.find(x=>x.id===eid);if(!b||!bankCandidates(c,b).some(x=>x.id===el.dataset.jid))throw Error('Bank match is not available');b.matched=el.dataset.jid;closeModal();save('Statement matched to existing ledger entry.');return;}case 'record-bank-fee':recordBank(eid,'fee');return;case 'record-bank-income':recordBank(eid,'income');return;case 'confirm-bank-post':{let b=c.feed.find(x=>x.id===eid),kind=el.dataset.kind;if(!b||b.matched)throw Error('Statement already processed');let amt=Math.abs(b.amount),j;if(kind==='fee'&&b.amount<0)j=post(c,'BANK-'+b.id,'Bank statement charge: '+b.desc,[['6000',amt,0],['1000',0,amt]],b.date,'bankfee');else if(kind==='income'&&b.amount>0)j=post(c,'BANK-'+b.id,'Other income: '+b.desc,[['1000',amt,0],['4100',0,amt]],b.date,'bankincome');else throw Error('Invalid bank posting');b.matched=j.id;closeModal();save('Statement entry recorded and reconciled.');return;}case 'open-trial':report='trial';view='reports';render();return;case 'open-banking':view='banking';render();return;case 'integration-info':info(el.dataset.name);return;case 'reset-demo':{if(confirm('Reset all sample companies and demo changes?')){try{localStorage.removeItem('vibepro-demo-v2')}catch(e){}const first=company('ApexPlaster · Demo',true),second=company('Gilowinc · Demo',false);store={companies:[first,second],active:first.id};view='overview';save('Demo data reset.')}return;}default:toast('Action not available.');}}catch(err){toast(err.message||'Action could not be completed.');}}
document.addEventListener('click',e=>{let act=e.target.closest('[data-act]');if(act){e.preventDefault();perform(act.dataset.act,act);return;}let nav=e.target.closest('[data-nav]');if(nav){view=nav.dataset.nav;search='';only='all';render();document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('open');return;}let filt=e.target.closest('[data-filter]');if(filt){only=filt.dataset.filter;renderPanel();return;}let rt=e.target.closest('[data-report]');if(rt){report=rt.dataset.report;renderPanel();return;}if(e.target.id==='modalBackdrop')closeModal();});
document.addEventListener('submit',e=>{let form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();try{const d=Object.fromEntries(new FormData(form).entries());formHandlers[form.dataset.form](d)}catch(err){toast(err.message||'Please check the information entered.')}});
document.getElementById('companySelect').addEventListener('change',e=>{if(e.target.value==='new'){e.target.value=store.active;newCompany();return}store.active=e.target.value;view='overview';search='';save('Switched demo company.');});document.getElementById('searchBox').addEventListener('input',e=>{search=e.target.value;renderPanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

const oldPost=post;
post=function(c,ref,memo,rows,date=today(),type='manual'){
 ensure(c);
 if(c.settings.closedThrough&&date<=c.settings.closedThrough)throw Error('This accounting period is locked. Open Accounting settings to reopen it.');
 const j=oldPost(c,ref,memo,rows,date,type);
 auditLog(c,'Journal posted',ref+' · '+memo);
 return j;

 case 'invoice-multi':return pform('Multi-line invoice + VAT','invoice-multi',ps('customer','Customer',inputOptions(c))+`<div class="fgrid">${ps('p1','Item 1',activeProductOptions(c))}${pf('q1','Quantity 1','number','1','min="1" required')}${ps('p2','Item 2',activeProductOptions(c),'p2')}${pf('q2','Quantity 2','number','1','min="0" required')}</div>`+pf('discount','Discount %','number','0','min="0" max="90" step="0.01"')+ps('chargeVat','VAT', [['yes','Add sample '+c.settings.vat+'% VAT'],['no','No VAT']])+pf('date','Invoice date','date',today(),'required'),'Post invoice','Posts financial lines and reduces stock immediately. VAT rate is configurable demo data.');
 case 'quote-new':return pform('New quotation','quote',ps('customer','Customer',inputOptions(c))+ps('product','Item',activeProductOptions(c))+pf('qty','Quantity','number','1','min="1" required')+pf('discount','Discount %','number','0','min="0" max="90"')+pf('valid','Valid until','date',today()),'Create quotation');
 case 'quote-accept':{let q=c.quotes.find(x=>x.id===idv);if(!q||q.status!=='Open')return;const i=makeInvoice(c,q.customer,q.product,q.qty,today(),today());i.amount=q.amount;issueInvoice(c,i);q.status='Accepted';q.invoice=i.no;auditLog(c,'Quotation accepted',q.no+' → '+i.no);return save('Quote converted; invoice posted to ledger and stock.');}
 case 'credit-new':{let available=c.invoices.filter(i=>i.status==='posted'&&i.paid===0);if(!available.length)return toast('No fully unpaid posted invoice is available for a complete credit.');return pform('Credit note — full reversal','credit',ps('invoice','Unpaid invoice',available.map(i=>[i.id,i.no+' · '+money(i.amount)]))+pf('reason','Reason for credit','text','Goods returned','required'),'Issue credit note','Reverses sales/receivables and cost of goods; returns stock to inventory.');}
 case 'po-new':return pform('New purchase order','po',ps('supplier','Supplier',inputOptions(c,'supplier'))+ps('product','Product',activeProductOptions(c))+pf('qty','Quantity','number','10','min="1" required')+pf('date','Order date','date',today(),'required'),'Create draft');
 case 'po-request':{let x=c.orders.find(x=>x.id===idv);if(!x||x.status!=='Draft')return;x.status='Awaiting approval';c.approvals.unshift({id:id(),ref:x.no,name:'Purchase · '+product(c,x.product)?.name,amount:x.total,status:'Pending',type:'purchase',related:x.id});auditLog(c,'Approval requested',x.no);return save('Purchase order sent to Approvals.');}
 case 'po-receive':{let x=c.orders.find(x=>x.id===idv);if(!x||x.status!=='Approved')throw Error('Approval required');addStock(c,x.product,x.qty,x.supplier,today());x.status='Received';auditLog(c,'Goods received',x.no+' · '+x.qty+' units');return save('Stock received, supplier bill posted, inventory and accounts payable updated.');}
 case 'transfer-new':return pform('Transfer stock between locations','transfer',ps('product','Product',activeProductOptions(c))+ps('from','From warehouse',c.warehouses.map(w=>[w.id,w.name]))+ps('to','To warehouse',c.warehouses.map(w=>[w.id,w.name]),'w-west')+pf('qty','Units','number','1','min="1" required'),'Transfer units','A transfer changes the warehouse subledger, not the company-wide inventory value.');
 case 'stocktake-new':return pform('Stocktake and valuation adjustment','stocktake',ps('product','Product',activeProductOptions(c))+ps('warehouse','Warehouse',c.warehouses.map(w=>[w.id,w.name]))+pf('count','Physically counted units','number','0','min="0" required'),'Post variance','The difference adjusts inventory quantity and records a stock gain or loss.');
 case 'batch-new':return pform('Tag a product batch','batch',ps('product','Product',activeProductOptions(c))+pf('batch','Batch / lot ID','text','','required')+pf('qty','Units in lot','number','1','min="1" required')+pf('expires','Expiry / review date','date',''),'Record batch','Batch tagging is traceability metadata and does not double-count company stock.');
 case 'settings-edit':return pform('Edit company profile','settings',pf('name','Company name','text',c.name,'required')+pf('industry','Industry','text',c.settings.industry,'required')+ps('currency','Base currency',['KES','USD','EUR'],c.settings.currency)+pf('vat','Default VAT percent','number',c.settings.vat,'min="0" max="30" step="0.01" required')+pf('fy','Financial year','text',c.settings.fy,'required')+ps('valuation','Stock valuation label',['Weighted average (demo)','FIFO (demo)'],c.settings.valuation),'Save settings');
 case 'warehouse-new':return pform('New warehouse','warehouse',pf('name','Warehouse name','text','','required')+pf('city','Location','text','Nairobi'),'Create location');
 case 'pos-new':return pform('New point-of-sale sale','pos',ps('product','Sell item',activeProductOptions(c))+pf('qty','Quantity','number','1','min="1" required')+ps('method','Payment method',['Cash','M-PESA','Card'])+pf('date','Date','date',today()),'Complete sale','Posts cash and sales, posts cost of goods sold and reduces stock.');
 case 'lead-new':return pform('Add CRM opportunity','lead',pf('name','Customer or prospect','text','','required')+pf('value','Potential deal (KES)','number','50000','min="1" required')+ps('stage','Stage',['New','Qualified','Proposal']),'Add lead');
 case 'lead-next':{let x=c.leads.find(x=>x.id===idv);if(!x)return;let steps=['New','Qualified','Proposal','Won'];x.stage=steps[Math.min(3,steps.indexOf(x.stage)+1)];auditLog(c,'CRM stage changed',x.name+' → '+x.stage);return save('Opportunity moved to '+x.stage);}
 case 'lead-convert':{let x=c.leads.find(x=>x.id===idv);if(!x||x.stage!=='Won')throw Error('Win the opportunity first');if(!c.people.some(p=>p.name===x.name))c.people.push({id:id(),name:x.name,type:'customer',email:''});auditLog(c,'Customer created',x.name);return save('Customer added to the shared contact list.');}
 case 'weborder-new':return pform('Simulate storefront order','weborder',ps('customer','Customer',inputOptions(c))+ps('product','Product',activeProductOptions(c))+pf('qty','Quantity','number','1','min="1" required'),'Place demo order');
 case 'weborder-fulfil':{let o=c.webOrders.find(x=>x.id===idv);if(!o||o.status!=='New')return;const i=makeInvoice(c,o.customerId,o.product,o.qty,today(),today());issueInvoice(c,i);receivePayment(c,i,i.amount,today());o.status='Fulfilled';o.invoice=i.no;auditLog(c,'Online order fulfilled',o.no);return save('Order fulfilled: invoice, payment, sales, COGS and inventory updated.');}
 case 'site-edit':return pform('Edit demo storefront','site',pf('name','Store name','text',c.site.name,'required')+pf('headline','Homepage headline','text',c.site.headline,'required'),'Save storefront');
 case 'site-toggle':c.site.live=!c.site.live;auditLog(c,'Storefront status changed',c.site.live?'Published locally':'Unpublished');return save(c.site.live?'Storefront published in demo (not online).':'Demo store unpublished.');
 case 'portal-select':selectedPortal=idv;renderPanel();return;
 case 'portal-message':return pform('Send demo portal message','portal-message',ps('customer','Recipient',inputOptions(c))+pf('subject','Subject','text','Your account statement','required')+ptextarea('message','Message','Your updated statement is available in the portal.'),'Record message','Creates a local message record; no external email is sent.');
 case 'etims-new':{const inv=c.invoices.filter(x=>x.status==='posted'&&!c.etims.some(t=>t.invoice===x.no));if(!inv.length)return toast('Post a new invoice first; all posted invoices may already have sample numbers.');return pform('Simulate eTIMS issuance','etims',ps('invoice','Posted invoice',inv.map(i=>[i.id,i.no+' · '+money(i.amount)])),'Generate demo control number','Creates only a mock local reference.');}
 case 'tax-pay':return pform('Record settlement of VAT payable','tax-pay',pf('amount','Tax amount (KES)','number',Math.max(0,-bal(c,'2100')/100).toFixed(2),'min="0.01" step="0.01" required')+pf('date','Payment date','date',today()),'Post tax settlement','Demo tax payment reduces cash and VAT payable; no payment is transmitted.');
 case 'payroll-new':return pform('Run payroll — simulated deductions','payroll',pf('period','Pay period','month',today().slice(0,7),'required'),'Post payroll','Applies a fictional 10% deduction; posts gross wages, net salaries payable and statutory liability.');
 case 'payroll-pay':{let r=c.payruns.find(x=>x.id===idv);if(!r||r.status!=='Posted')return;post(c,'PAYROLL-PAY-'+r.period,'Pay staff net salaries',[['2200',r.net,0],['1000',0,r.net]],today(),'payroll-payment');r.status='Settled';auditLog(c,'Payroll paid',r.period);return save('Net salaries paid; cash and salary liability updated.');}
 case 'employee-new':return pform('Create employee','employee',pf('name','Full name','text','','required')+pf('job','Job title','text','','required')+pf('salary','Monthly gross salary (KES)','number','35000','min="1" required')+pf('leave','Annual leave balance','number','21','min="0" required'),'Add employee');
 case 'leave-new':return pform('Employee leave request','leave',ps('employee','Employee',c.employees.map(e=>[e.id,e.name]))+pf('days','Working days','number','2','min="1" required')+pf('reason','Reason','text','Annual leave','required'),'Submit request');
 case 'leave-approve':{let l=c.leave.find(x=>x.id===idv);let e=c.employees.find(x=>x.id===l?.employee);if(!l||l.status!=='Pending'||!e)return;if(e.leave<l.days)throw Error('Leave balance is insufficient');e.leave-=l.days;l.status='Approved';auditLog(c,'Leave approved',e.name+' · '+l.days+' days');return save('Leave approved and balance updated.');}
 case 'request-new':return pform('New spend approval request','request',pf('name','Purpose','text','','required')+pf('amount','Amount (KES)','number','10000','min="1" required'),'Request approval','No financial posting until the request is approved.');
 case 'approve':case 'reject':{let x=c.approvals.find(x=>x.id===idv);if(!x||x.status!=='Pending')return;x.status=act==='approve'?'Approved':'Rejected';if(x.type==='purchase'){let po=c.orders.find(p=>p.id===x.related);if(po)po.status=act==='approve'?'Approved':'Rejected';}if(act==='approve'&&x.type==='expense'){const e={id:id(),no:no(c,'EXP', 'expenses'),desc:x.name,amount:x.amount,paid:0,date:today()};post(c,e.no,'Approved expense · '+x.name,[['6000',x.amount,0],['2000',0,x.amount]],today(),'expense');c.expenses.push(e)}auditLog(c,'Approval '+x.status.toLowerCase(),x.ref);return save('Request '+x.status.toLowerCase()+'; linked records updated.');}
 case 'rule-new':return pform('Create automation rule','rule',pf('name','Rule name','text','','required')+ps('type','Trigger',[['overdue','Overdue invoices'],['stock','Low stock'],['digest','Finance digest'],['recurring_invoice','Recurring draft invoice']]),'Create rule');
 case 'rule-toggle':{let r=c.automationRules.find(x=>x.id===idv);if(!r)return;r.active=!r.active;auditLog(c,'Automation toggled',r.name);return save('Rule '+(r.active?'activated':'paused'));}
 case 'rules-run':{let count=0;c.automationRules.filter(r=>r.active).forEach(r=>{let message='';if(r.type==='stock')message=c.products.filter(p=>p.qty<=p.reorder).length+' SKUs at/below reorder';else if(r.type==='overdue')message=c.invoices.filter(i=>i.status==='posted'&&i.due<today()&&i.paid<i.amount).length+' overdue invoices identified';else if(r.type==='digest')message='Cash '+money(figures(c).bank)+'; sales '+money(figures(c).sales);else if(r.type==='recurring_invoice'){const customer=c.people.find(p=>p.type==='customer');const p=c.products.find(p=>p.qty>0);if(customer&&p){let inv=makeInvoice(c,customer.id,p.id,1);message='Draft invoice '+inv.no+' generated';}else message='No valid customer or available stock';}c.automationEvents.unshift({id:id(),rule:r.name,date:timeNow(),message});count++});auditLog(c,'Automation run',count+' rules');return save(count+' automation rule(s) executed. Open event log.');}
 case 'asset-new':return pform('Acquire equipment','asset',pf('name','Asset description','text','','required')+pf('cost','Acquisition cost (KES)','number','80000','min="1" required')+pf('months','Useful life (months)','number','60','min="1" required'),'Add and capitalise','Posts equipment debit and cash credit immediately.');
 case 'asset-capitalise':{let a=c.assets.find(x=>x.id===idv);if(!a||a.posted)return;post(c,'CAP-'+a.id,'Capitalise '+a.name,[['1500',a.cost,0],['1000',0,a.cost]],today(),'asset');a.posted=true;return save('Asset cost capitalised in ledger.');}
 case 'asset-depreciate':{let a=c.assets.find(x=>x.id===idv);if(!a||!a.posted)return;let v=Math.min(a.cost-a.accum,Math.round(a.cost/a.months));if(v<=0)throw Error('Asset has been fully depreciated');post(c,'DEP-'+a.id.slice(0,5)+'-'+(a.accum+v),'Monthly depreciation · '+a.name,[['6200',v,0],['1510',0,v]],today(),'depreciation');a.accum+=v;return save('Depreciation recognised in profit/loss and contra-asset account.');}
 case 'budget-new':return pform('New budget line','budget',pf('name','Budget name','text','','required')+ps('account','GL account',AC.filter(a=>a[2]==='income'||a[2]==='expense').map(([k,n])=>[k,k+' · '+n]))+pf('amount','Planned amount (KES)','number','100000','min="1" required'),'Save budget');
 case 'cost-new':return pform('Cost centre transaction','cost',ps('center','Cost centre',c.costCenters.map(x=>[x.id,x.name]))+pf('description','Description','text','Project expense','required')+pf('amount','Expense (KES)','number','2500','min="1" required'),'Post cost','Posts expense to operating expenses and reduces bank balance.');
 case 'rate-new':return pform('Add/update FX demo rate','rate',ps('currency','Foreign currency',['USD','EUR','GBP','TZS','UGX','INR'])+pf('rate','KES per foreign unit','number','130.00','min="0.01" step="0.001" required'),'Save local rate');
 case 'analytics-export':{let f=figures(c);let rows=[['Metric','KES'],['Cash & bank',f.bank/100],['Receivables',f.ar/100],['Revenue',f.sales/100],['Expenses',f.op/100],['Profit',f.profit/100]];return download('vibepro-analytics-demo.csv',rows.map(csvRow).join('\n'));}
 case 'project-new':return pform('New project','project',pf('name','Project name','text','','required')+ps('client','Customer',c.people.filter(p=>p.type==='customer').map(p=>[p.name,p.name]))+pf('budget','Budget (KES)','number','150000','min="1" required'),'Create project');
 case 'time-new':return pform('Log timesheet','time',ps('project','Project',c.projects.map(p=>[p.id,p.name]))+ps('employee','Employee',c.employees.map(e=>[e.name,e.name]))+pf('hours','Hours','number','8','min="0.5" step="0.5" required')+pf('rate','Internal hourly cost (KES)','number','650','min="1" required')+pf('date','Date','date',today()),'Save hours','Creates a cost allocation for job reporting; payroll remains the financial posting authority.');
 case 'mfg-new':return pform('Assemble Paint Starter Kits','mfg',pf('qty','Kits to produce','number','1','min="1" required'),'Complete production','Consumes one paint and one primer per finished kit. Transfers value within the inventory ledger.');
 case 'vehicle-new':return pform('Register vehicle','vehicle',pf('plate','Registration number','text','','required')+pf('name','Vehicle description','text','','required')+pf('mileage','Current odometer','number','0','min="0" required'),'Add vehicle');
 case 'fuel-new':return pform('Record vehicle expense','fuel',ps('vehicle','Vehicle',c.vehicles.map(v=>[v.id,v.plate+' · '+v.name]))+pf('memo','Expense description','text','Fuel purchase','required')+pf('amount','Amount (KES)','number','4500','min="1" required'),'Post expense');
 case 'vehicle-toggle':{let v=c.vehicles.find(x=>x.id===idv);if(!v)return;v.status=v.status==='Available'?'In service':'Available';auditLog(c,'Vehicle status changed',v.plate);return save('Fleet status changed.');}
 case 'ticket-new':return pform('New helpdesk ticket','ticket',pf('subject','Issue','text','','required')+ps('customer','Customer',c.people.filter(p=>p.type==='customer').map(p=>[p.name,p.name]))+ps('priority','Priority',['Normal','Urgent','Low']),'Create ticket');
 case 'ticket-resolve':{let t=c.tickets.find(x=>x.id===idv);if(!t)return;t.status='Resolved';auditLog(c,'Ticket resolved',t.subject);return save('Ticket marked resolved.');}
 case 'maintenance-new':return pform('New maintenance work order','maintenance',pf('equipment','Equipment or facility','text','Delivery van','required')+pf('cost','Estimated cost (KES)','number','2400','min="1" required'),'Schedule work');
 case 'maintenance-complete':{let x=c.maintenance.find(x=>x.id===idv);if(!x||x.status!=='Scheduled')return;post(c,x.no,'Maintenance · '+x.equipment,[['6000',x.cost,0],['1000',0,x.cost]],today(),'maintenance');x.status='Completed';return save('Maintenance completed; expense posted to accounts.');}
 case 'quality-new':return pform('Perform stock inspection','quality',ps('product','Product',activeProductOptions(c))+pf('qty','Units inspected','number','1','min="1" required')+ps('result','Result',['Pass','Fail']),'Record inspection','Failed units are written off inventory and charged to a stock-variance expense.');
 case 'document-new':return pform('Upload company document','document',pf('name','Document title','text','','required')+ps('type','Category',['Receipt','Contract','Invoice','Other'])+pf('ref','Related reference','text','')+afileInput(),'Save locally','Files up to 350 KB are stored as data URLs in this browser only.');
 case 'document-download':{let x=c.docs.find(x=>x.id===idv);if(!x?.data)return;let a=document.createElement('a');a.href=x.data;a.download=x.filename||x.name;a.click();return;}
 case 'signature-new':return pform('Request a demo signature','signature',pf('name','Document or request title','text','','required')+pf('recipient','Recipient','text','Company owner','required'),'Create request');
 case 'signature-sign':{let x=c.signatures.find(x=>x.id===idv);if(!x)return;x.status='Signed';x.signedAt=timeNow();auditLog(c,'Signature recorded',x.name);return save('Demo sign-off logged.');}
 case 'import-new':return pform('Paste CSV for import','import',ps('type','Import records',[['contacts','Customers'],['products','Products']])+ptextarea('csv','CSV rows (include header)','name,email\nSample Customer,contact@sample.invalid'),'Validate & import','No production records are contacted; CSV is parsed locally and duplicates are skipped.');
 case 'import-template':{let kind=el.dataset.kind;return download(kind+'-import-template.csv',kind==='products'?'sku,name,price,cost,qty\nPRD-100,Sample product,100,65,5':'name,email\nSample Customer,customer@sample.invalid');}
 case 'branch-new':return pform('Create branch','branch',pf('name','Branch name','text','','required')+pf('city','Town / location','text','Nairobi','required'),'Add branch');
 case 'company-create':return newCompany();
 case 'role-change':return pform('Switch demo persona','role',ps('role','Current persona',['Jean K. · Accountant','Alex M. · Owner','Faith N. · Storekeeper','Brian O. · Cashier','External Auditor · Read-only'],demoRole),'Switch role','Role switching changes the simulated controls, not real authentication.');
 case 'period-toggle':c.settings.closedThrough=c.settings.closedThrough?'':today();auditLog(c,'Period lock changed',c.settings.closedThrough||'Reopened');return save(c.settings.closedThrough?'Posting locked through '+c.settings.closedThrough:'Accounting period reopened.');
 case 'account-new':return pform('Add chart of accounts entry','account',pf('code','Unique account code','text','6700','pattern="[0-9]{4}" required')+pf('name','Account name','text','Professional fees','required')+ps('type','Financial category',['asset','liability','equity','income','expense']),'Create account');
 case 'company-switch':{if(!store.companies.some(x=>x.id===idv))return;store.active=idv;view='overview';save('Client company opened.');return;}
 case 'mpesa-new':return pform('Simulate M-PESA payment','mpesa',ps('invoice','Open invoice',c.invoices.filter(i=>i.status==='posted'&&i.paid<i.amount).map(i=>[i.id,i.no+' · '+money(i.amount-i.paid)]))+pf('amount','Amount received (KES)','number','1000','min="0.01" step="0.01" required')+pf('phone','Masked payer label','text','07XX XXX 123'),'Confirm sandbox payment','No actual money moves; posts a payment and records a demo transaction reference.');
 case 'bank-deposit':return pform('Create simulated bank-feed transaction','bank-deposit',pf('description','Statement reference','text','Deposit - demonstration','required')+pf('amount','Bank amount (KES)','number','2000','min="0.01" step="0.01" required')+ps('direction','Direction',[['in','Deposit / credit'],['out','Withdrawal / debit']]),'Add feed line','Open Banking to match this line to the ledger.');
 case 'email-send':{const msg='Demo reminders queued (no email sent)';c.automationEvents.unshift({id:id(),rule:'Email notification',message:msg,date:timeNow()});return save(msg);}
 case 'api-show':return showModal('Integration API concept',`<div class="notice">Documentation preview only: no network requests or exposed production secrets.</div><pre class="codebox">POST /api/v1/companies/{companyId}/invoices\nPOST /api/v1/companies/{companyId}/payments\nGET  /api/v1/companies/{companyId}/reports/trial-balance\nPOST /api/v1/integrations/mpesa/callback\nPOST /api/v1/integrations/etims/invoices</pre><p class="hint">Production APIs will require authentication, authorisation, idempotency, audit logging, rate limiting and external certification where applicable.</p>`);
 default:return toast('No action is defined for '+act);
 }
}
async function submitPro(key,d,form){const c=ensure(current());let result='Saved in VibePro demo.';
 switch(key){
 case 'invoice-multi':{
   let entries=[[d.p1,qty(d.q1)]];if(Number(d.q2)>0)entries.push([d.p2,qty(d.q2)]);
   const grouped=new Map();entries.forEach(([pid,q])=>grouped.set(pid,(grouped.get(pid)||0)+q));
   for(const [pid,q] of grouped)invoiceValid(c,pid,q);
   let sub=entries.reduce((s,[pid,q])=>s+product(c,pid).price*q,0),discount=Math.round(sub*num(d.discount)/100);
   if(num(d.discount)<0||num(d.discount)>90)throw Error('Discount must be from 0 to 90%.');
   let net=sub-discount,vat=d.chargeVat==='yes'?Math.round(net*c.settings.vat/100):0,total=net+vat;
   const inv={id:id(),no:no(c,'INV','invoices'),customer:d.customer,product:entries[0][0],qty:entries[0][1],unitPrice:product(c,entries[0][0]).price,unitCost:product(c,entries[0][0]).cost,amount:total,net,vat,discount,paid:0,date:d.date||today(),due:d.date||today(),status:'posted',details:entries.map(([pid,q])=>({product:pid,qty:q}))};
   const cost=entries.reduce((s,[pid,q])=>s+product(c,pid).cost*q,0);
   post(c,inv.no,'Multi-line customer invoice',[["1100",total,0],["4000",0,net],...(vat?[["2100",0,vat]]:[])],inv.date,'sale');
   post(c,inv.no+'-COGS','Goods sold / cost recognition',[["5000",cost,0],["1200",0,cost]],inv.date,'cogs');
   entries.forEach(([pid,q])=>product(c,pid).qty-=q); c.invoices.push(inv);auditLog(c,'VAT invoice issued',inv.no);
   result=inv.no+' posted; stock, receivables, revenue, VAT and cost of sales updated.';break;
 }
 case 'quote':{let p=product(c,d.product),q=qty(d.qty),discount=num(d.discount);if(discount<0||discount>90)throw Error('Discount must be from 0 to 90%');let obj={id:id(),no:no(c,'QUO','quotes'),customer:d.customer,product:d.product,qty:q,amount:Math.round(p.price*q*(1-discount/100)),date:today(),valid:d.valid,status:'Open'};c.quotes.push(obj);auditLog(c,'Quotation created',obj.no);result='Quote '+obj.no+' ready for customer acceptance.';break;}
 case 'credit':{let i=c.invoices.find(x=>x.id===d.invoice);if(!i||i.status!=='posted'||i.paid!==0)throw Error('Select a fully unpaid posted invoice');let entries=i.details||[{product:i.product,qty:i.qty}],vat=i.vat||0,net=i.net||i.amount;
    post(c,'CR-'+i.no,'Customer credit note · '+d.reason,[["4000",net,0],...(vat?[["2100",vat,0]]:[]),["1100",0,i.amount]],today(),'credit');
    const cost=entries.reduce((s,x)=>s+(product(c,x.product)?.cost||0)*x.qty,0);
    post(c,'CR-'+i.no+'-STOCK','Return goods to inventory',[["1200",cost,0],["5000",0,cost]],today(),'credit-stock');entries.forEach(x=>product(c,x.product).qty+=x.qty);i.status='credited';c.creditNotes.push({id:id(),no:no(c,'CRN','creditNotes'),invoice:i.no,amount:i.amount,reason:d.reason});auditLog(c,'Credit note issued',i.no);result='Credit posted. Receivables and revenue reversed, stock returned.';break;
 }

function parseCsv(csv){const rows=[];let row=[],field='',quoted=false;csv=String(csv||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');for(let i=0;i<csv.length;i++){let ch=csv[i];if(ch==='"'){if(quoted&&csv[i+1]==='"'){field+='"';i++}else quoted=!quoted;}else if(ch===','&&!quoted){row.push(field);field=''}else if(ch==='\n'&&!quoted){row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}else field+=ch}if(quoted)throw Error('Unclosed quotation mark in CSV');row.push(field);if(row.some(v=>v.trim()))rows.push(row);return rows}
