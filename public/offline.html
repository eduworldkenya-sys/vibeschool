<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070B1F" />
    <title>VibeSchool — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #070B1F; color: #fff; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 18% 18%, rgba(124,60,255,.22), transparent 36%),
          radial-gradient(circle at 84% 20%, rgba(255,155,47,.16), transparent 32%),
          radial-gradient(circle at 54% 86%, rgba(242,22,140,.17), transparent 38%),
          #070B1F;
      }
      .card {
        width: min(100%, 410px);
        text-align: center;
        padding: 28px 22px 24px;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 28px;
        background: rgba(12,17,49,.78);
        box-shadow: 0 28px 80px rgba(0,0,0,.42);
      }
      .icon { width: 86px; height: 86px; border-radius: 24px; box-shadow: 0 14px 42px rgba(0,0,0,.32); }
      h1 { margin: 22px 0 8px; font-size: 23px; letter-spacing: -.03em; }
      p { margin: 0; color: rgba(255,255,255,.64); font-size: 14px; line-height: 1.55; }
      button {
        width: 100%; margin-top: 22px; padding: 13px 16px; border: 0; border-radius: 15px;
        background: linear-gradient(90deg, #7C3CFF, #F2168C 52%, #FF9B2F);
        color: #fff; font-weight: 800; font-size: 14px; cursor: pointer;
      }
      .hint { margin-top: 14px; font-size: 11px; color: rgba(255,255,255,.42); }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icons/icon-192.svg" alt="VibeSchool" />
      <h1>You’re offline</h1>
      <p>VibeSchool keeps this safe offline screen available, but live learning, accounts and private school data require a connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <div class="hint">Your account data is not stored in the offline cache.</div>
    </main>
  </body>
</html>
