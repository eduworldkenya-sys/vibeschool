<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeSchool — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background: #05050F;
        overflow: hidden;
      }

      body {
        height: 100dvh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
      }

      .glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse 72% 48% at 50% -4%,
          rgba(200, 168, 75, 0.09) 0%,
          transparent 72%
        );
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .label {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.36);
        letter-spacing: 0.46em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .title {
        font-size: clamp(11px, 2vw, 13px);
        color: rgba(200, 168, 75, 0.72);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        margin-bottom: 24px;
      }

      .sub {
        font-size: clamp(11px, 1.4vw, 13px);
        color: rgba(255, 255, 255, 0.36);
        letter-spacing: 0.04em;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="content">
      <p class="label">VIBESCHOOL</p>
      <p class="title">YOU ARE OFFLINE</p>
      <p class="sub">Reconnect to continue.</p>
    </div>
  </body>
</html>
