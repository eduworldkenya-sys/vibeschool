<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc"><title id="title">Nine gifts of the Holy Spirit</title><desc id="desc">A numbered list of nine gifts identified in First Corinthians chapter 12 verses 8 to 10: wisdom, knowledge, faith, healing, miracles, prophecy, distinguishing spirits, tongues, and interpretation of tongues. Gifts serve the community; the diagram is distinct from the fruit of the Spirit.</desc>
<rect width="760" height="1040" fill="#fffdf8"/><rect width="760" height="12" fill="#173e37"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="54" y="76" font-size="39" font-weight="700" fill="#1a3028">Gifts of the Holy Spirit</text><text x="55" y="113" font-size="23" fill="#576962">1 Corinthians 12:8–10</text><line x1="55" y1="147" x2="703" y2="147" stroke="#9eafa3" stroke-width="2"/>
<circle cx="83" cy="204" r="24" fill="#e4ebe6"/><text x="83" y="213" fill="#356854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">1</text><text x="132" y="213" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="28">Message of wisdom</text><line x1="132" y1="235" x2="695" y2="235" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="83" cy="284" r="24" fill="#e4ebe6"/><text x="83" y="293" fill="#356854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">2</text><text x="132" y="293" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="28">Message of knowledge</text><line x1="132" y1="315" x2="695" y2="315" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="83" cy="364" r="24" fill="#e4ebe6"/><text x="83" y="373" fill="#356854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">3</text><text x="132" y="373" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="28">Faith</text><line x1="132" y1="395" x2="695" y2="395" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="83" cy="444" r="24" fill="#e4ebe6"/><text x="83" y="453" fill="#356854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">4</text><text x="132" y="453" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="28">Gifts of healing</text><line x1="132" y1="475" x2="695" y2="475" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="83" cy="524" r="24" fill="#e4ebe6"/><text x="83" y="533" fill="#356854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">5</text><text x="132" y="533" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="28">Miraculous powers</text><line x1="132" y1="555" x2="695" y2="555" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="83" cy="604" r="24" fill="#e4ebe6"/><text x="83" y="613" fill="#356854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">6</text><text x="132" y="613" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="28">Prophecy</text><line x1="132" y1="635" x2="695" y2="635" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="83" cy="684" r="24" fill="#e4ebe6"/><text x="83" y="693" fill="#356854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">7</text><text x="132" y="693" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="28">Distinguishing spirits</text><line x1="132" y1="715" x2="695" y2="715" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="83" cy="764" r="24" fill="#e4ebe6"/><text x="83" y="773" fill="#356854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">8</text><text x="132" y="773" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="28">Speaking in tongues</text><line x1="132" y1="795" x2="695" y2="795" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="83" cy="844" r="24" fill="#e4ebe6"/><text x="83" y="853" fill="#356854" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">9</text><text x="132" y="853" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="28">Interpreting tongues</text>
<line x1="55" y1="937" x2="703" y2="937" stroke="#9eafa3" stroke-width="2"/>
<text x="55" y="970" font-size="21" font-weight="700" fill="#224b3a">Remember</text><text x="55" y="1003" font-size="19" fill="#4c5e55">Different gifts are given for serving others.</text>
</g></svg>