<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1075" viewBox="0 0 760 1075" role="img" aria-labelledby="title desc"><title id="title">Nine qualities of the fruit of the Spirit</title><desc id="desc">A numbered list from Galatians chapter 5 verses 22 to 23: love, joy, peace, patience, kindness, goodness, faithfulness, gentleness and self-control. KICD also discusses humility as a related value; this illustration preserves the Bible translation wording gentleness.</desc>
<rect width="760" height="1075" fill="#fffdf8"/><rect width="760" height="12" fill="#173e37"/><g font-family="Arial,Helvetica,sans-serif"><text x="54" y="76" font-size="39" font-weight="700" fill="#1a3028">Fruit of the Holy Spirit</text><text x="55" y="113" font-size="23" fill="#576962">Galatians 5:22–23</text><line x1="55" y1="147" x2="703" y2="147" stroke="#9eafa3" stroke-width="2"/>
<circle cx="82" cy="199" r="24" fill="#e8ede1"/><text x="82" y="207" text-anchor="middle" fill="#3e6644" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">1</text><text x="130" y="207" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="29">Love</text><line x1="130" y1="229" x2="695" y2="229" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="82" cy="279" r="24" fill="#e8ede1"/><text x="82" y="287" text-anchor="middle" fill="#3e6644" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">2</text><text x="130" y="287" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="29">Joy</text><line x1="130" y1="309" x2="695" y2="309" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="82" cy="359" r="24" fill="#e8ede1"/><text x="82" y="367" text-anchor="middle" fill="#3e6644" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">3</text><text x="130" y="367" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="29">Peace</text><line x1="130" y1="389" x2="695" y2="389" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="82" cy="439" r="24" fill="#e8ede1"/><text x="82" y="447" text-anchor="middle" fill="#3e6644" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">4</text><text x="130" y="447" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="29">Patience</text><line x1="130" y1="469" x2="695" y2="469" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="82" cy="519" r="24" fill="#e8ede1"/><text x="82" y="527" text-anchor="middle" fill="#3e6644" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">5</text><text x="130" y="527" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="29">Kindness</text><line x1="130" y1="549" x2="695" y2="549" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="82" cy="599" r="24" fill="#e8ede1"/><text x="82" y="607" text-anchor="middle" fill="#3e6644" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">6</text><text x="130" y="607" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="29">Goodness</text><line x1="130" y1="629" x2="695" y2="629" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="82" cy="679" r="24" fill="#e8ede1"/><text x="82" y="687" text-anchor="middle" fill="#3e6644" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">7</text><text x="130" y="687" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="29">Faithfulness</text><line x1="130" y1="709" x2="695" y2="709" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="82" cy="759" r="24" fill="#e8ede1"/><text x="82" y="767" text-anchor="middle" fill="#3e6644" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">8</text><text x="130" y="767" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="29">Gentleness</text><line x1="130" y1="789" x2="695" y2="789" stroke="#d9e3dd" stroke-width="1.4"/>
<circle cx="82" cy="839" r="24" fill="#e8ede1"/><text x="82" y="847" text-anchor="middle" fill="#3e6644" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">9</text><text x="130" y="847" fill="#1b302b" font-family="Arial,Helvetica,sans-serif" font-size="29">Self-control</text>
<line x1="55" y1="940" x2="703" y2="940" stroke="#9eafa3" stroke-width="2"/>
<text x="55" y="975" font-size="20" font-weight="700" fill="#224b3a">These qualities shape Christian character.</text><text x="55" y="1007" font-size="20" fill="#4c5e55">KICD also highlights humility as a related value.</text>
<text x="55" y="1037" font-size="17" fill="#69766e">Original VibeSchool learning diagram</text>
</g></svg>