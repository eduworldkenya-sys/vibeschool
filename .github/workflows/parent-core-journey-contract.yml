name: Parent Core Journey Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parent-core-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Parent privacy and child-state contracts
        run: python scripts/validate-parent-core-journey.py
