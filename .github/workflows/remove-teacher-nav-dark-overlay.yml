name: Remove teacher nav dark overlay

on:
  push:
    paths:
      - .github/workflows/remove-teacher-nav-dark-overlay.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove only the dark tray backdrop
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/teacher/layout.tsx')
          source = path.read_text(encoding='utf-8')
          old = 'style={{ position: "fixed", inset: 0, zIndex: 690, background: "rgba(0,0,0,0.2)" }}'
          new = 'style={{ position: "fixed", inset: 0, zIndex: 690, background: "transparent" }}'

          count = source.count(old)
          if count != 1:
              raise SystemExit(f'ABORT: expected one dark-overlay anchor, found {count}')

          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          git diff --check
          git diff -- app/teacher/layout.tsx

      - name: Commit exact repair
        run: |
          git config user.name "Vibeschool Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/teacher/layout.tsx
          git commit -m "fix(teacher-nav): remove dark tray backdrop"
          git push origin HEAD:main
