name: EXQ-004B.5 Finalize Lesson Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exq004b5-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace legacy lesson assessment actions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/teacher/LessonPlanModal.tsx')
          src = path.read_text()

          start = src.index("                {planId && (\n                  <button\n                    type=\"button\"\n                    onClick={() => {\n                      const params = new URLSearchParams({\n                        classId: slot.class_id,")
          end_marker = "                {status === 'draft' && ("
          end = src.index(end_marker, start)

          replacement = '''                {planId && (
                  <div style={{
                    display: 'grid',
                    gridTemplateColumns: 'repeat(2, minmax(0, 1fr))',
                    gap: 8,
                  }}>
                    {[
                      { type: 'exercise', label: 'Exercise', icon: '✍️' },
                      { type: 'quiz', label: 'Quiz', icon: '📊' },
                      { type: 'homework', label: 'Homework', icon: '📝' },
                      { type: 'test', label: 'CAT', icon: '📋' },
                    ].map(action => (
                      <button
                        key={action.type}
                        type="button"
                        onClick={() => {
                          const params = new URLSearchParams({
                            lessonPlanId: planId,
                            topic,
                            assessmentHook: sections.assessmentHook,
                            type: action.type,
                          })

                          const occurrenceId =
                            teachingOccurrence?.occurrenceId

                          if (occurrenceId) {
                            params.set('occurrenceId', occurrenceId)
                          }

                          router.push(
                            `/teacher/assessment/new?${params.toString()}`,
                          )
                        }}
                        disabled={isbusy}
                        style={{
                          padding: '12px 10px',
                          borderRadius: 12,
                          border: '1.5px solid #4338ca',
                          background: '#eef2ff',
                          color: '#4338ca',
                          fontSize: 12,
                          fontWeight: 800,
                          cursor: isbusy ? 'not-allowed' : 'pointer',
                          opacity: isbusy ? 0.7 : 1,
                          fontFamily: 'inherit',
                        }}
                      >
                        {action.icon} Generate {action.label}
                      </button>
                    ))}
                  </div>
                )}

'''

          updated = src[:start] + replacement + src[end:]
          if updated == src:
            raise SystemExit('ABORT: no change produced')
          if 'Generate Quiz from Lesson' in updated:
            raise SystemExit('ABORT: legacy quiz action remains')
          if 'Create Homework from Lesson' in updated:
            raise SystemExit('ABORT: legacy homework action remains')
          for label in ('Generate Exercise', 'Generate Quiz', 'Generate Homework', 'Generate CAT'):
            if label not in updated:
              raise SystemExit(f'ABORT: missing {label}')

          path.write_text(updated)
          PY

          rm .github/workflows/exq004b5-finalize.yml

          git diff --check
          git diff -- components/teacher/LessonPlanModal.tsx

          git config user.name "eduworldkenya-sys"
          git config user.email "eduworldkenya@gmail.com"
          git add components/teacher/LessonPlanModal.tsx .github/workflows/exq004b5-finalize.yml
          git commit -m "feat(assessment-engine): finalize lesson assessment actions"
          git push origin main
