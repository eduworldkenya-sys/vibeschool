name: Cyborg Universal LLM Gateway
on:
  pull_request:
  workflow_dispatch:
jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-cyborg-llm-gateway.mjs
      - run: npx tsc -p tsconfig.cyborg-proof.json
