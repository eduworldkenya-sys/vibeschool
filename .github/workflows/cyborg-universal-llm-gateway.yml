name: Cyborg Universal LLM Gateway
on:
  pull_request:
  workflow_dispatch:
jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: node scripts/validate-cyborg-llm-gateway.mjs
      - run: node scripts/validate-cyborg-admission-sql.mjs
      - run: python scripts/validate-cyborg-gateway-auth-boundary.py
      - run: python scripts/validate-chemistry-cyborg-stage-executor.py
      - run: python scripts/validate-chemistry-fast-trust-runtime.py
      - run: python scripts/validate-chemistry-curriculum-authority.py
      - run: python scripts/validate-chemistry-one-click-commissioning.py
      - run: python scripts/validate-chemistry-commissioning-doc.py
      - run: python scripts/validate-chemistry-browser-execution-boundary.py
      - run: python scripts/validate-chemistry-infrastructure-recovery.py
      - run: deno check --node-modules-dir=auto supabase/functions/chemistry-stage-executor/index.ts
      - run: npx tsc -p tsconfig.cyborg-proof.json
      - run: node /tmp/cyborg-proof/scripts/cyborg-economic-proof.js
      - run: node /tmp/cyborg-proof/scripts/cyborg-economic-optimization-proof.js
