name: Learner School Life
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261011110000_canonical_learner_school_life.sql"
      - "components/teacher/SchoolLifeParticipation*"
      - "components/teacher/LearnerSchoolLifeStrip.tsx"
      - "components/teacher/LearnerDetailSheet*"
      - "components/teacher/LearnerRelatedRecords.tsx"
      - "components/teacher/LearnerIdentityFields.tsx"
      - "components/teacher/LearnerExperience.module.css"
      - "components/teacher/LearnerSnapshot.tsx"
      - "components/teacher/LearnerGroupSummary.tsx"
      - "app/teacher/students/page.tsx"
      - "app/teacher/classhub/[id]/student/[studentId]/layout.tsx"
      - "scripts/test-learner-workspace.mjs"
      - "app/teacher/classhub/**"
      - "scripts/test-school-life-participation-contract.mjs"
      - ".github/workflows/learner-school-life.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  school-life-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify school-life permissions and editing contract
        run: node scripts/test-school-life-participation-contract.mjs
      - name: Validate SQL in isolated PostgreSQL with permission and lifecycle scenarios
        run: |
          npm install --prefix "$RUNNER_TEMP/school-life-db" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          SCHOOL_LIFE_PGLITE_MODULE="$RUNNER_TEMP/school-life-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-school-life-database.mjs
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Install isolated browser verification dependencies
        run: npm install --prefix "$RUNNER_TEMP/learner-ui" --ignore-scripts --no-audit --no-fund esbuild@0.28.2 playwright@1.55.0
      - name: Install verification browser
        run: node "$RUNNER_TEMP/learner-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify actual learner workspace at mobile and desktop widths
        run: LEARNER_UI_MODULES="$RUNNER_TEMP/learner-ui/node_modules" node scripts/test-learner-workspace.mjs
