name: Worker Engine WE-R1.3 Production Promotion

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_WORKER_ENGINE_WE_R1_3_PRODUCTION to apply the six certified WE-R1.3 migrations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-engine-production-promotion
  cancel-in-progress: false

jobs:
  apply:
    name: Protected WE-R1.3 production infrastructure promotion
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production-migration-repair

    env:
      EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf

    steps:
      - name: Require exact production confirmation and main ref
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_WORKER_ENGINE_WE_R1_3_PRODUCTION"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout exact main head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize immutable evidence and expected migration set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worker-engine-we-r1-3-promotion
          cat > .worker-engine-we-r1-3-promotion/certified-versions.txt <<'EOF'
          20260814111500
          20260814152000
          20260814153500
          20260814155000
          20260814160000
          20260814162000
          EOF
          {
            echo "run_id=${{ github.run_id }}"
            echo "actor=${{ github.actor }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "project_ref=$EXPECTED_PROJECT_REF"
            echo "mission=WE-R1.3"
            echo "mode=CONTROLLED_INFRASTRUCTURE_APPLY"
            echo "shadow_activation=false"
            echo "autonomous_activation=false"
          } > .worker-engine-we-r1-3-promotion/context.txt

      - name: Assert certified WE-R1.3 repository contract
        shell: bash
        run: |
          set -euo pipefail
          while read -r version; do
            file="$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" -print -quit)"
            test -n "$file"
            grep -F 'worker_engine_we_r1_3' <<<"$file"
          done < .worker-engine-we-r1-3-promotion/certified-versions.txt
          migrations="$(cat $(while read -r version; do find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" -print -quit; done < .worker-engine-we-r1-3-promotion/certified-versions.txt))"
          ! grep -Fq 'hq_workforce_tool_gateway_execute(' <<<"$migrations"
          ! grep -Fq 'cron.schedule' <<<"$migrations"
          compact="$(tr -d '[:space:]' <<<"$migrations" | tr '[:upper:]' '[:lower:]')"
          grep -Fq 'heartbeat_enabled=false' <<<"$compact"
          grep -Fq 'factory_enabled=false' <<<"$compact"
          grep -Fq 'runtime_execution_enabled=false' <<<"$compact"
          grep -Fq 'runtime_autonomy_level=0' <<<"$compact"
          grep -Fq 'runtime_max_risk=0' <<<"$compact"
          grep -Fq 'shadow_enabled=false' <<<"$compact"
          grep -Fq 'shadow_scheduler_enabled=false' <<<"$compact"
          grep -Fq 'shadow_global_stop=true' <<<"$compact"

      - name: Run promotion regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-worker-engine-build-ledger-aligned-stage.py
          python3 scripts/test-worker-engine-assert-dry-run-plan.py

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Link exact production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF"

      - name: Capture pre-apply migration ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 | tee .worker-engine-we-r1-3-promotion/migration-list-before.txt

      - name: Parse live ledger and build Worker Engine promotion stage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tbl013-live-ledger-audit.py \
            --migrations-dir supabase/migrations \
            --ledger .worker-engine-we-r1-3-promotion/migration-list-before.txt \
            --report .worker-engine-we-r1-3-promotion/tbl013-report-before.json \
            --plan .worker-engine-we-r1-3-promotion/tbl013-plan-before.md \
            --project-ref "$EXPECTED_PROJECT_REF"
          python3 scripts/worker-engine-build-ledger-aligned-stage.py \
            --report .worker-engine-we-r1-3-promotion/tbl013-report-before.json \
            --migrations-dir supabase/migrations \
            --config supabase/config.toml \
            --stage-dir .worker-engine-we-r1-3-stage \
            --manifest .worker-engine-we-r1-3-promotion/staging-manifest.json \
            --expected-versions .worker-engine-we-r1-3-promotion/actual-pending-versions.txt
          diff -u .worker-engine-we-r1-3-promotion/certified-versions.txt .worker-engine-we-r1-3-promotion/actual-pending-versions.txt

      - name: Link ephemeral stage to production
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd .worker-engine-we-r1-3-stage
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF"

      - name: Dry-run exact production plan
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          cd .worker-engine-we-r1-3-stage
          supabase db push --linked --dry-run --include-all 2>&1 | tee ../.worker-engine-we-r1-3-promotion/db-push-preflight.txt

      - name: Assert dry-run matches all and only certified WE-R1.3 migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/worker-engine-assert-dry-run-plan.py \
            --expected .worker-engine-we-r1-3-promotion/certified-versions.txt \
            --dry-run-output .worker-engine-we-r1-3-promotion/db-push-preflight.txt \
            --report .worker-engine-we-r1-3-promotion/preflight-assertion.txt
          grep -F 'status=PASSED' .worker-engine-we-r1-3-promotion/preflight-assertion.txt

      - name: Apply exact certified WE-R1.3 infrastructure
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          cd .worker-engine-we-r1-3-stage
          supabase db push --linked --include-all 2>&1 | tee ../.worker-engine-we-r1-3-promotion/db-push-apply.txt

      - name: Capture and verify post-apply migration ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 | tee .worker-engine-we-r1-3-promotion/migration-list-after.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          expected=[x.strip() for x in Path('.worker-engine-we-r1-3-promotion/certified-versions.txt').read_text().splitlines() if x.strip()]
          text=Path('.worker-engine-we-r1-3-promotion/migration-list-after.txt').read_text()
          remote=set()
          for line in text.splitlines():
              cols=[c.strip().strip('`') for c in line.split('|')]
              if len(cols)>=2 and re.fullmatch(r'\d{8,14}',cols[1]): remote.add(cols[1])
          missing=[v for v in expected if v not in remote]
          report=[f'expected_count={len(expected)}',f'remote_present_count={sum(v in remote for v in expected)}',f'missing_expected={missing}','status='+('PASSED' if not missing and len(expected)==6 else 'FAILED')]
          Path('.worker-engine-we-r1-3-promotion/post-apply-ledger-assertion.txt').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          if missing or len(expected)!=6: raise SystemExit(1)
          PY

      - name: Re-run dry plan and require zero WE-R1.3 pending work
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          cd .worker-engine-we-r1-3-stage
          supabase db push --linked --dry-run --include-all 2>&1 | tee ../.worker-engine-we-r1-3-promotion/db-push-postflight-dry-run.txt
          cd ..
          for version in $(cat .worker-engine-we-r1-3-promotion/certified-versions.txt); do
            ! grep -Fq "$version" .worker-engine-we-r1-3-promotion/db-push-postflight-dry-run.txt
          done

      - name: Assert activation remains outside promotion scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'shadow_activation=false' .worker-engine-we-r1-3-promotion/context.txt
          grep -F 'autonomous_activation=false' .worker-engine-we-r1-3-promotion/context.txt
          grep -F 'status=PASSED' .worker-engine-we-r1-3-promotion/preflight-assertion.txt
          grep -F 'status=PASSED' .worker-engine-we-r1-3-promotion/post-apply-ledger-assertion.txt
          sha256sum .worker-engine-we-r1-3-promotion/* > .worker-engine-we-r1-3-promotion/evidence.sha256

      - name: Upload immutable production-promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-engine-we-r1-3-production-promotion-${{ github.run_id }}
          path: .worker-engine-we-r1-3-promotion/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
