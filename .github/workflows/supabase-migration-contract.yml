name: Supabase Migration Security Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validate-supabase-migration-contract.py'
      - 'scripts/test-supabase-migration-contract.py'
      - '.github/workflows/supabase-migration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-contract:
    name: Explicit grants, RLS, policies and authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test migration guard
        run: python3 scripts/test-supabase-migration-contract.py

      - name: Validate new migrations
        run: python3 scripts/validate-supabase-migration-contract.py

