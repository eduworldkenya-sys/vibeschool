name: School Follows Security
on:
  pull_request:
    paths:
      - 'supabase/migrations/*school_follows*.sql'
      - 'scripts/test-school-follows-contract.mjs'
      - '.github/workflows/school-follows-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*school_follows*.sql'
      - 'scripts/test-school-follows-contract.mjs'
      - '.github/workflows/school-follows-security.yml'
permissions:
  contents: read
jobs:
  school-follows-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/school-follow-db" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - run: SCHOOL_URL_PGLITE_MODULE="$RUNNER_TEMP/school-follow-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-school-follows-contract.mjs
