name: Worker Engine WE-R1.4 Production Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/worker-engine-we-r1-4-production-recovery.yml"
      - "supabase/migrations/20260818111950_worker_engine_we_r1_4_compensation_lineage_collision_repair.sql"
      - "scripts/worker-engine-build-ledger-aligned-stage.py"
      - "scripts/worker-engine-build-r1-4-production-recovery-stage.py"
      - "scripts/test-worker-engine-build-ledger-aligned-stage.py"
      - "scripts/test-worker-engine-build-r1-4-production-recovery-stage.py"
      - "docs/worker-engine/WORKER_ENGINE_R1_4_PRODUCTION_RECOVERY_HANDOVER_20260818.md"
      - "docs/worker-engine/WORKER_ENGINE_R1_4_RECOVERY_ARRAY_AGG_FIX_HANDOVER_20260818.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker-engine-we-r1-4-production-recovery.yml"
      - "supabase/migrations/20260818111950_worker_engine_we_r1_4_compensation_lineage_collision_repair.sql"
      - "scripts/worker-engine-build-ledger-aligned-stage.py"
      - "scripts/worker-engine-build-r1-4-production-recovery-stage.py"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_WORKER_ENGINE_WE_R1_4_RECOVERY
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: worker-engine-we-r1-4-production-recovery
  cancel-in-progress: false

jobs:
  certify-partial-production-lineage:
    name: Certify observed production collision and forward repair
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify recovery staging contract
        run: |
          set -euo pipefail
          python3 scripts/test-worker-engine-build-r1-4-production-recovery-stage.py
          python3 scripts/test-worker-engine-build-ledger-aligned-stage.py
          python3 scripts/test-worker-engine-assert-dry-run-plan.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start disposable database at production bridge boundary
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql /tmp/vibeschool-seed.sql.disabled; fi
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed --version 20260818111900
      - name: Reproduce observed 151301 semantic collision
        shell: bash
        run: |
          set -euo pipefail
          PSQL='postgresql://postgres@127.0.0.1:54322/postgres'
          PGPASSWORD=postgres psql "$PSQL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Production owns 15130100 with an unrelated migration identity. Reproduce the
          -- resulting Worker Engine state without modifying historical migration source.
          drop trigger if exists trg_hq_workforce_execution_compensation_immutable on public.hq_workforce_execution_compensations;
          drop table if exists public.hq_workforce_execution_compensations;
          drop function if exists public.hq_workforce_guard_execution_compensation_immutable();
          alter table public.hq_workforce_execution_intents drop column if exists authoritative_before_state;
          alter table public.hq_workforce_execution_intents drop column if exists expected_after_state;
          SQL
          q(){ PGPASSWORD=postgres psql "$PSQL" -Atqc "$1"; }
          test "$(q "select to_regclass('public.hq_workforce_execution_compensations') is null")" = t
          test "$(q "select not exists(select 1 from information_schema.columns where table_schema='public' and table_name='hq_workforce_execution_intents' and column_name='authoritative_before_state')")" = t
          test "$(q "select to_regprocedure('public.hq_workforce_capture_execution_authoritative_after_state()') is not null")" = t
          test "$(q "select to_regprocedure('public.hq_workforce_compensate_consequential_execution(uuid,text,text)') is not null")" = t
      - name: Apply forward-only collision repair then closure
        shell: bash
        run: |
          set -euo pipefail
          PSQL='postgresql://postgres@127.0.0.1:54322/postgres'
          PGPASSWORD=postgres psql "$PSQL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260818111950_worker_engine_we_r1_4_compensation_lineage_collision_repair.sql
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort | awk -F/ '{n=$NF; split(n,a,"_"); v=a[1]; l=tolower(n); if (v>="20260818112000" && v<="20260818113000" && index(l,"worker_engine")) print $0}')
          test "${#files[@]}" -ge 2
          for f in "${files[@]}"; do echo "=== closure $f ==="; PGPASSWORD=postgres psql "$PSQL" -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Certify compensation and runtime postconditions
        shell: bash
        run: |
          set -euo pipefail
          PSQL='postgresql://postgres@127.0.0.1:54322/postgres'
          q(){ PGPASSWORD=postgres psql "$PSQL" -Atqc "$1"; }
          test "$(q "select to_regclass('public.hq_workforce_execution_compensations') is not null")" = t
          test "$(q "select exists(select 1 from information_schema.columns where table_schema='public' and table_name='hq_workforce_execution_intents' and column_name='authoritative_before_state' and data_type='jsonb')")" = t
          test "$(q "select exists(select 1 from information_schema.columns where table_schema='public' and table_name='hq_workforce_execution_intents' and column_name='expected_after_state' and data_type='jsonb')")" = t
          test "$(q "select to_regprocedure('public.hq_workforce_guard_execution_compensation_immutable()') is not null")" = t
          test "$(q "select exists(select 1 from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='hq_workforce_execution_compensations' and t.tgname='trg_hq_workforce_execution_compensation_immutable' and not t.tgisinternal)")" = t
          test "$(q "select to_regprocedure('public.hq_workforce_capture_execution_authoritative_after_state()') is not null")" = t
          test "$(q "select to_regprocedure('public.hq_workforce_compensate_consequential_execution(uuid,text,text)') is not null")" = t
          test "$(q "select count(*) from public.hq_workforce_capability_authority_grants where status='active'")" = 0
          STATE="$(q "select heartbeat_enabled::text||'|'||factory_enabled::text||'|'||runtime_execution_enabled::text||'|'||runtime_autonomy_level::text||'|'||runtime_max_risk::text||'|'||shadow_enabled::text||'|'||shadow_scheduler_enabled::text||'|'||shadow_global_stop::text from public.hq_workforce_engine_contract where singleton=true")"
          test "$STATE" = 'false|false|false|0|0|false|false|true'
      - name: Run production-closure adversarial suite
        run: PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_4_production_closure.sql
      - name: Destroy disposable database
        if: always()
        run: supabase stop --no-backup >/dev/null 2>&1 || true

  apply:
    name: Protected production recovery
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: certify-partial-production-lineage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-migration-repair
    env:
      EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf
    steps:
      - name: Require main and explicit manual token when dispatched
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then test "$CONFIRMATION" = APPLY_WORKER_ENGINE_WE_R1_4_RECOVERY; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize evidence
        run: |
          mkdir -p .worker-engine-r1-4-recovery
          printf 'sha=%s\nproject=%s\nruntime_activation=false\nautonomy_activation=false\ncompensation_collision_repair=20260818111950\n' '${{ github.sha }}' "$EXPECTED_PROJECT_REF" > .worker-engine-r1-4-recovery/context.txt
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Link and capture live ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF"
          supabase migration list --linked 2>&1 | tee .worker-engine-r1-4-recovery/ledger-before.txt
          grep -Fq '20260815130100' .worker-engine-r1-4-recovery/ledger-before.txt
          grep -Fq '20260818111900' .worker-engine-r1-4-recovery/ledger-before.txt
      - name: Build exact ledger-aligned recovery stage
        run: |
          set -euo pipefail
          python3 scripts/tbl013-live-ledger-audit.py --migrations-dir supabase/migrations --ledger .worker-engine-r1-4-recovery/ledger-before.txt --report .worker-engine-r1-4-recovery/audit.json --plan .worker-engine-r1-4-recovery/plan.md --project-ref "$EXPECTED_PROJECT_REF"
          python3 scripts/worker-engine-build-r1-4-production-recovery-stage.py --report .worker-engine-r1-4-recovery/audit.json --migrations-dir supabase/migrations --config supabase/config.toml --stage-dir .worker-engine-r1-4-recovery-stage --manifest .worker-engine-r1-4-recovery/manifest.json --expected-versions .worker-engine-r1-4-recovery/pending.txt
          test -s .worker-engine-r1-4-recovery/pending.txt
          ! grep -Fxq '20260815090500' .worker-engine-r1-4-recovery/pending.txt
          ! grep -Fxq '20260815130100' .worker-engine-r1-4-recovery/pending.txt
          ! grep -Fxq '20260818111900' .worker-engine-r1-4-recovery/pending.txt
          grep -Fxq '20260818111950' .worker-engine-r1-4-recovery/pending.txt
          grep -Fxq '20260818112000' .worker-engine-r1-4-recovery/pending.txt
          grep -Fxq '20260818113000' .worker-engine-r1-4-recovery/pending.txt
          grep -Fq 'create_open_schools_kenya_kibera_batch1' .worker-engine-r1-4-recovery/manifest.json
      - name: Link stage and prove exact dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd .worker-engine-r1-4-recovery-stage
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          supabase db push --linked --dry-run --include-all 2>&1 | tee ../.worker-engine-r1-4-recovery/dry-run.txt
          cd ..
          python3 scripts/worker-engine-assert-dry-run-plan.py --expected .worker-engine-r1-4-recovery/pending.txt --dry-run-output .worker-engine-r1-4-recovery/dry-run.txt --report .worker-engine-r1-4-recovery/preflight.txt
          grep -Fq 'status=PASSED' .worker-engine-r1-4-recovery/preflight.txt
      - name: Apply certified recovery only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          cd .worker-engine-r1-4-recovery-stage
          supabase db push --linked --include-all 2>&1 | tee ../.worker-engine-r1-4-recovery/apply.txt
      - name: Verify ledger and zero pending recovery
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 | tee .worker-engine-r1-4-recovery/ledger-after.txt
          while read -r v; do grep -Fq "$v" .worker-engine-r1-4-recovery/ledger-after.txt; done < .worker-engine-r1-4-recovery/pending.txt
          cd .worker-engine-r1-4-recovery-stage
          supabase db push --linked --dry-run --include-all 2>&1 | tee ../.worker-engine-r1-4-recovery/postflight.txt
          cd ..
          while read -r v; do ! grep -Fq "$v" .worker-engine-r1-4-recovery/postflight.txt; done < .worker-engine-r1-4-recovery/pending.txt
          sha256sum .worker-engine-r1-4-recovery/* > .worker-engine-r1-4-recovery/evidence.sha256
      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-engine-r1-4-production-recovery-${{ github.run_id }}
          path: .worker-engine-r1-4-recovery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
