name: Lesson System Release Gate

on:
  pull_request:
    paths:
      - 'components/teacher/LessonPlanModal.tsx'
      - 'components/teacher/LessonTeachMode.tsx'
      - 'lib/teaching/**'
      - 'supabase/functions/generate-lesson-plan/**'
      - 'supabase/functions/generate-canonical-lesson-plan/**'
      - 'supabase/migrations/**lesson_package_cache.sql'
      - 'scripts/test-lesson-system-release-contract.py'
      - 'scripts/test-lesson-timing-contract.cjs'
      - '.github/workflows/lesson-system-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'components/teacher/LessonPlanModal.tsx'
      - 'components/teacher/LessonTeachMode.tsx'
      - 'lib/teaching/**'
      - 'supabase/functions/generate-lesson-plan/**'
      - 'supabase/functions/generate-canonical-lesson-plan/**'
      - 'supabase/migrations/**lesson_package_cache.sql'
      - 'scripts/test-lesson-system-release-contract.py'
      - 'scripts/test-lesson-timing-contract.cjs'
      - '.github/workflows/lesson-system-release-gate.yml'

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lesson architecture contract
        run: python scripts/test-lesson-system-release-contract.py
      - name: Compile timing helper
        run: npx tsc lib/teaching/lessonTiming.ts --target ES2020 --module commonjs --outDir /tmp/vibeschool-lesson-timing --skipLibCheck
      - name: Exact timing contract
        run: node scripts/test-lesson-timing-contract.cjs /tmp/vibeschool-lesson-timing/lessonTiming.js
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
