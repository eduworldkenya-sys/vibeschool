name: Worker Engine Production Promotion Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_WORKER_ENGINE_PRODUCTION to apply the certified Worker Engine migration set
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-engine-production-promotion
  cancel-in-progress: false

jobs:
  apply:
    name: Protected Worker Engine production promotion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-migration-repair

    env:
      EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf

    steps:
      - name: Require exact production confirmation and main ref
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY_WORKER_ENGINE_PRODUCTION" ]; then
            echo "Refusing Worker Engine production promotion: confirmation phrase mismatch." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing Worker Engine production promotion from non-main ref: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worker-engine-promotion-apply
          {
            echo "run_id=${{ github.run_id }}"
            echo "actor=${{ github.actor }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "project_ref=$EXPECTED_PROJECT_REF"
            echo "mode=CONTROLLED_APPLY"
            echo "autonomous_activation=false"
          } > .worker-engine-promotion-apply/context.txt

      - name: Run promotion regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-worker-engine-build-ledger-aligned-stage.py
          python3 scripts/test-worker-engine-assert-dry-run-plan.py

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Link exact production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"

      - name: Capture pre-apply local and remote migration ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 \
            | tee .worker-engine-promotion-apply/migration-list-before.txt

      - name: Run proven TBL-013 read-only ledger parser
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tbl013-live-ledger-audit.py \
            --migrations-dir supabase/migrations \
            --ledger .worker-engine-promotion-apply/migration-list-before.txt \
            --report .worker-engine-promotion-apply/tbl013-report-before.json \
            --plan .worker-engine-promotion-apply/tbl013-plan-before.md \
            --project-ref "$EXPECTED_PROJECT_REF"

      - name: Build ledger-aligned ephemeral promotion view
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/worker-engine-build-ledger-aligned-stage.py \
            --report .worker-engine-promotion-apply/tbl013-report-before.json \
            --migrations-dir supabase/migrations \
            --config supabase/config.toml \
            --stage-dir .worker-engine-promotion-stage \
            --manifest .worker-engine-promotion-apply/staging-manifest.json \
            --expected-versions .worker-engine-promotion-apply/expected-versions.txt
          test "$(wc -l < .worker-engine-promotion-apply/expected-versions.txt | tr -d ' ')" = "22"

      - name: Link ephemeral view to exact production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd .worker-engine-promotion-stage
          supabase link --project-ref "$EXPECTED_PROJECT_REF"

      - name: Re-run production dry plan immediately before apply
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          cd .worker-engine-promotion-stage
          supabase db push --linked --dry-run --include-all 2>&1 \
            | tee ../.worker-engine-promotion-apply/db-push-preflight.txt

      - name: Assert pre-apply plan is exactly the certified migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/worker-engine-assert-dry-run-plan.py \
            --expected .worker-engine-promotion-apply/expected-versions.txt \
            --dry-run-output .worker-engine-promotion-apply/db-push-preflight.txt \
            --report .worker-engine-promotion-apply/preflight-assertion.txt
          grep -F 'status=PASSED' .worker-engine-promotion-apply/preflight-assertion.txt

      - name: Apply exact certified Worker Engine migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          cd .worker-engine-promotion-stage
          supabase db push --linked --include-all 2>&1 \
            | tee ../.worker-engine-promotion-apply/db-push-apply.txt

      - name: Capture post-apply migration ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 \
            | tee .worker-engine-promotion-apply/migration-list-after.txt

      - name: Verify all certified versions are recorded remotely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          expected = [x.strip() for x in Path('.worker-engine-promotion-apply/expected-versions.txt').read_text().splitlines() if x.strip()]
          text = Path('.worker-engine-promotion-apply/migration-list-after.txt').read_text()
          remote = set()
          for line in text.splitlines():
              cols = [c.strip().strip('`') for c in line.split('|')]
              if len(cols) >= 2 and re.fullmatch(r'\d{8,14}', cols[1]):
                  remote.add(cols[1])
          missing = [v for v in expected if v not in remote]
          report = [
              f'expected_count={len(expected)}',
              f'remote_present_count={sum(v in remote for v in expected)}',
              f'missing_expected={missing}',
              'status=' + ('PASSED' if not missing and len(expected) == 22 else 'FAILED'),
          ]
          Path('.worker-engine-promotion-apply/post-apply-ledger-assertion.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
          if missing or len(expected) != 22:
              raise SystemExit(1)
          PY

      - name: Assert autonomous activation remains outside promotion scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'autonomous_activation=false' .worker-engine-promotion-apply/context.txt
          grep -F 'status=PASSED' .worker-engine-promotion-apply/preflight-assertion.txt
          grep -F 'status=PASSED' .worker-engine-promotion-apply/post-apply-ledger-assertion.txt
          sha256sum .worker-engine-promotion-apply/* \
            > .worker-engine-promotion-apply/evidence.sha256

      - name: Upload production promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-engine-production-promotion-apply-${{ github.run_id }}
          path: .worker-engine-promotion-apply/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
