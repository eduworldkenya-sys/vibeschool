name: Claim UX patch runner

on:
  push:
    branches:
      - fix/shared-claim-code-10of10

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/claim_ux_patch.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/classhub/'[id]'/student/'[studentId]'/page.tsx
          git commit -m 'feat: migrate teacher learner to shared claim code [claim-ux-patched]'
          git push
