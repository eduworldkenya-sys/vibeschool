name: School Home UX Contract
on:
  pull_request:
    paths:
      - 'components/schools/**'
      - 'app/school/**'
      - 'app/schools/**'
      - 'lib/supabase.ts'
      - 'scripts/test-school-visitor-home.mjs'
      - '.github/workflows/school-home-ux.yml'
  push:
    branches: [main]
    paths:
      - 'components/schools/**'
      - 'app/school/**'
      - 'app/schools/**'
      - 'lib/supabase.ts'
      - 'scripts/test-school-visitor-home.mjs'
      - '.github/workflows/school-home-ux.yml'
permissions:
  contents: read
jobs:
  visitor-journey-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/test-school-visitor-home.mjs
