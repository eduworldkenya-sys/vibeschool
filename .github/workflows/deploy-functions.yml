name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy product functions
        run: |
          supabase functions deploy twin-chat --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy swift-processor --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Preserve controlled M-Pesa release boundary
        run: |
          echo "M-Pesa functions are intentionally excluded from generic main deployments."
          echo "Use the controlled M-Pesa release workflow only after production schema attestation."
