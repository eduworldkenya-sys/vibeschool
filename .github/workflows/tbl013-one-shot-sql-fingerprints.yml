name: TBL-013 One-Shot SQL Fingerprints

on:
  push:
    branches:
      - fix/tbl-013-production-ledger-reconciliation-refresh-20260812
    paths:
      - .github/workflows/tbl013-one-shot-sql-fingerprints.yml

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPO_SHA: 929d49f73c9148e149c5c9bf0a5b201710a2e900
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REPO_SHA }}
      - name: Canonicalize and fingerprint migration SQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tbl013-fingerprints
          test "$(git rev-parse HEAD)" = "$TARGET_REPO_SHA"
          python3 - <<'PYEOF'
          import hashlib, json, re
          from pathlib import Path

          def canonical(sql: str) -> str:
              # Conservative lexical normalization for calibration. It removes
              # comments and insignificant whitespace but preserves tokens and
              # statement order. A mismatch is never treated as proof of drift.
              sql = re.sub(r'/\*.*?\*/', '', sql, flags=re.S)
              sql = re.sub(r'--[^\n\r]*', '', sql)
              sql = re.sub(r'\s+', '', sql).lower()
              return sql

          rows=[]
          pat=re.compile(r'^(\d{8,14})_(.+)\.sql$')
          for path in sorted(Path('supabase/migrations').glob('*.sql')):
              m=pat.fullmatch(path.name)
              if not m: continue
              raw=path.read_text(encoding='utf-8', errors='replace')
              canon=canonical(raw)
              rows.append({
                  'version':m.group(1),
                  'name':m.group(2),
                  'file':path.name,
                  'raw_sha256':hashlib.sha256(raw.encode()).hexdigest(),
                  'canonical_sha256':hashlib.sha256(canon.encode()).hexdigest(),
                  'canonical_length':len(canon),
              })
          Path('tbl013-fingerprints/repository-sql-fingerprints.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('fingerprinted',len(rows),'migrations')
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: tbl013-sql-fingerprints-${{ github.run_id }}
          path: tbl013-fingerprints/
          if-no-files-found: error
          retention-days: 30
