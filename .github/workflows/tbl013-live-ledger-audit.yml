name: TBL-013 Production Migration Ledger Audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_PRODUCTION_LEDGER to run the read-only production audit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tbl013-production-ledger-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only production ledger reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-migration-repair

    env:
      EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf

    steps:
      - name: Require explicit read-only audit confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "AUDIT_PRODUCTION_LEDGER" ]; then
            echo "Refusing production ledger audit: confirmation phrase mismatch." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tbl013-artifacts

          {
            echo "run_id=${{ github.run_id }}"
            echo "actor=${{ github.actor }}"
            echo "sha=${{ github.sha }}"
            echo "project_ref=$EXPECTED_PROJECT_REF"
            echo "mode=READ_ONLY"
          } > .tbl013-artifacts/context.txt

      - name: Run local auditor tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-tbl013-live-ledger-audit.py

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.76.8

      - name: Link exact production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"

      - name: Capture production migration ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 \
            | tee .tbl013-artifacts/live-migration-ledger.txt

      - name: Audit repository against production ledger
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/tbl013-live-ledger-audit.py \
            --migrations-dir supabase/migrations \
            --ledger .tbl013-artifacts/live-migration-ledger.txt \
            --report .tbl013-artifacts/tbl013-ledger-audit.json \
            --plan .tbl013-artifacts/tbl013-reconciliation-plan.md \
            --project-ref "$EXPECTED_PROJECT_REF"

          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".tbl013-artifacts/tbl013-ledger-audit.json").read_text(
                  encoding="utf-8"
              )
          )

          print("TBL-013 reconciliation status:", report["reconciliation_status"])
          print("Repository-only:", report["counts"]["local_only_versions"])
          print("Production-only:", report["counts"]["remote_only_versions"])
          print("Duplicate local:", report["counts"]["duplicate_local_versions"])
          print("Duplicate production:", report["counts"]["duplicate_remote_versions"])
          print("Provenance classifications required:", report["counts"]["classification_required"])
          print("Authorized repairs:", report["counts"]["authorized_repairs"])
          PYEOF

          sha256sum \
            .tbl013-artifacts/live-migration-ledger.txt \
            .tbl013-artifacts/tbl013-ledger-audit.json \
            .tbl013-artifacts/tbl013-reconciliation-plan.md \
            > .tbl013-artifacts/evidence.sha256

      - name: Enforce non-destructive audit boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".tbl013-artifacts/tbl013-ledger-audit.json").read_text(
                  encoding="utf-8"
              )
          )

          if report.get("read_only_audit") is not True:
              raise SystemExit("TBL-013 safety failure: report is not read-only")

          if report.get("repair_inference_from_set_difference") is not False:
              raise SystemExit(
                  "TBL-013 safety failure: set difference permits repair inference"
              )

          if report.get("authorized_repairs"):
              raise SystemExit(
                  "TBL-013 safety failure: audit unexpectedly authorized repairs"
              )

          if report["counts"].get("authorized_repairs") != 0:
              raise SystemExit(
                  "TBL-013 safety failure: authorized repair count is not zero"
              )

          pending = report.get("classification_required", [])
          if pending:
              print(
                  "TBL-013 AUDIT COMPLETE — PRODUCTION REPAIR BLOCKED; "
                  f"{len(pending)} VERSION(S) REQUIRE PROVENANCE CLASSIFICATION"
              )
          else:
              print("TBL-013 AUDIT COMPLETE — LEDGER VERSION PARITY CONFIRMED")
          PYEOF

      - name: Upload immutable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbl013-ledger-audit-${{ github.run_id }}
          path: .tbl013-artifacts/
          if-no-files-found: error
          retention-days: 30
