name: Restore teacher light surface

on:
  push:
    paths:
      - .github/workflows/restore-teacher-light-surface.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore only the teacher page surface
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/teacher/layout.tsx')
          source = path.read_text(encoding='utf-8')
          old = '<main style={{ minHeight: "calc(100vh - 120px)", paddingBottom: 84 }}>{children}</main>'
          new = '<main style={{ minHeight: "calc(100vh - 120px)", paddingBottom: 84, background: "#f8fafc" }}>{children}</main>'

          count = source.count(old)
          if count != 1:
              raise SystemExit(f'ABORT: expected one teacher main anchor, found {count}')

          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- app/teacher/layout.tsx

      - name: Commit exact repair
        run: |
          git config user.name "Vibeschool Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/teacher/layout.tsx
          git commit -m "fix(teacher): restore light page background"
          git push origin HEAD:main
