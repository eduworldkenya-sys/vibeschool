name: Temporary generate Worker Engine promotion migration

on:
  push:
    branches:
      - fix/worker-engine-promotion-fail-closed-20260813
    paths:
      - '.github/workflows/tmp-generate-worker-engine-promotion-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/worker-engine-promotion-fail-closed-20260813
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover Supabase migration command
        run: |
          npx --yes supabase@latest --version
          npx --yes supabase@latest migration new --help

      - name: Generate canonical migration file
        shell: bash
        run: |
          set -euo pipefail
          before="$(find supabase/migrations -maxdepth 1 -type f -name '*_worker_engine_promotion_fail_closed.sql' -print | sort)"
          npx --yes supabase@latest migration new worker_engine_promotion_fail_closed
          after="$(find supabase/migrations -maxdepth 1 -type f -name '*_worker_engine_promotion_fail_closed.sql' -print | sort)"
          migration="$(comm -13 <(printf '%s\n' "$before" | sed '/^$/d') <(printf '%s\n' "$after" | sed '/^$/d') | tail -n1)"
          test -n "$migration"
          cat > "$migration" <<'SQL'
          -- Worker Engine production-promotion fail-closed hardening.
          -- Runtime promotion and autonomy activation are intentionally separate.
          -- This migration must leave both activation flags OFF and no Worker Engine cron schedule.

          update public.hq_workforce_engine_contract
          set heartbeat_enabled = false,
              factory_enabled = false,
              updated_at = clock_timestamp()
          where singleton = true;

          -- Remove the historical scheduler registered by WE-L6/WE-L11 if pg_cron is present.
          -- Use the supported pg_cron function rather than mutating cron.job directly.
          do $$
          begin
            if exists (select 1 from pg_extension where extname = 'pg_cron')
               and exists (
                 select 1
                 from cron.job
                 where jobname = 'vibeschool-worker-engine-heartbeat'
               ) then
              perform cron.unschedule('vibeschool-worker-engine-heartbeat');
            end if;
          end
          $$;

          -- Production forensics found two legacy probation authority routines that are
          -- production-only drift, plus the historical bulk certifier. Clean replay may
          -- not contain the production-only routines, so revoke them conditionally.
          do $$
          begin
            if to_regprocedure('public.hq_workforce_create_probation_worker(text,text,text,jsonb)') is not null then
              execute 'revoke execute on function public.hq_workforce_create_probation_worker(text,text,text,jsonb) from service_role';
            end if;

            if to_regprocedure('public.hq_workforce_certify_probation_worker(uuid,text)') is not null then
              execute 'revoke execute on function public.hq_workforce_certify_probation_worker(uuid,text) from service_role';
            end if;

            if to_regprocedure('public.hq_workforce_certify_probation_workers()') is not null then
              execute 'revoke execute on function public.hq_workforce_certify_probation_workers() from service_role';
            end if;
          end
          $$;
          SQL
          echo "migration=$migration" >> "$GITHUB_ENV"

      - name: Verify generated migration content
        shell: bash
        run: |
          set -euo pipefail
          test -f "$migration"
          grep -F "heartbeat_enabled = false" "$migration"
          grep -F "factory_enabled = false" "$migration"
          grep -F "cron.unschedule('vibeschool-worker-engine-heartbeat')" "$migration"
          grep -F "hq_workforce_create_probation_worker(text,text,text,jsonb)" "$migration"
          grep -F "hq_workforce_certify_probation_worker(uuid,text)" "$migration"
          grep -F "hq_workforce_certify_probation_workers()" "$migration"

      - name: Remove temporary generator and commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-generate-worker-engine-promotion-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration" .github/workflows/tmp-generate-worker-engine-promotion-migration.yml
          git commit -m "fix(worker-engine): fail closed before production promotion"
          git push origin HEAD:fix/worker-engine-promotion-fail-closed-20260813
