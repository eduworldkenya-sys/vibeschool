name: Public Real-Product Sandbox

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/sandbox/**'
      - 'components/public/PublicProductSandbox.tsx'
      - 'components/public/PublicProductSandbox.module.css'
      - 'components/public/PublicHeader.tsx'
      - 'app/api/public-telemetry/**'
      - 'lib/publicTelemetry.ts'
      - 'scripts/test-public-sandbox.mjs'
      - '.github/workflows/public-browser-gate.yml'
      - '.github/workflows/public-sandbox-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app/sandbox/**'
      - 'components/public/PublicProductSandbox.tsx'
      - 'components/public/PublicProductSandbox.module.css'
      - 'components/public/PublicHeader.tsx'
      - 'app/api/public-telemetry/**'
      - 'lib/publicTelemetry.ts'
      - 'scripts/test-public-sandbox.mjs'
      - '.github/workflows/public-browser-gate.yml'
      - '.github/workflows/public-sandbox-contract.yml'

permissions:
  contents: read

jobs:
  public-sandbox-contract:
    name: Sandbox browser coverage wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate sandbox journey syntax
        run: node --check scripts/test-public-sandbox.mjs
      - name: Verify canonical browser ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/public-browser-gate.yml').read_text()
          sandbox_test = Path('scripts/test-public-sandbox.mjs').read_text()
          required_workflow = [
              "'scripts/test-public-sandbox.mjs'",
              'cp "$GITHUB_WORKSPACE/scripts/test-public-sandbox.mjs" ./test-public-sandbox.mjs',
              'name: Run sandbox browser certification',
              'run: node test-public-sandbox.mjs',
          ]
          for needle in required_workflow:
              assert needle in workflow, f'canonical public browser gate is not owning sandbox runtime coverage: {needle}'
          for needle in ['No production learner data', 'Client-only demo state', 'externalDataRequests', 'Reset demo']:
              assert needle in sandbox_test, f'sandbox browser contract missing invariant: {needle}'
          print('PUBLIC SANDBOX WIRING CONTRACT: PASS')
          PY
