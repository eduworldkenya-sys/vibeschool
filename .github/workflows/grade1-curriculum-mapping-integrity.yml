name: Grade 1 Curriculum Mapping Integrity

on:
  pull_request:
    paths:
      - 'app/teacher/scheme/AuthoritySchemePage.jsx'
      - 'components/teacher/curriculum/Grade1*Map.tsx'
      - 'components/teacher/curriculum/Grade8MathematicsMap.jsx'
      - 'components/teacher/curriculum/Grade6MathematicsMap.jsx'
      - 'components/teacher/curriculum/Grade4MathematicsMap.jsx'
      - 'lib/teaching/grade4MathematicsCatalog.mjs'
      - 'scripts/test-grade4-mathematics-scheme.mjs'
      - 'supabase/migrations/20261111140500_grade4_mathematics_kicd_map_scheme.sql'
      - 'app/teacher/subjecthub/page.tsx'
      - 'lib/curriculum/grade6Mathematics2024.json'
      - 'lib/teaching/grade6MathematicsCatalog.mjs'
      - 'scripts/test-grade6-mathematics-scheme.mjs'
      - 'supabase/migrations/20261111131700_grade6_mathematics_kicd_reference_scheme.sql'
      - 'lib/teaching/grade8MathematicsCatalog.mjs'
      - 'scripts/test-grade8-mathematics-scheme.mjs'
      - 'supabase/migrations/20261111100935_grade8_mathematics_kicd_reference_scheme_20261111.sql'
      - 'scripts/test-grade1-*.mjs'
      - 'supabase/migrations/20261111080000_grade1_math_english_curriculum_scheme_bindings.sql'
  push:
    branches: [main]
    paths:
      - 'app/teacher/scheme/AuthoritySchemePage.jsx'
      - 'components/teacher/curriculum/Grade1*Map.tsx'
      - 'components/teacher/curriculum/Grade8MathematicsMap.jsx'
      - 'components/teacher/curriculum/Grade6MathematicsMap.jsx'
      - 'components/teacher/curriculum/Grade4MathematicsMap.jsx'
      - 'lib/teaching/grade4MathematicsCatalog.mjs'
      - 'scripts/test-grade4-mathematics-scheme.mjs'
      - 'supabase/migrations/20261111140500_grade4_mathematics_kicd_map_scheme.sql'
      - 'app/teacher/subjecthub/page.tsx'
      - 'lib/curriculum/grade6Mathematics2024.json'
      - 'lib/teaching/grade6MathematicsCatalog.mjs'
      - 'scripts/test-grade6-mathematics-scheme.mjs'
      - 'supabase/migrations/20261111131700_grade6_mathematics_kicd_reference_scheme.sql'
      - 'lib/teaching/grade8MathematicsCatalog.mjs'
      - 'scripts/test-grade8-mathematics-scheme.mjs'
      - 'supabase/migrations/20261111100935_grade8_mathematics_kicd_reference_scheme_20261111.sql'
      - 'scripts/test-grade1-*.mjs'
      - 'supabase/migrations/20261111080000_grade1_math_english_curriculum_scheme_bindings.sql'

permissions:
  contents: read

jobs:
  curriculum-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Creative Activities canonical regression
        run: node scripts/test-grade1-creative-native-curriculum.mjs
      - name: Verify Mathematics map
        run: node scripts/test-grade1-mathematics-native-curriculum.mjs
      - name: Verify English map
        run: node scripts/test-grade1-english-native-curriculum.mjs
      - name: Verify combined Curriculum Map
        run: node scripts/test-grade1-english-mathematics-curriculum-map.mjs
      - name: Verify persistent reader identity and Scheme authority
        run: node scripts/test-grade1-math-english-scheme-bindings.mjs
      - name: Verify Grade 8 Mathematics curriculum and annual scheme
        run: node scripts/test-grade8-mathematics-scheme.mjs
      - name: Verify Grade 6 Mathematics curriculum and annual scheme
        run: node scripts/test-grade6-mathematics-scheme.mjs
      - name: Verify Grade 4 Mathematics curriculum and annual scheme
        run: node scripts/test-grade4-mathematics-scheme.mjs
