name: Auth Gateway Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/auth/**'
      - 'app/api/create-student-account/**'
      - 'app/signup/student/independent/**'
      - 'app/signup/student/email/**'
      - 'components/learner/LearnerGradePicker.*'
      - 'scripts/test-learner-grade-picker.mjs'
      - 'app/login/**'
      - 'app/reset-password/**'
      - 'lib/auth-routing.ts'
      - 'middleware.ts'
      - 'public/sw.js'
      - 'supabase/migrations/**auth**'
      - 'scripts/test-auth-gateway-contract.mjs'
      - 'scripts/test-signup-role-integrity.mjs'
      - 'scripts/test-auth-identity-reconciliation-contract.mjs'
      - '*.py'
      - '.github/workflows/auth-gateway-contract.yml'

permissions:
  contents: read

jobs:
  auth-gateway-contract:
    name: Authority, OAuth, recovery and identity integrity contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test-auth-gateway-contract.mjs
      - run: node scripts/test-auth-identity-reconciliation-contract.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-signup-role-integrity.mjs
      - run: node scripts/test-learner-grade-picker.mjs
