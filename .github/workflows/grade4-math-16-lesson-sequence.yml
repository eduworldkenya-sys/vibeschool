name: Grade 4 Numbers 16-Lesson Editorial Quality
on:
  pull_request:
    paths:
      - 'content/curriculum/production/grade4-mathematics-addition-subtraction-16-lesson-sequence.v1.editorial.json'
      - 'scripts/test-grade4-math-16-lesson-sequence.mjs'
      - '.github/workflows/grade4-math-16-lesson-sequence.yml'
  push:
    branches: [main]
    paths:
      - 'content/curriculum/production/grade4-mathematics-addition-subtraction-16-lesson-sequence.v1.editorial.json'
      - 'scripts/test-grade4-math-16-lesson-sequence.mjs'
      - '.github/workflows/grade4-math-16-lesson-sequence.yml'
permissions:
  contents: read
jobs:
  editorial-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/test-grade4-math-16-lesson-sequence.mjs
