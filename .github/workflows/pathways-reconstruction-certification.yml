name: Pathways Reconstruction Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/pathways/**'
      - 'lib/pathways/**'
      - 'supabase/migrations/*pathways*.sql'
      - 'scripts/test-pathways-auth-boundary.py'
      - '.github/workflows/pathways-*.yml'
      - '.github/actions/production-build-contract/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pathways-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pathways authority + canonical production build certification
        uses: ./.github/actions/production-build-contract
        with:
          prebuild_command: |
            python3 scripts/test-pathways-auth-boundary.py
            npm run typecheck
            npm run lint
          supabase_url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase_anon_key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
