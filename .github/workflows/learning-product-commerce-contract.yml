name: Learning Product Commerce Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260818043*.sql'
      - 'supabase/functions/learning-product-stk-push/**'
      - 'supabase/functions/learning-product-mpesa-callback/**'
      - 'scripts/sql/learning_product_commerce_verify.sql'
      - 'scripts/sql/learning_product_storefront_revenue_verify.sql'
      - 'app/learn/purchase/**'
      - 'app/global/store/**'
      - 'app/global/publisher/revenue/**'
      - 'app/read/textbook/[publicationId]/layout.tsx'
      - 'components/read/ReaderPurchaseBar.tsx'
      - '.github/workflows/learning-product-commerce-contract.yml'
      - '.github/workflows/mpesa-edge-functions.yml'

concurrency:
  group: learning-product-commerce-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database-contract:
    name: Disposable-local commerce certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify Docker
        run: docker info
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Disable seed
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql /tmp/vibeschool-seed.sql.disabled; fi
      - name: Start disposable Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Rebuild full migration chain
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local --no-seed
      - name: Certify Learning Product commerce semantics
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -f scripts/sql/learning_product_commerce_verify.sql
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -f scripts/sql/learning_product_storefront_revenue_verify.sql
      - name: Destroy disposable Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup > /dev/null 2>&1 || true

  application-contract:
    name: Checkout TypeScript and Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Type-check application
        run: npm run typecheck
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Learning Product M-Pesa functions
        run: |
          deno check supabase/functions/learning-product-stk-push/index.ts
          deno check supabase/functions/learning-product-mpesa-callback/index.ts
