name: Quality Intelligence Evaluation

on:
  pull_request:
    paths:
      - 'quality-intelligence/**'
      - 'scripts/quality_intelligence_evaluate.py'
      - '.github/workflows/quality-intelligence-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-evaluator:
    name: Independent evaluator calibration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile evaluator
        run: python -m py_compile scripts/quality_intelligence_evaluate.py
      - name: Calibrate against sealed gold suite
        run: python scripts/quality_intelligence_evaluate.py --calibrate
      - name: Verify worker-runtime independence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rubric=json.loads(Path('quality-intelligence/rubrics/teacher-guide-v1.json').read_text())
          independence=rubric['independence']
          assert independence['content_worker_may_modify'] is False
          assert independence['content_worker_self_score_is_authoritative'] is False
          assert independence['worker_preflight_is_input_evidence_only'] is True
          assert independence['certification_requires_independent_evaluation'] is True
          print('independence contract: PASS')
          PY
