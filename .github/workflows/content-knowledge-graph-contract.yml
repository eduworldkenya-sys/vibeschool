name: Content Knowledge Graph Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*content_knowledge_graph*'
      - 'scripts/sql/content_knowledge_graph_verify.sql'
      - '.github/workflows/content-knowledge-graph-contract.yml'

concurrency:
  group: content-knowledge-graph-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database-contract:
    name: Disposable-local semantic graph certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify Docker
        run: docker info
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Disable seed
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql /tmp/vibeschool-seed.sql.disabled; fi
      - name: Start disposable Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Rebuild full migration chain
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local --no-seed
      - name: Certify semantic graph invariants
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -f scripts/sql/content_knowledge_graph_verify.sql
      - name: Destroy disposable Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup > /dev/null 2>&1 || true
