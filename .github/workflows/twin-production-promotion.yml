name: Twin Production Promotion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/twin-production-promotion.yml'
      - 'supabase/migrations/20260818050000_teacher_twin_multi_school_scope.sql'
      - 'supabase/migrations/20260818050100_teacher_twin_active_school_preference.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/twin-production-promotion.yml'
      - 'supabase/migrations/20260818050000_teacher_twin_multi_school_scope.sql'
      - 'supabase/migrations/20260818050100_teacher_twin_active_school_preference.sql'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APPLY_TWIN_PRODUCTION'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: twin-production-promotion
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf
  EXPECTED_PENDING_VERSIONS: '20260818050000 20260818050100'
  EXPECTED_FIRST_FILE: supabase/migrations/20260818050000_teacher_twin_multi_school_scope.sql
  EXPECTED_SECOND_FILE: supabase/migrations/20260818050100_teacher_twin_active_school_preference.sql

jobs:
  contract:
    name: Twin production promotion contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4

      - name: Verify exact migration contract
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EXPECTED_FIRST_FILE"
          test -f "$EXPECTED_SECOND_FILE"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20260818050000_*.sql' | wc -l | tr -d ' ')" = "1"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20260818050100_*.sql' | wc -l | tr -d ' ')" = "1"
          grep -F 'primary key (teacher_id, school_id)' "$EXPECTED_FIRST_FILE"
          grep -F 'unique (teacher_id, school_id, claim_key)' "$EXPECTED_FIRST_FILE"
          grep -F 'teacher_get_twin_brain(p_school_id uuid)' "$EXPECTED_FIRST_FILE"
          grep -F "raise exception 'teacher_school_scope_not_authorized'" "$EXPECTED_FIRST_FILE"
          grep -F 'teacher_set_active_twin_school(p_school_id uuid)' "$EXPECTED_SECOND_FILE"
          grep -F 'update public.teacher_profiles tp' "$EXPECTED_SECOND_FILE"

      - name: Verify promotion is fail-closed and production-scoped
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_PROJECT_REF" = 'yauqsxggtuxuykcbrtzf'
          test "$EXPECTED_PENDING_VERSIONS" = '20260818050000 20260818050100'
          grep -F 'environment: production-migration-repair' .github/workflows/twin-production-promotion.yml
          grep -F 'supabase db push --linked --dry-run --include-all' .github/workflows/twin-production-promotion.yml
          grep -F 'supabase db push --linked --include-all' .github/workflows/twin-production-promotion.yml
          grep -F 'test "$GITHUB_REF" = '\''refs/heads/main'\''' .github/workflows/twin-production-promotion.yml

  apply:
    name: Protected exact-version Twin production apply
    needs: contract
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'APPLY_TWIN_PRODUCTION')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-migration-repair
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_PROJECT_REF"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f "$EXPECTED_FIRST_FILE"
          test -f "$EXPECTED_SECOND_FILE"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Link exact production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF"

      - name: Capture remote ledger before apply
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .twin-production-promotion
          supabase migration list --linked 2>&1 | tee .twin-production-promotion/migration-list-before.txt

      - name: Determine exact pending Twin versions
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path('.twin-production-promotion/migration-list-before.txt').read_text(encoding='utf-8', errors='replace')
          remote = set()
          for line in text.splitlines():
              cols = [c.strip().strip('`') for c in line.split('|')]
              if len(cols) >= 2 and re.fullmatch(r'\d{8,14}', cols[1]):
                  remote.add(cols[1])

          expected = os.environ['EXPECTED_PENDING_VERSIONS'].split()
          pending = [v for v in expected if v not in remote]
          unexpected = [v for v in expected if v in remote]
          if unexpected and pending:
              raise SystemExit(f'partial Twin production state: applied={unexpected} pending={pending}')

          Path('.twin-production-promotion/remote-versions-before.txt').write_text('\n'.join(sorted(remote)) + '\n', encoding='utf-8')
          Path('.twin-production-promotion/expected-versions.txt').write_text('\n'.join(pending) + ('\n' if pending else ''), encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write(f"needs_apply={'true' if pending else 'false'}\n")
          print(f'remote_versions={len(remote)} pending={pending}')
          PY

      - name: Build ledger-aligned Twin migration stage
        if: steps.pending.outputs.needs_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          migration_re = re.compile(r'^(\d{8,14})_.+\.sql$')
          expected = os.environ['EXPECTED_PENDING_VERSIONS'].split()
          migrations = Path('supabase/migrations')
          config = Path('supabase/config.toml')
          stage = Path('.twin-production-promotion-stage')
          remote = {x.strip() for x in Path('.twin-production-promotion/remote-versions-before.txt').read_text().splitlines() if x.strip()}
          pending = [v for v in expected if v not in remote]
          if pending != expected:
              raise SystemExit(f'expected both Twin migrations to be pending together; pending={pending}')

          local = {}
          for path in migrations.glob('*.sql'):
              match = migration_re.fullmatch(path.name)
              if not match:
                  raise SystemExit(f'invalid migration filename: {path.name}')
              version = match.group(1)
              if version in local:
                  raise SystemExit(f'duplicate local migration version: {version}')
              local[version] = path
          for version in expected:
              if version not in local:
                  raise SystemExit(f'target migration missing locally: {version}')

          if stage.exists():
              shutil.rmtree(stage)
          stage_migrations = stage / 'supabase' / 'migrations'
          stage_migrations.mkdir(parents=True)
          shutil.copy2(config, stage / 'supabase' / 'config.toml')

          staged = set()
          placeholders = []
          for version in sorted(remote):
              source = local.get(version)
              if source is not None:
                  shutil.copy2(source, stage_migrations / source.name)
              else:
                  placeholder = stage_migrations / f'{version}_production_history_placeholder.sql'
                  placeholder.write_text('-- Ledger-alignment placeholder for an already-applied production migration. Never executed.\n', encoding='utf-8')
                  placeholders.append(version)
              staged.add(version)

          for version in expected:
              source = local[version]
              shutil.copy2(source, stage_migrations / source.name)
              staged.add(version)

          wanted = remote | set(expected)
          if staged != wanted:
              raise SystemExit(f'stage mismatch missing={sorted(wanted-staged)} extra={sorted(staged-wanted)}')

          Path('.twin-production-promotion/stage-summary.txt').write_text(
              f'remote_versions={len(remote)}\n'
              f'placeholders={len(placeholders)}\n'
              f'staged_versions={len(staged)}\n'
              f'pending_versions={" ".join(expected)}\n',
              encoding='utf-8',
          )
          print(Path('.twin-production-promotion/stage-summary.txt').read_text())
          PY

      - name: Link ledger-aligned stage to exact production project
        if: steps.pending.outputs.needs_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd .twin-production-promotion-stage
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF"

      - name: Dry-run exact Twin production plan
        if: steps.pending.outputs.needs_apply == 'true'
        shell: bash
        run: |
          set -o pipefail
          cd .twin-production-promotion-stage
          supabase db push --linked --dry-run --include-all 2>&1 | tee ../.twin-production-promotion/db-push-preflight.txt

      - name: Assert dry-run contains exactly the two certified Twin migrations
        if: steps.pending.outputs.needs_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/worker-engine-assert-dry-run-plan.py \
            --expected .twin-production-promotion/expected-versions.txt \
            --dry-run-output .twin-production-promotion/db-push-preflight.txt \
            --report .twin-production-promotion/preflight-assertion.txt
          grep -F 'status=PASSED' .twin-production-promotion/preflight-assertion.txt

      - name: Apply exact certified Twin migrations
        if: steps.pending.outputs.needs_apply == 'true'
        shell: bash
        run: |
          set -o pipefail
          cd .twin-production-promotion-stage
          supabase db push --linked --include-all 2>&1 | tee ../.twin-production-promotion/db-push-apply.txt

      - name: Capture remote ledger after apply
        shell: bash
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 | tee .twin-production-promotion/migration-list-after.txt

      - name: Verify exact Twin ledger transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          def versions(path):
              result = set()
              text = Path(path).read_text(encoding='utf-8', errors='replace')
              for line in text.splitlines():
                  cols = [c.strip().strip('`') for c in line.split('|')]
                  if len(cols) >= 2 and re.fullmatch(r'\d{8,14}', cols[1]):
                      result.add(cols[1])
              return result

          before = versions('.twin-production-promotion/migration-list-before.txt')
          after = versions('.twin-production-promotion/migration-list-after.txt')
          expected = set(os.environ['EXPECTED_PENDING_VERSIONS'].split())
          if not expected.issubset(after):
              raise SystemExit(f'Twin migrations are not both recorded remotely: missing={sorted(expected-after)}')
          expected_after = before | expected
          if after != expected_after:
              raise SystemExit(f'unexpected ledger transition added={sorted(after-expected_after)} removed={sorted(expected_after-after)}')
          Path('.twin-production-promotion/post-apply-ledger-assertion.txt').write_text(
              f'versions={" ".join(sorted(expected))}\nstatus=PASSED\nremote_before={len(before)}\nremote_after={len(after)}\n',
              encoding='utf-8',
          )
          print(Path('.twin-production-promotion/post-apply-ledger-assertion.txt').read_text())
          PY

      - name: Upload immutable Twin promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-production-promotion-${{ github.run_id }}
          path: .twin-production-promotion/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
