name: Auth & Onboarding Hardening

on:
  pull_request:
    paths:
      - 'app/auth/**'
      - 'app/login/**'
      - 'app/signup/**'
      - 'app/global/signup/**'
      - 'lib/auth-routing.ts'
      - 'middleware.ts'
      - 'public/sw.js'
      - 'supabase/migrations/**'
      - 'scripts/test-auth-onboarding-contract.mjs'
      - 'scripts/test-auth-task1-state-machine.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/actions/production-build-contract/**'
      - '.github/workflows/auth-onboarding-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Auth authority + canonical production build certification
        uses: ./.github/actions/production-build-contract
        with:
          prebuild_command: |
            node scripts/test-auth-onboarding-contract.mjs
            node scripts/test-auth-task1-state-machine.mjs
            npm run typecheck
            npm run lint
          supabase_url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase_anon_key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
