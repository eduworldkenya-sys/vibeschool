name: Auth & Onboarding Hardening

on:
  pull_request:
    paths:
      - 'app/auth/**'
      - 'app/login/**'
      - 'app/signup/**'
      - 'app/global/signup/**'
      - 'lib/auth-routing.ts'
      - 'middleware.ts'
      - 'public/sw.js'
      - 'supabase/migrations/**'
      - 'scripts/test-auth-onboarding-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-onboarding-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auth authority contract
        run: node scripts/test-auth-onboarding-contract.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
