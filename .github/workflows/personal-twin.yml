name: Canonical Personal Twin
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/twin/**"
      - "lib/teacher/examResultAuthority.ts"
      - "lib/class-workbook/**"
      - "components/**/TwinDrawer.tsx"
      - "components/student/VibeTwin/**"
      - "components/twin/**"
      - "app/teacher/results/**"
      - "supabase/migrations/*personal_twin*"
      - "scripts/test-personal-twin*"
      - ".github/workflows/personal-twin.yml"
permissions:
  contents: read
jobs:
  twin:
    name: Twin authority, SQL and confirmation interactions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/production-build-contract
        with:
          build_application: "false"
          prebuild_command: npm run test:twin
      - name: Install isolated database and DOM runtimes
        run: npm install --prefix "$RUNNER_TEMP/twin-runtime" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8 jsdom@26.1.0 esbuild@0.28.2 @testing-library/dom@10.4.2
      - name: Exercise migration authorization and atomic saves
        run: PGLITE_MODULE="$RUNNER_TEMP/twin-runtime/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-personal-twin-db.mjs
      - name: Exercise confirmation expiry and context changes
        run: WORKBOOK_UI_MODULES="$RUNNER_TEMP/twin-runtime/node_modules" node scripts/test-personal-twin-ui.mjs
