name: HQ Control Room Certification

on:
  pull_request:
    paths:
      - 'app/hq/**'
      - 'components/hq/**'
      - 'lib/hq/**'
      - 'scripts/test-hq-control-room-ui.mjs'
      - '.github/workflows/hq-control-room-certification.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: HQ UI truth contract
        run: node scripts/test-hq-control-room-ui.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Worker Engine governed adversarial proof
        run: node --test lib/hq/workforce/governed-runtime.test.ts
      - name: Proof escape-hatch audit
        run: |
          if grep -nE 'as[[:space:]]+(any|unknown)|@ts-ignore|@ts-nocheck|eslint-disable|\.skip\(' lib/hq/workforce/governed-runtime.test.ts; then
            echo 'Certification proof contains a forbidden type/test escape hatch.' >&2
            exit 1
          fi
      - name: Lint
        run: npm run lint
