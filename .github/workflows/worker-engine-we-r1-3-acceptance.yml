name: Worker Engine WE-R1.3 Acceptance Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/20260814143000_worker_engine_we_r1_3_shadow_governance_kernel.sql"
      - "supabase/tests/worker_engine_we_r1_3_shadow_governance_kernel.sql"
      - ".github/workflows/worker-engine-we-r1-3-acceptance.yml"
      - "docs/WORKER_ENGINE_WE_R1_3_GOVERNED_SHADOW_OPERATIONS.md"

concurrency:
  group: worker-engine-we-r1-3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: WE-R1.3 disposable-local acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify shadow-only safety inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260814143000_worker_engine_we_r1_3_shadow_governance_kernel.sql
          test -f supabase/tests/worker_engine_we_r1_3_shadow_governance_kernel.sql
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/worker-engine-we-r1-3-acceptance.yml').read_text()
          migration = Path('supabase/migrations/20260814143000_worker_engine_we_r1_3_shadow_governance_kernel.sql').read_text()
          forbidden_workflow = ['SUPABASE_'+'ACCESS_TOKEN','SUPABASE_'+'DB_PASSWORD','PROD_'+'URL','production'+'-migration-repair','${{ '+'secrets.']
          found = [x for x in forbidden_workflow if x in workflow]
          if found:
              raise SystemExit('production credential/reference detected: '+', '.join(found))
          required_off = ['runtime_execution_enabled=false','runtime_autonomy_level=0','runtime_max_risk=0','heartbeat_enabled=false','factory_enabled=false','shadow_enabled=false','shadow_scheduler_enabled=false','shadow_global_stop=true']
          compact = migration.replace(' ', '').replace('\n','')
          missing = [x for x in required_off if x.replace(' ','') not in compact]
          if missing:
              raise SystemExit('fail-closed assignments missing: '+', '.join(missing))
          forbidden_calls = ['perform public.hq_workforce_tool_gateway_execute','select public.hq_workforce_tool_gateway_execute','perform public.hq_workforce_execute_task_queue','select public.hq_workforce_execute_task_queue']
          if any(x in migration.lower() for x in forbidden_calls):
              raise SystemExit('shadow migration contains consequential gateway invocation')
          PY

      - name: Verify Docker
        run: docker info >/dev/null

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Disable seed for schema-only proof
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql /tmp/vibeschool-seed.sql.disabled; fi

      - name: Start disposable local Supabase
        shell: bash
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Rebuild complete migration chain
        shell: bash
        run: supabase db reset --local --no-seed

      - name: Run WE-R1.3 adversarial acceptance suite
        shell: bash
        run: |
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3_shadow_governance_kernel.sql

      - name: Re-assert post-test fail-closed state
        shell: bash
        run: |
          STATE="$(PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -Atqc "select heartbeat_enabled::text||'|'||factory_enabled::text||'|'||runtime_execution_enabled::text||'|'||runtime_autonomy_level::text||'|'||runtime_max_risk::text||'|'||shadow_enabled::text||'|'||shadow_scheduler_enabled::text||'|'||shadow_global_stop::text from public.hq_workforce_engine_contract where singleton=true")"
          test "$STATE" = "false|false|false|0|0|false|false|true"

      - name: Destroy disposable database
        if: always()
        run: supabase stop --no-backup >/dev/null 2>&1 || true
