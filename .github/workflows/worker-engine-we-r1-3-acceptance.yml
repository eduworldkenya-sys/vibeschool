name: Worker Engine WE-R1.3 / R1.3X Acceptance Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/*worker_engine_we_r1_3*.sql"
      - "supabase/tests/worker_engine_we_r1_3*.sql"
      - ".github/workflows/worker-engine-we-r1-3-acceptance.yml"
      - "docs/WORKER_ENGINE_WE_R1_3_GOVERNED_SHADOW_OPERATIONS.md"
      - "docs/worker-engine/WE-R1.3X-GLOBAL-CAPABILITY-INTELLIGENCE-FABRIC.md"
      - "docs/worker-engine/WE-R1.3X-LEGACY-RECONCILIATION.md"
      - "app/hq/workforce/**"
      - "components/hq/HQShell.tsx"

concurrency:
  group: worker-engine-we-r1-3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: WE-R1.3/R1.3X disposable-local acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify no production credentials or activation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/worker-engine-we-r1-3-acceptance.yml').read_text()
          paths=sorted(Path('supabase/migrations').glob('*worker_engine_we_r1_3*.sql'))
          if not paths: raise SystemExit('WE-R1.3/R1.3X migrations not found')
          migrations='\n'.join(p.read_text() for p in paths)
          secrets_expr='$'+'{{'+' secrets.'
          forbidden=['SUPABASE_'+'ACCESS_TOKEN','SUPABASE_'+'DB_PASSWORD','PROD_'+'URL','production'+'-migration-repair',secrets_expr]
          hit=[x for x in forbidden if x in workflow]
          if hit: raise SystemExit('production reference detected: '+', '.join(hit))
          compact=migrations.replace(' ','').replace('\n','').lower()
          required=['heartbeat_enabled=false','factory_enabled=false','runtime_execution_enabled=false','runtime_autonomy_level=0','runtime_max_risk=0','shadow_enabled=false','shadow_scheduler_enabled=false','shadow_global_stop=true']
          missing=[x for x in required if x not in compact]
          if missing: raise SystemExit('fail-closed assignments missing: '+', '.join(missing))
          if 'hq_workforce_tool_gateway_execute(' in migrations.lower():
              raise SystemExit('shadow migrations reference consequential gateway invocation')
          if 'cron.schedule' in migrations.lower():
              raise SystemExit('WE-R1.3/R1.3X must not install scheduler cron')
          PY

      - name: Verify Docker
        run: docker info >/dev/null

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Disable seed for schema-only proof
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql /tmp/vibeschool-seed.sql.disabled; fi

      - name: Start disposable local Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Rebuild full migration chain
        run: supabase db reset --local --no-seed

      - name: Run WE-R1.3 adversarial acceptance suite
        shell: bash
        run: |
          set +e
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3_shadow_governance_kernel.sql 2>&1 | tee /tmp/we-r1-3-adversarial.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Run WE-R1.3X capability-fabric acceptance suite
        shell: bash
        run: |
          set +e
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3x_capability_fabric.sql 2>&1 | tee /tmp/we-r1-3x-capability.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Run WE-R1.3X X3 capability-contract hardening suite
        shell: bash
        run: |
          set +e
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3x_capability_contract_hardening.sql 2>&1 | tee /tmp/we-r1-3x-capability-contract.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Run WE-R1.3X objective-semantics acceptance suite
        shell: bash
        run: |
          set +e
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3x_objective_semantics.sql 2>&1 | tee /tmp/we-r1-3x-objective.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Run WE-R1.3X true-Shadow-capability bootstrap suite
        shell: bash
        run: |
          set +e
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3x_shadow_capability_bootstrap.sql 2>&1 | tee /tmp/we-r1-3x-bootstrap.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Run WE-R1.3X planning-quality acceptance suite
        shell: bash
        run: |
          set +e
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3x_planning_quality.sql 2>&1 | tee /tmp/we-r1-3x-planning-quality.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Run WE-R1.3X legacy-reconciliation acceptance suite
        shell: bash
        run: |
          set +e
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3x_legacy_reconciliation.sql 2>&1 | tee /tmp/we-r1-3x-reconciliation.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Run WE-R1.3X adversarial capability certification
        shell: bash
        run: |
          set +e
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3x_adversarial.sql 2>&1 | tee /tmp/we-r1-3x-adversarial.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Run WE-R1.3X measurement certification
        shell: bash
        run: |
          set +e
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/worker_engine_we_r1_3x_measurement.sql 2>&1 | tee /tmp/we-r1-3x-measurement.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: we-r1-3x-acceptance-${{ github.run_id }}
          path: |
            /tmp/we-r1-3-adversarial.log
            /tmp/we-r1-3x-capability.log
            /tmp/we-r1-3x-capability-contract.log
            /tmp/we-r1-3x-objective.log
            /tmp/we-r1-3x-bootstrap.log
            /tmp/we-r1-3x-planning-quality.log
            /tmp/we-r1-3x-reconciliation.log
            /tmp/we-r1-3x-adversarial.log
            /tmp/we-r1-3x-measurement.log
          if-no-files-found: warn
          retention-days: 30

      - name: Reassert fail-closed state
        if: always()
        shell: bash
        run: |
          STATE="$(PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -Atqc "select heartbeat_enabled::text||'|'||factory_enabled::text||'|'||runtime_execution_enabled::text||'|'||runtime_autonomy_level::text||'|'||runtime_max_risk::text||'|'||shadow_enabled::text||'|'||shadow_scheduler_enabled::text||'|'||shadow_global_stop::text||'|'||shadow_anomaly_paused::text from public.hq_workforce_engine_contract where singleton=true")"
          test "$STATE" = "false|false|false|0|0|false|false|true|false"

      - name: Destroy disposable database
        if: always()
        run: supabase stop --no-backup >/dev/null 2>&1 || true
