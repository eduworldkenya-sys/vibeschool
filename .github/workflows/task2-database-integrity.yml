name: Task 2 Database Reconstruction Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "scripts/sql/task2_database_integrity_verify.sql"
      - "scripts/sql/task2_database_failure_injection.sql"
      - "scripts/task2_extract_application_db_contracts.py"
      - "lib/database.types.ts"
      - "lib/supabase.ts"
      - ".github/workflows/task2-database-integrity.yml"

concurrency:
  group: task2-database-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reconstruct:
    name: Zero-to-current database reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Inventory and validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .task2-artifacts
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json, re

          files = sorted(Path('supabase/migrations').glob('*.sql'))
          versions = defaultdict(list)
          bad = []
          for path in files:
              m = re.match(r'^(\d+)_', path.name)
              if not m:
                  bad.append(path.name)
                  continue
              versions[m.group(1)].append(path.name)
          duplicates = {v:n for v,n in versions.items() if len(n) > 1}
          report = {
              'migration_count': len(files),
              'first': files[0].name if files else None,
              'last': files[-1].name if files else None,
              'invalid_filenames': bad,
              'duplicate_versions': duplicates,
          }
          Path('.task2-artifacts/repository-migration-inventory.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if bad:
              raise SystemExit(f'invalid migration filenames: {bad}')
          if duplicates:
              raise SystemExit(f'duplicate migration versions: {duplicates}')
          PY

      - name: Verify Docker
        run: docker info > .task2-artifacts/docker-info.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Disable seed for schema-only reconstruction
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then
            mv supabase/seed.sql .task2-artifacts/seed.sql.disabled
          fi

      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor \
            2>&1 | tee .task2-artifacts/supabase-start.log

      - name: Rebuild from zero
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local --no-seed \
            2>&1 | tee .task2-artifacts/db-reset.log

      - name: Verify repository and local migration ledgers agree
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          ACTUAL="$(PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -Atqc 'select count(*) from supabase_migrations.schema_migrations')"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED" "$ACTUAL" | tee .task2-artifacts/ledger-count.txt
          test "$ACTUAL" = "$EXPECTED"
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -P pager=off -c \
            'select version,name from supabase_migrations.schema_migrations order by version' \
            > .task2-artifacts/local-migration-ledger.txt

      # Capture application truth and generated schema truth immediately after the
      # deterministic rebuild. The full application inventory is drift evidence;
      # only the explicitly owned Task 2 foundation subset is a release blocker.
      - name: Inventory literal application database contracts
        shell: bash
        run: python3 scripts/task2_extract_application_db_contracts.py

      - name: Generate TypeScript database contract from clean reconstruction
        shell: bash
        run: |
          set -euo pipefail
          supabase gen types typescript --local > .task2-artifacts/database.types.generated.ts
          test -s .task2-artifacts/database.types.generated.ts

      - name: Verify Task 2 owned relations and RPCs reconstruct
        id: owned_contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DB='postgresql://postgres@127.0.0.1:54322/postgres'
          missing_relations=.task2-artifacts/application-contracts/task2-missing-relations.txt
          missing_rpcs=.task2-artifacts/application-contracts/task2-missing-rpcs.txt
          : > "$missing_relations"
          : > "$missing_rpcs"
          while IFS= read -r relation; do
            [ -n "$relation" ] || continue
            exists="$(PGPASSWORD=postgres psql "$DB" -Atqc "select to_regclass('public.${relation}') is not null")"
            if [ "$exists" != "t" ]; then
              echo "$relation" | tee -a "$missing_relations" >&2
            fi
          done < .task2-artifacts/application-contracts/task2-required-relations.txt
          while IFS= read -r rpc; do
            [ -n "$rpc" ] || continue
            exists="$(PGPASSWORD=postgres psql "$DB" -Atqc "select exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='${rpc}')")"
            if [ "$exists" != "t" ]; then
              echo "$rpc" | tee -a "$missing_rpcs" >&2
            fi
          done < .task2-artifacts/application-contracts/task2-required-rpcs.txt
          relation_count="$(wc -l < "$missing_relations" | tr -d ' ')"
          rpc_count="$(wc -l < "$missing_rpcs" | tr -d ' ')"
          printf 'task2_missing_relations=%s\ntask2_missing_rpcs=%s\n' "$relation_count" "$rpc_count" \
            | tee .task2-artifacts/application-contracts/task2-missing-summary.txt
          test "$relation_count" -eq 0
          test "$rpc_count" -eq 0

      - name: Classify full application drift against reconstruction
        shell: bash
        run: |
          set -euo pipefail
          DB='postgresql://postgres@127.0.0.1:54322/postgres'
          missing_relations=.task2-artifacts/application-contracts/all-app-missing-relations.txt
          missing_rpcs=.task2-artifacts/application-contracts/all-app-missing-rpcs.txt
          : > "$missing_relations"
          : > "$missing_rpcs"
          while IFS= read -r relation; do
            [ -n "$relation" ] || continue
            exists="$(PGPASSWORD=postgres psql "$DB" -Atqc "select to_regclass('public.${relation}') is not null")"
            if [ "$exists" != "t" ]; then
              echo "$relation" >> "$missing_relations"
            fi
          done < .task2-artifacts/application-contracts/relations.txt
          while IFS= read -r rpc; do
            [ -n "$rpc" ] || continue
            exists="$(PGPASSWORD=postgres psql "$DB" -Atqc "select exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='${rpc}')")"
            if [ "$exists" != "t" ]; then
              echo "$rpc" >> "$missing_rpcs"
            fi
          done < .task2-artifacts/application-contracts/rpcs.txt
          relation_count="$(wc -l < "$missing_relations" | tr -d ' ')"
          rpc_count="$(wc -l < "$missing_rpcs" | tr -d ' ')"
          printf 'all_app_missing_relations=%s\nall_app_missing_rpcs=%s\nclassification=DRIFT_REQUIRES_OWNER_RECONCILIATION\n' \
            "$relation_count" "$rpc_count" \
            | tee .task2-artifacts/application-contracts/all-app-drift-summary.txt
          if [ "$relation_count" -gt 0 ] || [ "$rpc_count" -gt 0 ]; then
            echo "Full-app drift is retained as evidence; only Task-2-owned contracts block this gate."
          fi

      - name: Run local failure injection
        id: failure_injection
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' \
            -f scripts/sql/task2_database_failure_injection.sql \
            2>&1 | tee .task2-artifacts/failure-injection.log

      - name: Verify broad reconstructed database contract
        id: broad_contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' \
            -f scripts/sql/task2_database_integrity_verify.sql \
            2>&1 | tee .task2-artifacts/database-contract.log

      - name: Verify rerunnable read-only certification
        id: broad_contract_rerun
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' \
            -f scripts/sql/task2_database_integrity_verify.sql \
            2>&1 | tee .task2-artifacts/database-contract-rerun.log

      - name: Capture schema/security evidence
        if: always()
        shell: bash
        run: |
          set -u
          DB='postgresql://postgres@127.0.0.1:54322/postgres'
          if PGPASSWORD=postgres psql "$DB" -Atqc 'select 1' >/dev/null 2>&1; then
            PGPASSWORD=postgres psql "$DB" -AtF $'\t' -c \
              "select c.relname,c.relrowsecurity,c.relforcerowsecurity from pg_class c where c.relnamespace='public'::regnamespace and c.relkind in ('r','p') order by c.relname" \
              > .task2-artifacts/public-table-rls.tsv
            PGPASSWORD=postgres psql "$DB" -AtF $'\t' -c \
              "select schemaname,tablename,policyname,roles,cmd,coalesce(qual,''),coalesce(with_check,'') from pg_policies where schemaname='public' order by tablename,policyname" \
              > .task2-artifacts/public-policies.tsv
            PGPASSWORD=postgres psql "$DB" -AtF $'\t' -c \
              "select n.nspname,p.proname,pg_get_function_identity_arguments(p.oid),p.prosecdef,coalesce(array_to_string(p.proconfig,','),'') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' order by p.proname,pg_get_function_identity_arguments(p.oid)" \
              > .task2-artifacts/public-functions.tsv
            PGPASSWORD=postgres psql "$DB" -AtF $'\t' -c \
              "select table_name,column_name,udt_name,is_nullable,coalesce(column_default,'') from information_schema.columns where table_schema='public' order by table_name,ordinal_position" \
              > .task2-artifacts/public-columns.tsv
            PGPASSWORD=postgres psql "$DB" -AtF $'\t' -c \
              "select conrelid::regclass::text,conname,contype,pg_get_constraintdef(oid,true),convalidated from pg_constraint where connamespace='public'::regnamespace order by conrelid::regclass::text,conname" \
              > .task2-artifacts/public-constraints.tsv
            PGPASSWORD=postgres psql "$DB" -AtF $'\t' -c \
              "select schemaname,tablename,indexname,indexdef from pg_indexes where schemaname='public' order by tablename,indexname" \
              > .task2-artifacts/public-indexes.tsv
            PGPASSWORD=postgres psql "$DB" -AtF $'\t' -c \
              "select event_object_table,trigger_name,event_manipulation,action_timing,action_statement from information_schema.triggers where trigger_schema='public' order by event_object_table,trigger_name,event_manipulation" \
              > .task2-artifacts/public-triggers.tsv
          else
            printf 'database unavailable during always() evidence capture\n' > .task2-artifacts/schema-evidence-unavailable.txt
          fi
          rm -f .task2-artifacts/evidence.sha256
          find .task2-artifacts -type f ! -name 'evidence.sha256' -print0 \
            | sort -z | xargs -0 sha256sum > .task2-artifacts/evidence.sha256

      - name: Enforce all Task 2 reconstruction contracts
        if: always()
        shell: bash
        env:
          OWNED_CONTRACT_OUTCOME: ${{ steps.owned_contract.outcome }}
          FAILURE_INJECTION_OUTCOME: ${{ steps.failure_injection.outcome }}
          BROAD_CONTRACT_OUTCOME: ${{ steps.broad_contract.outcome }}
          BROAD_CONTRACT_RERUN_OUTCOME: ${{ steps.broad_contract_rerun.outcome }}
        run: |
          set -euo pipefail
          printf 'task2_owned_contract=%s\nfailure_injection=%s\nbroad_contract=%s\nbroad_contract_rerun=%s\n' \
            "$OWNED_CONTRACT_OUTCOME" "$FAILURE_INJECTION_OUTCOME" \
            "$BROAD_CONTRACT_OUTCOME" "$BROAD_CONTRACT_RERUN_OUTCOME" \
            | tee .task2-artifacts/final-gate-outcomes.txt
          test "$OWNED_CONTRACT_OUTCOME" = success
          test "$FAILURE_INJECTION_OUTCOME" = success
          test "$BROAD_CONTRACT_OUTCOME" = success
          test "$BROAD_CONTRACT_RERUN_OUTCOME" = success

      - name: Upload reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-database-integrity-${{ github.run_id }}
          path: .task2-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Destroy disposable database
        if: always()
        run: supabase stop --no-backup > /dev/null 2>&1 || true
