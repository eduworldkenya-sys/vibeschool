name: Temporary Lesson Delivery Revision Hardening

on:
  push:
    branches:
      - lesson-plan-delivery-state-hardening

permissions:
  contents: write

jobs:
  patch-revision:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lesson-plan-delivery-state-hardening
          fetch-depth: 0

      - name: Apply revision integrity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_s, old, new, label):
              path = Path(path_s)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1))

          patch(
            'supabase/migrations/20260903233000_lesson_plan_delivery_state_hardening.sql',
            """  if tg_op = 'UPDATE'
               and new.status = 'draft'
               and old.status is distinct from 'draft' then
              raise exception 'lesson_plan_delivery_cannot_return_to_draft';
            end if;
            return new;""",
            """  if tg_op = 'UPDATE'
               and new.status = 'draft'
               and old.status is distinct from 'draft' then
              -- A delivered plan may only become draft as part of a real content
              -- revision. A status-only rollback would erase operational truth.
              if new.body is not distinct from old.body
                 and new.title is not distinct from old.title
                 and new.topic is not distinct from old.topic then
                raise exception 'lesson_plan_delivery_status_only_draft_rollback_denied';
              end if;

              -- The revised content has not been delivered through either channel.
              -- Clear prior channel evidence so republish/re-share is explicit.
              new.parent_shared_at := null;
              new.student_recipient_count := 0;
              new.parent_recipient_count := 0;
            end if;
            return new;""",
            'transition guard',
          )

          patch(
            'lib/teaching/lessonRepository.ts',
            ".update({ body, title, updated_at: new Date().toISOString() })",
            ".update({ body, title, status: 'draft', updated_at: new Date().toISOString() })",
            'edited plan reopens draft',
          )

          patch(
            'components/teacher/LessonPlanModal.tsx',
            """      setSections(draft)
                  setPhase('view')
                  showToast('Plan saved')""",
            """      setSections(draft)
                  setStatus('draft')
                  setPhase('view')
                  showToast('Plan saved · publish/share again after review')""",
            'modal revision state',
          )

          test = Path('scripts/test-lesson-delivery-state-hardening.py')
          text = test.read_text()
          anchor = "    require('lesson_plan_guard_delivery_transition' in MIGRATION, 'delivered plans cannot silently revert to draft')\n"
          addition = anchor + "    require('lesson_plan_delivery_status_only_draft_rollback_denied' in MIGRATION, 'status-only rollback is denied')\n    require('new.body is not distinct from old.body' in MIGRATION, 'real content revision is distinguished from status rollback')\n    require('new.parent_shared_at := null' in MIGRATION, 'revision clears stale parent delivery evidence')\n"
          if text.count(anchor) != 1:
              raise SystemExit('test anchor mismatch')
          test.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Commit revision hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/teacher/LessonPlanModal.tsx lib/teaching/lessonRepository.ts scripts/test-lesson-delivery-state-hardening.py supabase/migrations/20260903233000_lesson_plan_delivery_state_hardening.sql
          git diff --cached --quiet && exit 1
          git commit -m 'fix: make lesson revisions invalidate delivery evidence'
          git push origin HEAD:lesson-plan-delivery-state-hardening
