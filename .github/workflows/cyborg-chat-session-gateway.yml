name: Cyborg Chat Session Gateway
on:
  pull_request:
  workflow_dispatch:
jobs:
  chat-session-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-cyborg-chat-session-gateway.mjs
