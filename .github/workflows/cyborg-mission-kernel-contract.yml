name: Cyborg Mission Kernel Contract
on:
  pull_request:
    paths:
      - 'lib/cyborg/**'
      - 'docs/CYBORG_OPERATING_CONSTITUTION.md'
      - 'scripts/validate-cyborg-mission-kernel.mjs'
      - 'scripts/cyborg-adversarial-proof.mjs'
      - 'supabase/migrations/20260822205500_cyborg_mission_kernel.sql'
      - '.github/workflows/cyborg-mission-kernel-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate-cyborg-mission-kernel.mjs
      - run: node scripts/cyborg-adversarial-proof.mjs
      - run: python scripts/validate-supabase-migration-contract.py --changed-from origin/main
