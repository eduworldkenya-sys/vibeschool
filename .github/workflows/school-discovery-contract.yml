name: School discovery contract

on:
  push:
    paths:
      - 'app/teacher/onboarding/school/**'
      - 'supabase/migrations/*school_*.sql'
      - 'scripts/test-school-discovery-contract.py'
      - 'scripts/prepare-authoritative-school-snapshot.py'
      - 'scripts/test-prepare-authoritative-school-snapshot.py'
      - 'scripts/test-authoritative-school-runtime-contract.py'
      - 'scripts/test-school-coverage-control-plane.py'
      - 'scripts/test-school-live-authoritative-adapter.py'
      - 'scripts/test-school-search-helper-privilege-contract.py'
      - 'scripts/test-school-alias-prerequisite-contract.py'
      - 'scripts/test-school-coverage-runtime-contract.py'
  pull_request:
    paths:
      - 'app/teacher/onboarding/school/**'
      - 'supabase/migrations/*school_*.sql'
      - 'scripts/test-school-discovery-contract.py'
      - 'scripts/prepare-authoritative-school-snapshot.py'
      - 'scripts/test-prepare-authoritative-school-snapshot.py'
      - 'scripts/test-authoritative-school-runtime-contract.py'
      - 'scripts/test-school-coverage-control-plane.py'
      - 'scripts/test-school-live-authoritative-adapter.py'
      - 'scripts/test-school-search-helper-privilege-contract.py'
      - 'scripts/test-school-alias-prerequisite-contract.py'
      - 'scripts/test-school-coverage-runtime-contract.py'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/test-school-discovery-contract.py
      - run: python scripts/test-prepare-authoritative-school-snapshot.py
      - run: python scripts/test-authoritative-school-runtime-contract.py
      - run: python scripts/test-school-coverage-control-plane.py
      - run: python scripts/test-school-live-authoritative-adapter.py
      - run: python scripts/test-school-search-helper-privilege-contract.py
      - run: python scripts/test-school-alias-prerequisite-contract.py
      - run: python scripts/test-school-coverage-runtime-contract.py
