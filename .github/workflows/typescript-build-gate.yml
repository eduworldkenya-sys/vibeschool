name: TypeScript and Production Build Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: typescript-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Full Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify asset-only pull request
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "asset_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          asset_only=true
          for file in "${files[@]}"; do
            case "$file" in
              *.jpg|*.jpeg|*.png|*.webp|*.gif|*.svg|*.avif|*.ico|*.md|*.mdx|*.txt)
                ;;
              *)
                asset_only=false
                break
                ;;
            esac
          done
          echo "asset_only=$asset_only" >> "$GITHUB_OUTPUT"
          printf 'Changed files:\n%s\n' "${files[*]}"

      - name: Validate asset-only candidate
        if: github.event_name == 'pull_request' && steps.scope.outputs.asset_only == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          base=os.environ['BASE_SHA']; head=os.environ['HEAD_SHA']
          files=subprocess.check_output(['git','diff','--name-only',f'{base}...{head}'], text=True).splitlines()
          max_bytes=10*1024*1024
          image_ext={'.jpg','.jpeg','.png','.webp','.gif','.svg','.avif','.ico'}
          for path in files:
              ext=os.path.splitext(path)[1].lower()
              if ext in image_ext and os.path.exists(path) and os.path.getsize(path)>max_bytes:
                  raise SystemExit(f'Asset exceeds 10 MB repository limit: {path}')
          print(f'Asset-only PR certified: {len(files)} file(s); full application build not required.')
          PY

      - name: Repository truth + canonical production build certification
        if: github.event_name != 'pull_request' || steps.scope.outputs.asset_only != 'true'
        uses: ./.github/actions/production-build-contract
        with:
          prebuild_command: |
            node scripts/test-strategic-remediation-contract.mjs
            npm run typecheck
            npm run lint
          supabase_url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase_anon_key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
