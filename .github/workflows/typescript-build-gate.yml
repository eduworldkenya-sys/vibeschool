name: TypeScript and Production Build Gate

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'ops/**'
      - 'hq/**'
      - 'content/**'
      - 'audit/**'
      - 'twin/**'
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: typescript-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair-auth-password-contract:
    if: github.ref == 'refs/heads/fix/auth-password-contract-20260814' && github.actor != 'github-actions[bot]'
    name: Repair auth password contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/auth-password-contract-20260814
          fetch-depth: 0

      - name: Apply exact repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text()

          old = """const AUTH_ERRORS: Record<string, string> = {
  'Invalid login credentials': 'Incorrect email or password.',
  'Email not confirmed':       'Please confirm your email first.',
  'User not found':            'No account found with that email.',
  'Too many requests':         'Too many attempts. Wait and try again.',
}

function friendlyError(msg: string): string {
  if (typeof navigator !== 'undefined' && !navigator.onLine)
    return 'No internet connection.'
  for (const [k, v] of Object.entries(AUTH_ERRORS))
    if (msg.includes(k)) return v
  return 'Something went wrong. Please try again.'
}
"""
          new = """const AUTH_ERRORS: Record<string, string> = {
  'Invalid login credentials': 'Incorrect email or password.',
  'Email not confirmed':       'Please confirm your email first.',
  'User not found':            'No account found with that email.',
  'Too many requests':         'Too many attempts. Wait and try again.',
  'Password should contain':   'Password must include uppercase and lowercase letters, a number and a special character.',
  'weak_password':             'Password must include uppercase and lowercase letters, a number and a special character.',
}

function validatePassword(value: string): string | null {
  if (value.length < 8) return 'Password must be at least 8 characters.'
  if (!/[a-z]/.test(value)) return 'Password must include a lowercase letter.'
  if (!/[A-Z]/.test(value)) return 'Password must include an uppercase letter.'
  if (!/[0-9]/.test(value)) return 'Password must include a number.'
  if (!/[^A-Za-z0-9]/.test(value)) return 'Password must include a special character.'
  return null
}

function friendlyError(msg: string): string {
  if (typeof navigator !== 'undefined' && !navigator.onLine)
    return 'No internet connection.'
  for (const [k, v] of Object.entries(AUTH_ERRORS))
    if (msg.includes(k)) return v
  return 'Something went wrong. Please try again.'
}
"""
          if old not in text:
              raise SystemExit('AUTH_ERRORS/friendlyError anchor not found')
          text = text.replace(old, new, 1)

          old = """      if (!email.trim())    { setError('Email is required.'); return }
      if (!password)        { setError('Password is required.'); return }
      if (password.length < 8) { setError('Password must be at least 8 characters.'); return }
      if (role !== 'Admin' && password !== confirmPassword) { setError('Passwords do not match.'); return }
"""
          new = """      if (!email.trim())    { setError('Email is required.'); return }
      if (!password)        { setError('Password is required.'); return }
      const passwordError = validatePassword(password)
      if (passwordError) { setError(passwordError); return }
      if (role !== 'Admin' && password !== confirmPassword) { setError('Passwords do not match.'); return }
"""
          if old not in text:
              raise SystemExit('signup password validation anchor not found')
          text = text.replace(old, new, 1)

          old = """                        type={showPw ? 'text' : 'password'} autoComplete=\"new-password\" placeholder=\"Min 8 characters\"
                        value={password} onChange={e => setPassword(e.target.value)} disabled={isBusy} />
                      <button style={S.eyeBtn} type=\"button\" onClick={() => setShowPw(v => !v)}>{showPw ? '🙈' : '👁'}</button>
                    </div>
                    <label style={{ ...S.fieldLabel, marginTop: 14 }}>Confirm Password</label>
"""
          new = """                        type={showPw ? 'text' : 'password'} autoComplete=\"new-password\" placeholder=\"8+ chars, upper/lower, number & symbol\"
                        value={password} onChange={e => setPassword(e.target.value)} disabled={isBusy} />
                      <button style={S.eyeBtn} type=\"button\" onClick={() => setShowPw(v => !v)}>{showPw ? '🙈' : '👁'}</button>
                    </div>
                    <p style={{ fontSize: 10, color: 'rgba(255,255,255,0.32)', marginTop: -8, marginBottom: 14, lineHeight: 1.5 }}>
                      Use 8+ characters with uppercase, lowercase, a number and a special character.
                    </p>
                    <label style={{ ...S.fieldLabel, marginTop: 14 }}>Confirm Password</label>
"""
          if old not in text:
              raise SystemExit('signup password field anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Restore workflow and verify repair
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/typescript-build-gate.yml
          rm -f .github/workflows/tmp-auth-password-fix.yml
          grep -q "function validatePassword" app/page.tsx
          grep -q "Password should contain" app/page.tsx
          grep -q "8+ characters with uppercase" app/page.tsx
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/typescript-build-gate.yml
          git add -u .github/workflows
          git commit -m "fix(auth): align signup password contract with Supabase"
          git push origin HEAD:fix/auth-password-contract-20260814

  validate:
    name: Full Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Strategic remediation truth contract
        run: node scripts/test-strategic-remediation-contract.mjs

      - name: TypeScript — report all errors
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Next.js production build
        run: npm run build
