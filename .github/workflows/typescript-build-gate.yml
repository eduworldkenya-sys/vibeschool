name: TypeScript and Production Build Gate

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'ops/**'
      - 'hq/**'
      - 'content/**'
      - 'audit/**'
      - 'twin/**'
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: typescript-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Full Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Strategic remediation truth contract
        run: node scripts/test-strategic-remediation-contract.mjs

      - name: TypeScript — report all errors
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Next.js production build
        run: npm run build
