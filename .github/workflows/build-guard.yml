name: VibeSchool Build Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Check use client directives
        run: |
          MISSING=$(grep -rL '"use client"' app components hooks --include="*.tsx" --include="*.jsx" 2>/dev/null | \
            xargs grep -l "useState\|useRouter\|useRef\|useSearchParams\|useEffect\|useParams\|useCallback\|useMemo" 2>/dev/null || true)
          if [ -n "$MISSING" ]; then
            echo "❌ Missing use client:"
            echo "$MISSING"
            exit 1
          fi
          echo "✅ use client OK"

      - name: Check no babel config
        run: |
          if [ -f ".babelrc" ] || [ -f "babel.config.js" ]; then
            echo "❌ Babel config found"
            exit 1
          fi
          echo "✅ No babel config"

      - name: Check next.config.js
        run: |
          if grep -q "defaultLoaders.babel" next.config.js 2>/dev/null; then
            echo "❌ defaultLoaders.babel found"
            exit 1
          fi
          echo "✅ next.config.js clean"

      - name: Check no swc-wasm
        run: |
          if grep -q "swc-wasm" package.json; then
            echo "❌ swc-wasm in package.json"
            exit 1
          fi
          echo "✅ No swc-wasm"

      - name: Check no merge conflicts
        run: |
          CONFLICTS=$(grep -rl "<<<<<<\|>>>>>>" app components --include="*.tsx" --include="*.jsx" --include="*.ts" 2>/dev/null || true)
          if [ -n "$CONFLICTS" ]; then
            echo "❌ Merge conflicts:"
            echo "$CONFLICTS"
            exit 1
          fi
          echo "✅ No merge conflicts"

      - name: Check duplicate routes
        run: |
          DUPES=$(find app \( -name "page.tsx" -o -name "page.jsx" \) | \
            sed 's/\/page\..*//' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "❌ Duplicate routes:"
            echo "$DUPES"
            exit 1
          fi
          echo "✅ No duplicate routes"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
