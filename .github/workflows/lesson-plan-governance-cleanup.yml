name: Lesson Plan Governance Cleanup

on:
  push:
    branches:
      - fix/lesson-plan-canonical-prefill
    paths:
      - .github/workflows/lesson-plan-governance-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lesson-plan-canonical-prefill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove legacy cast and preserve narrowing
        shell: python
        run: |
          from pathlib import Path
          path = Path('components/teacher/LessonPlanModal.tsx')
          text = path.read_text()
          old = """    async function loadHomeworkLineage() {\n      const query =\n        supabase\n          .from('homework') as any\n\n      const {\n        data,\n        error: homeworkError,\n      } = await query\n        .select('id')\n        .eq(\n          'teaching_occurrence_id',\n          occurrenceId,\n        )\n        .eq(\n          'lesson_plan_id',\n          lessonPlanId,\n        )\n        .limit(1)"""
          new = """    async function loadHomeworkLineage(\n      resolvedOccurrenceId: string,\n      resolvedLessonPlanId: string,\n    ) {\n      const {\n        data,\n        error: homeworkError,\n      } = await supabase\n        .from('homework')\n        .select('id')\n        .eq(\n          'teaching_occurrence_id',\n          resolvedOccurrenceId,\n        )\n        .eq(\n          'lesson_plan_id',\n          resolvedLessonPlanId,\n        )\n        .limit(1)"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy homework loader, got {text.count(old)}')
          text = text.replace(old, new)
          old_call = """    void loadHomeworkLineage()"""
          new_call = """    void loadHomeworkLineage(\n      occurrenceId,\n      lessonPlanId,\n    )"""
          if text.count(old_call) != 1:
              raise SystemExit(f'Expected one homework loader call, got {text.count(old_call)}')
          path.write_text(text.replace(old_call, new_call))
      - run: npm ci
      - run: npm run typecheck
      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/lesson-plan-governance-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/teacher/LessonPlanModal.tsx .github/workflows/lesson-plan-governance-cleanup.yml
          git commit -m "fix: remove lesson modal type escape hatch"
          git push origin HEAD:fix/lesson-plan-canonical-prefill
