name: Success Wishes Contracts

on:
  pull_request:
    paths:
      - 'app/api/success-wishes/**'
      - 'app/success-wishes/**'
      - 'components/success-wishes/**'
      - 'lib/success-wishes/**'
      - 'docs/success-wishes/schema.sql'
      - '.github/workflows/success-wishes-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/success-wishes/**'
      - 'app/success-wishes/**'
      - 'components/success-wishes/**'
      - 'lib/success-wishes/**'
      - 'docs/success-wishes/schema.sql'
      - '.github/workflows/success-wishes-contracts.yml'

permissions:
  contents: read

jobs:
  success-wishes-contracts:
    name: Success Wishes Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run privacy, submission, and media contract tests
        run: node --import ./scripts/register-typescript.mjs --test lib/success-wishes/*.test.ts
