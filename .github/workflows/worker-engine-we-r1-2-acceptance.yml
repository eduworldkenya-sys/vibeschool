name: Worker Engine WE-R1.2 Acceptance Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/20260814094000_worker_engine_we_r1_2_runtime_policy_kernel.sql"
      - "supabase/tests/worker_engine_we_r1_2_runtime_policy_kernel.sql"
      - ".github/workflows/worker-engine-we-r1-2-acceptance.yml"

concurrency:
  group: worker-engine-we-r1-2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: WE-R1.2 disposable-local acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify safety inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260814094000_worker_engine_we_r1_2_runtime_policy_kernel.sql
          test -f supabase/tests/worker_engine_we_r1_2_runtime_policy_kernel.sql
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/worker-engine-we-r1-2-acceptance.yml').read_text(encoding='utf-8')
          forbidden = [
              'SUPABASE_' + 'ACCESS_TOKEN',
              'SUPABASE_' + 'DB_PASSWORD',
              'PROD_' + 'URL',
              'production' + '-migration-repair',
              '${{ ' + 'secrets.',
          ]
          found = [needle for needle in forbidden if needle in text]
          if found:
              raise SystemExit('production credential/reference detected: ' + ', '.join(found))
          PY

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Disable seed for schema-only proof
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then
            mv supabase/seed.sql /tmp/vibeschool-seed.sql.disabled
          fi

      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Rebuild full migration chain locally
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local --no-seed

      - name: Run WE-R1.2 adversarial acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql \
            "postgresql://postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/worker_engine_we_r1_2_runtime_policy_kernel.sql

      - name: Verify runtime remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(PGPASSWORD=postgres psql \
            "postgresql://postgres@127.0.0.1:54322/postgres" \
            -Atqc "select heartbeat_enabled::text||'|'||factory_enabled::text||'|'||runtime_execution_enabled::text||'|'||runtime_autonomy_level::text||'|'||runtime_max_risk::text from public.hq_workforce_engine_contract where singleton=true")"
          test "$STATE" = "false|false|false|0|0"

      - name: Destroy disposable local database
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
