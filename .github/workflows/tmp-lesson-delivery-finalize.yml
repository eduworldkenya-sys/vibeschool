name: Temporary Lesson Delivery Finalize

on:
  push:
    branches:
      - lesson-plan-delivery-state-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lesson-plan-delivery-state-hardening
          fetch-depth: 0
      - name: Patch modal and contract test
        run: |
          python - <<'PY'
          from pathlib import Path

          modal = Path('components/teacher/LessonPlanModal.tsx')
          text = modal.read_text()
          old = "      setSections(draft)\n      setPhase('view')\n      showToast('Plan saved')"
          new = "      setSections(draft)\n      setStatus('draft')\n      setPhase('view')\n      showToast('Plan saved · publish/share again after review')"
          if text.count(old) != 1:
              raise SystemExit(f'modal saveEdit match count: {text.count(old)}')
          modal.write_text(text.replace(old, new, 1))

          test = Path('scripts/test-lesson-delivery-state-hardening.py')
          text = test.read_text()
          anchor = "    require('lesson_plan_guard_delivery_transition' in MIGRATION, 'delivered plans cannot silently revert to draft')\n"
          addition = anchor + "    require('lesson_plan_delivery_status_only_draft_rollback_denied' in MIGRATION, 'status-only rollback is denied')\n    require('new.body is not distinct from old.body' in MIGRATION, 'real content revision is distinguished from status rollback')\n    require('new.parent_shared_at := null' in MIGRATION, 'revision clears stale parent delivery evidence')\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'test anchor count: {text.count(anchor)}')
          test.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Commit final source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/teacher/LessonPlanModal.tsx scripts/test-lesson-delivery-state-hardening.py
          git diff --cached --quiet && exit 1
          git commit -m 'fix: reflect lesson revision delivery invalidation in UI'
          git push origin HEAD:lesson-plan-delivery-state-hardening
