name: Task 9 Founder OS SQL Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/task9_founder_os_reconciliation.sql'
      - 'scripts/test-task9-sql-contract.mjs'
      - '.github/workflows/task9-founder-os-sql-contract.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/task9_founder_os_reconciliation.sql'
      - 'scripts/test-task9-sql-contract.mjs'
      - '.github/workflows/task9-founder-os-sql-contract.yml'

permissions:
  contents: read

jobs:
  sql-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Task 9 SQL contract shape
        run: node scripts/test-task9-sql-contract.mjs
