name: V1 Lesson and Live Production Migrations

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v1-lesson-live-production.yml'
      - 'scripts/v1-lesson-live-stage.py'
      - 'supabase/migrations/20261121141000_live_moderated_chat_waiting_typing.sql'
      - 'supabase/migrations/20261121180000_restore_dated_lesson_outcome_attachment.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1-lesson-live-production.yml'

permissions:
  contents: read

concurrency:
  group: v1-lesson-live-production
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf

jobs:
  contract:
    name: Validate exact lesson and Live migration sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 scripts/v1-lesson-live-stage.py check
          python3 scripts/test-worker-engine-build-ledger-aligned-stage.py
          python3 scripts/test-worker-engine-assert-dry-run-plan.py

  production:
    name: Apply and verify the allowlisted V1 migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-migration-repair
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.1.0
      - name: Verify production target and capture migration ledger
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_ID" = "$EXPECTED_PROJECT_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          mkdir -p .v1-lesson-live
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF"
          supabase migration list --remote 2>&1 | tee .v1-lesson-live/before.txt
          python3 scripts/tbl013-live-ledger-audit.py \
            --migrations-dir supabase/migrations --ledger .v1-lesson-live/before.txt \
            --report .v1-lesson-live/audit.json --plan .v1-lesson-live/ledger.md \
            --project-ref "$EXPECTED_PROJECT_REF"
          python3 scripts/v1-lesson-live-stage.py prepare
      - name: Validate exact dry run and apply
        run: |
          set -euo pipefail
          if [ -s .v1-lesson-live/expected.txt ]; then
            cd .v1-lesson-live-stage
            supabase link --project-ref "$EXPECTED_PROJECT_REF"
            test "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF"
            supabase db push --remote --dry-run --include-all 2>&1 | tee ../.v1-lesson-live/dry-run.txt
            cd ..
            python3 scripts/worker-engine-assert-dry-run-plan.py \
              --expected .v1-lesson-live/expected.txt --dry-run-output .v1-lesson-live/dry-run.txt \
              --report .v1-lesson-live/dry-run-verified.txt
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
            cd .v1-lesson-live-stage
            supabase db push --remote --include-all --yes 2>&1 | tee ../.v1-lesson-live/applied.txt
          fi
      - name: Verify production ledger and access contracts
        run: |
          set -euo pipefail
          supabase migration list --remote 2>&1 | tee .v1-lesson-live/after.txt
          python3 scripts/v1-lesson-live-stage.py verify
          cat > .v1-lesson-live/verify.sql <<'SQL'
            select 1 / case when
              to_regprocedure('public.attach_scheme_to_dated_lesson(uuid,uuid,uuid)') is not null
              and has_function_privilege('authenticated', 'public.attach_scheme_to_dated_lesson(uuid,uuid,uuid)', 'EXECUTE')
              and not has_function_privilege('anon', 'public.attach_scheme_to_dated_lesson(uuid,uuid,uuid)', 'EXECUTE')
              and (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                   where n.nspname='vibe_live' and c.relname in ('class_messages', 'class_reports', 'waiting_requests', 'dm_typing')
                   and c.relrowsecurity and not has_table_privilege('authenticated',c.oid,'SELECT')
                   and not has_table_privilege('anon',c.oid,'SELECT'))=4
              then 1 else 0 end as verified;
          SQL
          supabase db query --remote --read-only -f .v1-lesson-live/verify.sql | tee .v1-lesson-live/production-verification.txt
      - name: Retain production release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-lesson-live-production-${{ github.run_id }}
          path: .v1-lesson-live/
          include-hidden-files: true
          if-no-files-found: warn
