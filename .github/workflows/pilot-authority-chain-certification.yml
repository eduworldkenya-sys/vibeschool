name: Pilot Authority Chain Certification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260812082409*.sql'
      - 'supabase/migrations/2026081713*.sql'
      - 'supabase/migrations/2026081714*.sql'
      - 'supabase/migrations/2026081715*.sql'
      - 'supabase/migrations/2026081716*.sql'
      - 'supabase/migrations/20260818001345*.sql'
      - 'supabase/migrations/20260818002145*.sql'
      - 'supabase/migrations/20260818013000*.sql'
      - 'scripts/sql/pilot_authority_chain_verify.sql'
      - 'scripts/sql/pilot_authority_bypass_verify.sql'
      - 'scripts/sql/pilot_class_teacher_reconciliation_verify.sql'
      - 'scripts/sql/recovered_cross_tenant_security_verify.sql'
      - 'scripts/sql/tbl011_clean_rebuild_verify.sql'
      - 'scripts/validate-tbl011-clean-rebuild.py'
      - '.github/workflows/pilot-authority-chain-certification.yml'

concurrency:
  group: pilot-authority-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authority-certification:
    name: Disposable-local semantic authority certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify Docker
        run: docker info
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Disable seed
        shell: bash
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql /tmp/vibeschool-seed.sql.disabled; fi
      - name: Start disposable Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Rebuild migration chain
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local --no-seed
      - name: Certify pilot authority semantics
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -f scripts/sql/pilot_authority_chain_verify.sql
      - name: Certify canonical class-teacher reconciliation
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -f scripts/sql/pilot_class_teacher_reconciliation_verify.sql
      - name: Certify pilot authorization bypass closure
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -f scripts/sql/pilot_authority_bypass_verify.sql
      - name: Certify recovered cross-tenant security semantics
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -f scripts/sql/recovered_cross_tenant_security_verify.sql
      - name: Destroy disposable Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup > /dev/null 2>&1 || true
