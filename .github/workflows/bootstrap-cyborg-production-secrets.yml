name: Bootstrap Cyborg Production Secrets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-cyborg-production-secrets.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure Cyborg capability signing key
        shell: bash
        run: |
          set -euo pipefail
          current="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_ID")"
          if printf '%s\n' "$current" | grep -q 'CYBORG_CAPABILITY_SIGNING_KEY'; then
            echo 'CYBORG_CAPABILITY_SIGNING_KEY already configured; leaving it unchanged.'
          else
            signing_key="$(openssl rand -hex 48)"
            supabase secrets set "CYBORG_CAPABILITY_SIGNING_KEY=$signing_key" --project-ref "$SUPABASE_PROJECT_ID"
            unset signing_key
            echo 'CYBORG_CAPABILITY_SIGNING_KEY created in Supabase Secrets.'
          fi

      - name: Verify Chemistry provider credential exists
        shell: bash
        run: |
          set -euo pipefail
          current="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_ID")"
          if ! printf '%s\n' "$current" | grep -q 'GROQ_API_KEY'; then
            echo '::error::GROQ_API_KEY is not configured in Supabase Secrets.'
            exit 1
          fi
          echo 'GROQ_API_KEY is configured.'

      - name: Verify signing key exists after bootstrap
        shell: bash
        run: |
          set -euo pipefail
          current="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_ID")"
          printf '%s\n' "$current" | grep -q 'CYBORG_CAPABILITY_SIGNING_KEY'
          echo 'Cyborg production signing secret is present.'
