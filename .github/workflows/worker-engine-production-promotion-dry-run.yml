name: Worker Engine Production Promotion Dry Run

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DRY_RUN_WORKER_ENGINE_PROMOTION to run the read-only production plan
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-engine-production-promotion-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Read-only Worker Engine production promotion plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-migration-repair

    env:
      EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf

    steps:
      - name: Require exact dry-run confirmation and main ref
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "DRY_RUN_WORKER_ENGINE_PROMOTION" ]; then
            echo "Refusing Worker Engine production dry run: confirmation phrase mismatch." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing Worker Engine production dry run from non-main ref: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worker-engine-promotion-dry-run
          {
            echo "run_id=${{ github.run_id }}"
            echo "actor=${{ github.actor }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "project_ref=$EXPECTED_PROJECT_REF"
            echo "mode=DRY_RUN_ONLY"
            echo "ledger_mutation=false"
            echo "production_ddl=false"
          } > .worker-engine-promotion-dry-run/context.txt

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Link exact production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"

      - name: Capture local and remote migration ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 \
            | tee .worker-engine-promotion-dry-run/migration-list.txt

      - name: Run proven TBL-013 read-only ledger parser
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tbl013-live-ledger-audit.py \
            --migrations-dir supabase/migrations \
            --ledger .worker-engine-promotion-dry-run/migration-list.txt \
            --report .worker-engine-promotion-dry-run/tbl013-report.json \
            --plan .worker-engine-promotion-dry-run/tbl013-plan.md \
            --project-ref "$EXPECTED_PROJECT_REF"

      - name: Build ledger-aligned ephemeral promotion view
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import re
          import shutil
          from pathlib import Path

          expected = {
              '20260812191500','20260812191600','20260812193000',
              '20260812194000','20260812195000','20260812200000',
              '20260812201000','20260812202000','20260812202100',
              '20260812202200','20260812202300','20260812202400',
              '20260812202500','20260812202600','20260812211500',
              '20260812213000','20260812214500','20260812215500',
              '20260812221000','20260812222000','20260812223000',
              '20260813023028',
          }

          report_path = Path('.worker-engine-promotion-dry-run/tbl013-report.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))

          if report.get('read_only_audit') is not True:
              raise SystemExit('Worker Engine dry run blocked: TBL-013 report is not read-only')
          if report.get('authorized_repairs'):
              raise SystemExit('Worker Engine dry run blocked: ledger repair unexpectedly authorized')

          local_only = {entry['version'] for entry in report['local_only']}
          remote_only = {entry['version'] for entry in report['remote_only']}
          parity = set(report['parity_versions'])
          missing_expected = sorted(expected - local_only)
          unrelated_local_only = sorted(local_only - expected)

          if missing_expected:
              raise SystemExit(
                  'Worker Engine dry run blocked: expected migration is not genuinely pending: '
                  + ','.join(missing_expected)
              )

          if parity & remote_only or parity & local_only or remote_only & local_only:
              raise SystemExit('Worker Engine dry run blocked: TBL-013 version classes overlap')

          stage = Path('.worker-engine-promotion-stage')
          if stage.exists():
              shutil.rmtree(stage)
          (stage / 'supabase' / 'migrations').mkdir(parents=True)

          config = Path('supabase/config.toml')
          if not config.is_file():
              raise SystemExit('Worker Engine dry run blocked: supabase/config.toml missing')
          shutil.copy2(config, stage / 'supabase' / 'config.toml')

          migration_re = re.compile(r'^(\d{8,14})_.+\.sql$')
          staged_versions = set()

          for source in sorted(Path('supabase/migrations').glob('*.sql')):
              match = migration_re.fullmatch(source.name)
              if match is None:
                  raise SystemExit(f'invalid migration filename: {source.name}')
              version = match.group(1)
              if version in unrelated_local_only:
                  continue
              shutil.copy2(source, stage / 'supabase' / 'migrations' / source.name)
              staged_versions.add(version)

          for version in sorted(remote_only):
              if version in staged_versions:
                  raise SystemExit(
                      f'Worker Engine dry run blocked: remote-only version unexpectedly staged: {version}'
                  )
              placeholder = (
                  stage / 'supabase' / 'migrations' /
                  f'{version}_production_history_placeholder.sql'
              )
              placeholder.write_text(
                  '-- CI-only ledger-alignment placeholder for an already-applied production migration.\n'
                  '-- Never executed; version exists in production history.\n',
                  encoding='utf-8',
              )
              staged_versions.add(version)

          remote_versions = parity | remote_only
          expected_stage = remote_versions | expected

          if staged_versions != expected_stage:
              missing = sorted(expected_stage - staged_versions)
              extra = sorted(staged_versions - expected_stage)
              raise SystemExit(
                  f'Worker Engine dry run blocked: staged ledger mismatch missing={missing} extra={extra}'
              )

          manifest = {
              'mode': 'EPHEMERAL_LEDGER_ALIGNED_DRY_RUN_VIEW',
              'expected_worker_engine_versions': sorted(expected),
              'excluded_unrelated_repository_only': unrelated_local_only,
              'production_only_placeholders': sorted(remote_only),
              'parity_versions': sorted(parity),
              'staged_version_count': len(staged_versions),
              'remote_version_count': len(remote_versions),
              'authorized_repairs': [],
              'production_mutation': False,
          }
          Path('.worker-engine-promotion-dry-run/staging-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          Path('.worker-engine-promotion-dry-run/expected-versions.txt').write_text(
              '\n'.join(sorted(expected)) + '\n', encoding='utf-8'
          )

          print('Expected Worker Engine migrations:', len(expected))
          print('Excluded unrelated repository-only:', len(unrelated_local_only))
          print('Production-only placeholders:', len(remote_only))
          print('Parity versions:', len(parity))
          print('Staged migration versions:', len(staged_versions))
          PYEOF

      - name: Link ephemeral view to exact production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd .worker-engine-promotion-stage
          supabase link --project-ref "$EXPECTED_PROJECT_REF"

      - name: Supabase production push dry run from ledger-aligned view
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          cd .worker-engine-promotion-stage
          supabase db push --linked --dry-run --include-all 2>&1 \
            | tee ../.worker-engine-promotion-dry-run/db-push-dry-run.txt

      - name: Assert dry run plans exactly the approved 22 migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re
          from pathlib import Path

          expected = set(
              Path('.worker-engine-promotion-dry-run/expected-versions.txt')
              .read_text(encoding='utf-8')
              .split()
          )
          output = Path('.worker-engine-promotion-dry-run/db-push-dry-run.txt').read_text(
              encoding='utf-8', errors='replace'
          )
          seen = set(re.findall(r'(?<!\d)(\d{14})(?!\d)', output))
          planned = seen & expected
          unexpected = sorted(seen - expected)
          missing = sorted(expected - planned)

          summary = [
              f'expected_count={len(expected)}',
              f'planned_expected_count={len(planned)}',
              f'missing_expected={missing}',
              f'unexpected_timestamp_tokens={unexpected}',
          ]
          Path('.worker-engine-promotion-dry-run/dry-run-assertion.txt').write_text(
              '\n'.join(summary) + '\n', encoding='utf-8'
          )
          print('\n'.join(summary))

          if missing:
              raise SystemExit('Worker Engine dry run blocked: not all approved migrations were planned')
          if unexpected:
              raise SystemExit('Worker Engine dry run blocked: dry run referenced an unapproved timestamp')
          PYEOF

      - name: Assert dry-run-only evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'ref=refs/heads/main' .worker-engine-promotion-dry-run/context.txt
          grep -F 'mode=DRY_RUN_ONLY' .worker-engine-promotion-dry-run/context.txt
          grep -F 'ledger_mutation=false' .worker-engine-promotion-dry-run/context.txt
          grep -F 'production_ddl=false' .worker-engine-promotion-dry-run/context.txt
          test -s .worker-engine-promotion-dry-run/migration-list.txt
          test -s .worker-engine-promotion-dry-run/tbl013-report.json
          test -s .worker-engine-promotion-dry-run/tbl013-plan.md
          test -s .worker-engine-promotion-dry-run/staging-manifest.json
          test -s .worker-engine-promotion-dry-run/db-push-dry-run.txt
          test -s .worker-engine-promotion-dry-run/dry-run-assertion.txt
          sha256sum .worker-engine-promotion-dry-run/* \
            > .worker-engine-promotion-dry-run/evidence.sha256

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-engine-production-promotion-dry-run-${{ github.run_id }}
          path: .worker-engine-promotion-dry-run/
          if-no-files-found: error
          retention-days: 30
