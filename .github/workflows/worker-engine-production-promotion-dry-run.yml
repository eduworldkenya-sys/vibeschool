name: Worker Engine Production Promotion Dry Run

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DRY_RUN_WORKER_ENGINE_PROMOTION to run the read-only production plan
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-engine-production-promotion-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Read-only Worker Engine production promotion plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-migration-repair

    env:
      EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf

    steps:
      - name: Require exact dry-run confirmation and main ref
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "DRY_RUN_WORKER_ENGINE_PROMOTION" ]; then
            echo "Refusing Worker Engine production dry run: confirmation phrase mismatch." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing Worker Engine production dry run from non-main ref: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worker-engine-promotion-dry-run
          {
            echo "run_id=${{ github.run_id }}"
            echo "actor=${{ github.actor }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "project_ref=$EXPECTED_PROJECT_REF"
            echo "mode=DRY_RUN_ONLY"
            echo "ledger_mutation=false"
            echo "production_ddl=false"
          } > .worker-engine-promotion-dry-run/context.txt

      - name: Run promotion regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-worker-engine-build-ledger-aligned-stage.py
          python3 scripts/test-worker-engine-assert-dry-run-plan.py

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Link exact production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"

      - name: Capture local and remote migration ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 \
            | tee .worker-engine-promotion-dry-run/migration-list.txt

      - name: Run proven TBL-013 read-only ledger parser
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tbl013-live-ledger-audit.py \
            --migrations-dir supabase/migrations \
            --ledger .worker-engine-promotion-dry-run/migration-list.txt \
            --report .worker-engine-promotion-dry-run/tbl013-report.json \
            --plan .worker-engine-promotion-dry-run/tbl013-plan.md \
            --project-ref "$EXPECTED_PROJECT_REF"

      - name: Build ledger-aligned ephemeral promotion view
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/worker-engine-build-ledger-aligned-stage.py \
            --report .worker-engine-promotion-dry-run/tbl013-report.json \
            --migrations-dir supabase/migrations \
            --config supabase/config.toml \
            --stage-dir .worker-engine-promotion-stage \
            --manifest .worker-engine-promotion-dry-run/staging-manifest.json \
            --expected-versions .worker-engine-promotion-dry-run/expected-versions.txt

      - name: Link ephemeral view to exact production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd .worker-engine-promotion-stage
          supabase link --project-ref "$EXPECTED_PROJECT_REF"

      - name: Supabase production push dry run from ledger-aligned view
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          cd .worker-engine-promotion-stage
          supabase db push --linked --dry-run --include-all 2>&1 \
            | tee ../.worker-engine-promotion-dry-run/db-push-dry-run.txt

      - name: Assert dry run plans exactly the approved migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/worker-engine-assert-dry-run-plan.py \
            --expected .worker-engine-promotion-dry-run/expected-versions.txt \
            --dry-run-output .worker-engine-promotion-dry-run/db-push-dry-run.txt \
            --report .worker-engine-promotion-dry-run/dry-run-assertion.txt

      - name: Assert dry-run-only evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'ref=refs/heads/main' .worker-engine-promotion-dry-run/context.txt
          grep -F 'mode=DRY_RUN_ONLY' .worker-engine-promotion-dry-run/context.txt
          grep -F 'ledger_mutation=false' .worker-engine-promotion-dry-run/context.txt
          grep -F 'production_ddl=false' .worker-engine-promotion-dry-run/context.txt
          grep -F 'status=PASSED' .worker-engine-promotion-dry-run/dry-run-assertion.txt
          test -s .worker-engine-promotion-dry-run/migration-list.txt
          test -s .worker-engine-promotion-dry-run/tbl013-report.json
          test -s .worker-engine-promotion-dry-run/tbl013-plan.md
          test -s .worker-engine-promotion-dry-run/staging-manifest.json
          test -s .worker-engine-promotion-dry-run/db-push-dry-run.txt
          test -s .worker-engine-promotion-dry-run/dry-run-assertion.txt
          sha256sum .worker-engine-promotion-dry-run/* \
            > .worker-engine-promotion-dry-run/evidence.sha256

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-engine-production-promotion-dry-run-${{ github.run_id }}
          path: .worker-engine-promotion-dry-run/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
