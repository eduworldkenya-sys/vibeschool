name: TBL-013 One-Shot Repository Inventory

on:
  push:
    branches:
      - fix/tbl-013-production-ledger-reconciliation-refresh-20260812
    paths:
      - .github/workflows/tbl013-one-shot-readonly-capture.yml

permissions:
  contents: read

jobs:
  inventory:
    name: Capture exact repository migration inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPO_SHA: 929d49f73c9148e149c5c9bf0a5b201710a2e900
    steps:
      - name: Checkout exact certified TBL-013 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REPO_SHA }}

      - name: Capture repository migration inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tbl013-artifacts
          test "$(git rev-parse HEAD)" = "$TARGET_REPO_SHA"

          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sort > .tbl013-artifacts/repository-migrations.txt

          python3 - <<'PYEOF'
          import hashlib, json, re
          from pathlib import Path

          rows = Path('.tbl013-artifacts/repository-migrations.txt').read_text().splitlines()
          pattern = re.compile(r'^(\d{8,14})_(.+)\.sql$')
          versions = []
          invalid = []
          for row in rows:
              m = pattern.fullmatch(row)
              if m:
                  versions.append(m.group(1))
              else:
                  invalid.append(row)
          dup = sorted({v for v in versions if versions.count(v) > 1})
          payload = {
              'target_repo_sha': '929d49f73c9148e149c5c9bf0a5b201710a2e900',
              'migration_files': len(rows),
              'distinct_versions': len(set(versions)),
              'duplicate_versions': dup,
              'invalid_filenames': invalid,
              'filename_inventory_sha256': hashlib.sha256(('\n'.join(rows)+'\n').encode()).hexdigest(),
              'versions': sorted(set(versions)),
          }
          Path('.tbl013-artifacts/repository-inventory.json').write_text(json.dumps(payload, indent=2)+'\n')
          print(json.dumps({k:v for k,v in payload.items() if k != 'versions'}, indent=2))
          PYEOF

          sha256sum .tbl013-artifacts/* > .tbl013-artifacts/evidence.sha256

      - name: Upload repository inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: tbl013-repository-inventory-${{ github.run_id }}
          path: .tbl013-artifacts/
          if-no-files-found: error
          retention-days: 30
