name: Canonical Workforce Convergence

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/validate-canonical-workforce-convergence.mjs'
      - 'docs/CANONICAL_WORKFORCE_CONVERGENCE_20260823.md'
      - '.github/workflows/canonical-workforce-convergence.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/validate-canonical-workforce-convergence.mjs'
      - '.github/workflows/canonical-workforce-convergence.yml'

permissions:
  contents: read

jobs:
  canonical-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate canonical Worker Engine + Cyborg convergence
        run: node scripts/validate-canonical-workforce-convergence.mjs
