name: TSC Marketplace Sandbox Contract

on:
  pull_request:
    paths:
      - "app/teacher/marketplace/sandbox/**"
      - "lib/teacher/tscSandboxMatching.ts"
      - "scripts/test-tsc-marketplace-sandbox.mjs"
      - ".github/workflows/tsc-marketplace-sandbox-contract.yml"
  push:
    branches: [main]
    paths:
      - "app/teacher/marketplace/sandbox/**"
      - "lib/teacher/tscSandboxMatching.ts"
      - "scripts/test-tsc-marketplace-sandbox.mjs"
      - ".github/workflows/tsc-marketplace-sandbox-contract.yml"

permissions:
  contents: read

jobs:
  matching-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install without scripts
        run: npm ci --ignore-scripts
      - name: Verify demo matches and safety boundaries
        run: node --import ./scripts/register-typescript.mjs scripts/test-tsc-marketplace-sandbox.mjs
