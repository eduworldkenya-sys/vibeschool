name: One-time lesson UI patch
on:
  push:
    branches: [fix/lesson-ready-to-teach]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lesson-ready-to-teach
          fetch-depth: 0
      - name: Apply teacher-facing lesson UX patch
        run: |
          python - <<'PY'
          from pathlib import Path

          modal = Path('components/teacher/LessonPlanModal.tsx')
          text = modal.read_text()
          replacements = {
            "import EvidenceCaptureSheet from '@/components/teacher/EvidenceCaptureSheet'": "import EvidenceCaptureSheet from '@/components/teacher/EvidenceCaptureSheet'\nimport LessonTeachMode from '@/components/teacher/LessonTeachMode'",
            "{ key: 'resources',       label: 'Resources Needed',         icon: '🗂️' },": "{ key: 'resources',       label: 'VibeSchool & Scheme Resources', icon: '🗂️' },",
            "{ key: 'introduction',    label: 'Introduction (5-7 min)',   icon: '🔥' },": "{ key: 'introduction',    label: 'Introduction',                  icon: '🔥' },",
            "{ key: 'development',     label: 'Development (20-25 min)',  icon: '📖' },": "{ key: 'development',     label: 'Teaching & Learning Sequence',  icon: '📖' },",
            "{ key: 'consolidation',   label: 'Consolidation (8-10 min)', icon: '✅' },": "{ key: 'consolidation',   label: 'Consolidation',                 icon: '✅' },",
            "{ key: 'assessmentHook',  label: 'Assessment Hook',          icon: '📊' },": "{ key: 'assessmentHook',  label: 'Assessment & Exit Check',       icon: '📊' },",
            "const [showHistory,    setShowHistory]    = useState(false)": "const [showHistory,    setShowHistory]    = useState(false)\n  const [teachMode,      setTeachMode]      = useState(false)",
            "<span>✦</span> Generate Lesson Plan": "<span>✦</span> Build Lesson Plan",
            "<span>Generated by Twin · CBC aligned</span>": "<span>{canonicalIdentity ? 'Built from Scheme + VibeSchool Content · KICD aligned · No AI' : 'Built from authoritative Scheme data · No AI'}</span>",
            "{action.icon} Generate {action.label}": "{action.icon} Open {action.label}",
            ">Regenerate</button>": ">Create another version</button>",
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'modal patch marker not found: {old}')
            text = text.replace(old, new, 1)

          marker = "                {workspace?.canComplete && ("
          insert = """                {workspace?.lifecycle === 'in_progress' && (\n                  <button type=\"button\" onClick={() => setTeachMode(true)} style={{\n                    width: '100%', padding: '13px', borderRadius: 12, border: '1.5px solid #4338ca',\n                    background: '#eef2ff', color: '#4338ca', fontSize: 13, fontWeight: 800,\n                    cursor: 'pointer', fontFamily: 'inherit',\n                  }}>🎓 Teach from Plan</button>\n                )}\n"""
          if marker not in text:
            raise SystemExit('teach button marker not found')
          text = text.replace(marker, insert + marker, 1)

          overlay_marker = "      {showEvidence &&"
          overlay = """      {teachMode && (\n        <LessonTeachMode\n          subject={slot.subject}\n          className={slot.class}\n          topic={topic}\n          sections={sections}\n          onClose={() => setTeachMode(false)}\n        />\n      )}\n\n"""
          if overlay_marker not in text:
            raise SystemExit('teach overlay marker not found')
          text = text.replace(overlay_marker, overlay + overlay_marker, 1)
          modal.write_text(text)

          page = Path('app/teacher/lessonplan/page.tsx')
          text = page.read_text()
          old_import = "import LessonPlanModal from '@/components/teacher/LessonPlanModal'"
          new_import = old_import + "\nimport { isLessonPlanReadyToTeach } from '@/lib/teaching/lessonReadiness'"
          if old_import not in text:
            raise SystemExit('lesson page import marker not found')
          text = text.replace(old_import, new_import, 1)
          old_counts = "  const readyCount   = items.filter(i => i.plan).length\n  const missingCount = items.filter(i => !i.plan).length"
          new_counts = "  const readyCount = items.filter(i => i.plan && isLessonPlanReadyToTeach(i.plan.body)).length\n  const missingCount = items.length - readyCount"
          if old_counts not in text:
            raise SystemExit('lesson page count marker not found')
          text = text.replace(old_counts, new_counts, 1)
          text = text.replace("if (diffFilter === 'missing')   return !plan", "if (diffFilter === 'missing')   return !plan || !isLessonPlanReadyToTeach(plan.body)", 1)
          page.write_text(text)

          workflow = Path('.github/workflows/lesson-ui-patch.yml')
          workflow.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/teacher/LessonPlanModal.tsx components/teacher/LessonTeachMode.tsx app/teacher/lessonplan/page.tsx lib/teaching/lessonReadiness.ts .github/workflows/lesson-ui-patch.yml
          git commit -m "feat(lesson): finish zero-AI teacher UX and teach mode"
          git push origin HEAD:fix/lesson-ready-to-teach
