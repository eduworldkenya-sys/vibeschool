name: TBL-011 Isolated Clean Rebuild

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "scripts/sql/tbl011_clean_rebuild_verify.sql"
      - "scripts/sql/verify_worker_engine_authority_plane.sql"
      - "scripts/sql/certify_task12_observability.sql"
      - "scripts/sql/tbl012_core_schema_snapshot.sql"
      - "scripts/sql/tbl012_core_schema_hashes.sql"
      - "scripts/tbl012-compare-schema-hashes.py"
      - "scripts/validate-tbl011-clean-rebuild.py"
      - "scripts/scan-l0-migration-dependencies.py"
      - ".github/workflows/tbl011-clean-rebuild.yml"

concurrency:
  group: tbl011-clean-rebuild-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-rebuild:
    name: Blank database migration rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tbl011-artifacts

          {
            echo "run_id=${{ github.run_id }}"
            echo "actor=${{ github.actor }}"
            echo "repository=${{ github.repository }}"
            echo "event_sha=${{ github.sha }}"
            echo "checkout_sha=$(git rev-parse HEAD)"
            echo "ref=${{ github.ref }}"
            echo "production_project_linked=false"
          } > .tbl011-artifacts/context.txt

          find supabase/migrations \
            -maxdepth 1 \
            -type f \
            -name '*.sql' \
            -printf '%f\n' \
            | sort \
            > .tbl011-artifacts/migration-files.txt

          wc -l .tbl011-artifacts/migration-files.txt \
            | tee .tbl011-artifacts/migration-count.txt

      - name: Validate rebuild controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-tbl011-clean-rebuild.py

      - name: Scan full migration dependency chain
        shell: bash
        run: |
          set -euo pipefail
          # Discovery and proof are deliberately separate. Persist every static
          # finding, but do not let the scanner mask the first real PostgreSQL
          # runtime failure from the same CI run.
          python3 scripts/scan-l0-migration-dependencies.py \
            --allow-findings \
            --report .tbl011-artifacts/l0-migration-dependency-report.json

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker info \
            > .tbl011-artifacts/docker-info.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Disable seed for schema-only proof
        shell: bash
        run: |
          set -euo pipefail

          if [ -f supabase/seed.sql ]; then
            mv supabase/seed.sql \
              .tbl011-artifacts/seed.sql.disabled
          fi

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -o pipefail

          supabase start \
            -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor \
            2>&1 \
            | tee .tbl011-artifacts/supabase-start.log

      - name: Rebuild blank local database
        shell: bash
        run: |
          set -o pipefail

          supabase db reset --local --no-seed \
            2>&1 \
            | tee .tbl011-artifacts/db-reset.log

      - name: Verify migration ledger count
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="$(
            wc -l \
              < .tbl011-artifacts/migration-files.txt
          )"

          ACTUAL="$(
            PGPASSWORD=postgres \
              psql \
              "postgresql://postgres@127.0.0.1:54322/postgres" \
              -Atqc \
              "select count(*) from supabase_migrations.schema_migrations"
          )"

          {
            echo "expected=$EXPECTED"
            echo "actual=$ACTUAL"
          } | tee .tbl011-artifacts/ledger-count.txt

          test "$ACTUAL" = "$EXPECTED"

      - name: Verify final timetable schema and RLS
        shell: bash
        run: |
          set -o pipefail

          PGPASSWORD=postgres \
            psql \
            "postgresql://postgres@127.0.0.1:54322/postgres" \
            -f scripts/sql/tbl011_clean_rebuild_verify.sql \
            2>&1 \
            | tee .tbl011-artifacts/final-schema-verification.log

      - name: Verify Worker Engine authority plane
        shell: bash
        run: |
          set -o pipefail

          PGPASSWORD=postgres \
            psql \
            "postgresql://postgres@127.0.0.1:54322/postgres" \
            -f scripts/sql/verify_worker_engine_authority_plane.sql \
            2>&1 \
            | tee .tbl011-artifacts/worker-engine-authority-plane.log

      - name: Verify Task 12 observability contract
        shell: bash
        run: |
          set -o pipefail

          PGPASSWORD=postgres \
            psql \
            "postgresql://postgres@127.0.0.1:54322/postgres" \
            -f scripts/sql/certify_task12_observability.sql \
            2>&1 \
            | tee .tbl011-artifacts/task12-observability-contract.log

      - name: Capture rebuilt timetable schema
        shell: bash
        run: |
          set -euo pipefail

          PGPASSWORD=postgres \
            psql \
            "postgresql://postgres@127.0.0.1:54322/postgres" \
            -f scripts/sql/tbl012_core_schema_snapshot.sql \
            > .tbl011-artifacts/rebuilt-core-schema.json

          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path

          path = Path(
              ".tbl011-artifacts/rebuilt-core-schema.json"
          )

          data = json.loads(path.read_text(encoding="utf-8"))

          expected = {
              "timetable_slots",
              "teacher_classes",
              "teaching_occurrences",
              "school_periods",
          }

          if data.get("schema_version") != 1:
              raise SystemExit(
                  "rebuilt schema snapshot has wrong schema_version"
              )

          if set(data.get("tables", {})) != expected:
              raise SystemExit(
                  "rebuilt schema snapshot has wrong table set"
              )

          print("Rebuilt timetable schema snapshot validated")
          PYVERIFY

          sha256sum \
            .tbl011-artifacts/rebuilt-core-schema.json \
            > .tbl011-artifacts/rebuilt-core-schema.sha256

      - name: Compare rebuilt structure with production target
        shell: bash
        run: |
          set -euo pipefail

          PGPASSWORD=postgres \
            psql \
            "postgresql://postgres@127.0.0.1:54322/postgres" \
            -f scripts/sql/tbl012_core_schema_hashes.sql \
            > .tbl011-artifacts/rebuilt-core-schema-hashes.json

          python3 scripts/tbl012-compare-schema-hashes.py \
            --rebuilt .tbl011-artifacts/rebuilt-core-schema-hashes.json \
            --target supabase/reconciliation/tbl012_production_core_schema_hashes.json \
            --report .tbl011-artifacts/tbl012-schema-comparison-report.json

          sha256sum \
            .tbl011-artifacts/rebuilt-core-schema-hashes.json \
            .tbl011-artifacts/tbl012-schema-comparison-report.json \
            > .tbl011-artifacts/tbl012-comparison.sha256

      - name: Capture final local migration ledger
        shell: bash
        run: |
          set -euo pipefail

          PGPASSWORD=postgres \
            psql \
            "postgresql://postgres@127.0.0.1:54322/postgres" \
            -P pager=off \
            -c "
              select version, name
              from supabase_migrations.schema_migrations
              order by version
            " \
            > .tbl011-artifacts/final-migration-ledger.txt

          sha256sum \
            .tbl011-artifacts/final-migration-ledger.txt \
            .tbl011-artifacts/final-schema-verification.log \
            .tbl011-artifacts/worker-engine-authority-plane.log \
            .tbl011-artifacts/task12-observability-contract.log \
            > .tbl011-artifacts/evidence.sha256

      - name: Upload rebuild evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbl011-clean-rebuild-${{ github.run_id }}
          path: .tbl011-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Destroy isolated local database
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup \
            > /dev/null 2>&1 || true
