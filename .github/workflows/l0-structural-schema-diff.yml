name: L0 Production vs Rebuild Structural Schema Diff

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/l0-structural-schema-diff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l0-structural-schema-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-diff:
    name: Object-level production vs local rebuild diff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-migration-repair
    env:
      EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .l0-schema-diff
          {
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "project_ref=$EXPECTED_PROJECT_REF"
            echo "mode=READ_ONLY_PRODUCTION"
          } > .l0-schema-diff/context.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link exact production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start \
            -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor \
            2>&1 | tee .l0-schema-diff/supabase-start.log

      - name: Rebuild local database from repository migrations
        shell: bash
        run: |
          set +e
          supabase db reset --local --no-seed \
            2>&1 | tee .l0-schema-diff/local-rebuild.log
          status=${PIPESTATUS[0]}
          echo "$status" > .l0-schema-diff/local-rebuild.exit-code
          echo "Local rebuild exit code: $status"
          # L0 inspection must continue so the partial schema becomes evidence.
          exit 0

      - name: Capture local object inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --local --schema public \
            -f .l0-schema-diff/local-public-schema.sql
          wc -l .l0-schema-diff/local-public-schema.sql \
            | tee .l0-schema-diff/local-schema-lines.txt

      - name: Capture production object inventory
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --linked --schema public \
            -f .l0-schema-diff/production-public-schema.sql
          wc -l .l0-schema-diff/production-public-schema.sql \
            | tee .l0-schema-diff/production-schema-lines.txt

      - name: Generate object-level structural diff with Migra
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set +e
          # Supabase db diff --linked --use-migra is the supported CLI path
          # for comparing the local database state with the linked production
          # schema. It is read-only with respect to production.
          supabase db diff \
            --linked \
            --use-migra \
            --schema public \
            --output .l0-schema-diff/production-vs-rebuild-migra.sql \
            2>&1 | tee .l0-schema-diff/migra-run.log
          status=${PIPESTATUS[0]}
          echo "$status" > .l0-schema-diff/migra.exit-code
          echo "Migra diff exit code: $status"
          exit 0

      - name: Produce explicit object inventory counts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for label in ("local", "production"):
              path = Path(f".l0-schema-diff/{label}-public-schema.sql")
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              counts = {
                  "tables": len(re.findall(r'^CREATE TABLE ', text, re.M)),
                  "functions": len(re.findall(r'^CREATE FUNCTION ', text, re.M)),
                  "policies": len(re.findall(r'^CREATE POLICY ', text, re.M)),
                  "indexes": len(re.findall(r'^CREATE (?:UNIQUE )?INDEX ', text, re.M)),
                  "triggers": len(re.findall(r'^CREATE TRIGGER ', text, re.M)),
                  "views": len(re.findall(r'^CREATE VIEW ', text, re.M)),
              }
              print(label, counts)
              Path(f".l0-schema-diff/{label}-object-counts.txt").write_text(
                  "\n".join(f"{k}={v}" for k, v in counts.items()) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Capture Supabase diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          supabase status > .l0-schema-diff/supabase-status.txt 2>&1
          docker ps -a > .l0-schema-diff/docker-ps.txt 2>&1
          for container in $(docker ps -a --format '{{.Names}}' | grep '^supabase_' || true); do
            docker logs "$container" > ".l0-schema-diff/${container}.log" 2>&1 || true
          done
          exit 0

      - name: Hash immutable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .l0-schema-diff/* > .l0-schema-diff/evidence.sha256 || true

      - name: Upload immutable structural diff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0-structural-schema-diff-${{ github.run_id }}
          path: .l0-schema-diff/
          if-no-files-found: error
          retention-days: 30

      - name: Destroy isolated local database
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup > /dev/null 2>&1 || true
