name: CBC Class Exam Authority
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*class_exam_review_authority.sql'
      - 'scripts/test-class-exam-authority-*.mjs'
      - '.github/workflows/class-exam-authority.yml'
permissions:
  contents: read
jobs:
  class-exam-auth:
    name: Isolated CBC examination authorization regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Structural contract
        run: node scripts/test-class-exam-authority-contract.mjs
      - name: Install isolated PostgreSQL runtime
        run: npm install --prefix "$RUNNER_TEMP/exam-db" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Exercise real SQL RLS and correction authority
        run: EXAM_PGLITE_MODULE="$RUNNER_TEMP/exam-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-class-exam-authority-db.mjs
