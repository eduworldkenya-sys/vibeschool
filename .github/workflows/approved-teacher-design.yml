name: Approved Teacher Design Interactions

on:
  pull_request:
    paths:
      - 'components/teacher/LessonPreparationStudio.tsx'
      - 'components/teacher/LessonTeachMode.tsx'
      - 'components/teacher/progress/OutcomeMatrix.tsx'
      - 'components/teacher/progress/LearnerEvidenceChart.tsx'
      - 'scripts/test-approved-design-interactions.mjs'
      - '.github/workflows/approved-teacher-design.yml'
  push:
    branches: [main]
    paths:
      - 'components/teacher/LessonPreparationStudio.tsx'
      - 'components/teacher/LessonTeachMode.tsx'
      - 'components/teacher/progress/OutcomeMatrix.tsx'
      - 'components/teacher/progress/LearnerEvidenceChart.tsx'
      - 'scripts/test-approved-design-interactions.mjs'
      - '.github/workflows/approved-teacher-design.yml'

permissions:
  contents: read

jobs:
  interaction-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Install isolated DOM test dependencies
        run: npm install --prefix "$RUNNER_TEMP/approved-design-tests" --ignore-scripts --no-audit --no-fund jsdom@30.1.2 esbuild@0.28.2 @testing-library/dom@10.4.2
      - name: Verify approved teaching and learner interactions
        run: PROGRESS_UI_MODULES="$RUNNER_TEMP/approved-design-tests/node_modules" node scripts/test-approved-design-interactions.mjs
