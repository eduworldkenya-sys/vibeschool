name: Task 7 convergence repair PR

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'task7/school-admin-production-certification-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task7/school-admin-production-certification-20260819
          fetch-depth: 0

      - name: Apply deterministic convergence repair
        run: python3 scripts/task7-one-shot-convergence-repair.py

      - name: Validate repaired contracts and TypeScript
        run: |
          set -euo pipefail
          node scripts/test-school-admin-task7-contract.mjs
          node scripts/test-school-admin-route-contract.mjs
          npx tsc --noEmit

      - name: Commit repaired candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task7-convergence-repair.yml \
                 .github/workflows/task7-convergence-repair-pr.yml \
                 scripts/task7-one-shot-convergence-repair.py
          git add app/admin/communication/page.tsx \
                  app/admin/settings/classes/page.tsx \
                  app/admin/settings/subjects/page.tsx \
                  app/admin/settings/school/page.tsx \
                  lib/database.types.ts \
                  supabase/reconciliation/tbl012_production_core_schema_hashes.json \
                  supabase/migrations/20260819020510_school_admin_cross_school_communication_hardening.sql
          git commit -m "fix(task7): reconcile certification blockers"
          git push origin HEAD:task7/school-admin-production-certification-20260819
