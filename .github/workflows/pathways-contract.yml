name: Pathways Mission Contract

on:
  pull_request:
    paths:
      - 'app/pathways/**'
      - 'app/student/pathways/**'
      - 'app/parent/pathways/**'
      - 'app/teacher/pathways/**'
      - 'lib/pathways/**'
      - 'supabase/migrations/*pathways*'
      - 'scripts/test-pathways-contract.mjs'
      - '.github/workflows/pathways-contract.yml'
      - 'app/login/[role]/page.tsx'
      - 'app/signup/parent/page.tsx'
      - 'app/sitemap.ts'

jobs:
  pathways-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Pathways current-main contract
        run: node scripts/test-pathways-contract.mjs
