name: Pathways Mission Contract

on:
  pull_request:
    paths:
      - 'app/pathways/**'
      - 'app/login/[role]/page.tsx'
      - 'app/signup/student/page.tsx'
      - 'app/student/profile/page.tsx'
      - 'lib/pathways/**'
      - 'supabase/migrations/*pathways*.sql'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'scripts/test-pathways-contract.mjs'
      - 'scripts/test-pathways-school-trust-contract.mjs'
      - '.github/workflows/pathways-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pathways-contract:
    name: Free-first truth, consent and authority contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Pathways mission contract
        run: node scripts/test-pathways-contract.mjs
      - name: Run School-to-Pathways trust contract
        run: node scripts/test-pathways-school-trust-contract.mjs
