name: Assessment workspace journeys
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/teacher/assessment/marking/**'
      - 'app/teacher/assessment/analytics/**'
      - 'app/teacher/assessment/curriculum/**'
      - 'app/teacher/assessment/interventions/**'
      - 'components/teacher/assessment/**'
      - 'lib/assessment/**'
      - 'scripts/test-assessment-workspace*'
      - 'supabase/migrations/*assessment_support_audit_repair*'
      - '.github/workflows/assessment-workspace.yml'
permissions:
  contents: read
concurrency:
  group: assessment-workspace-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  journeys:
    name: Assessment adapters, workflows and database authority
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/production-build-contract
        with:
          build_application: 'false'
          prebuild_command: |
            node scripts/test-assessment-workspace.mjs
            node scripts/test-progress-support.mjs
      - name: Install isolated test runtimes
        run: npm install --prefix "$RUNNER_TEMP/assessment-tests" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8 jsdom@26.1.0 esbuild@0.28.2 @testing-library/dom@10.4.2 playwright@1.64.0 axe-core@4.10.3
      - name: Verify support SQL authority and lifecycle
        run: WORKBOOK_PGLITE_MODULE="$RUNNER_TEMP/assessment-tests/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-assessment-workspace-db.mjs
      - name: Install Chromium for actual-component browser tests
        run: node "$RUNNER_TEMP/assessment-tests/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify populated, empty and failed journeys at four viewport widths
        run: |
          export WORKBOOK_UI_MODULES="$RUNNER_TEMP/assessment-tests/node_modules"
          export CHROMIUM_PATH=$(node -e "console.log(require(process.env.WORKBOOK_UI_MODULES+'/playwright').chromium.executablePath())")
          export ASSESSMENT_ARTIFACTS="$RUNNER_TEMP/assessment-workspace-artifacts"
          node scripts/test-assessment-workspace-ui.mjs --browser
          PROGRESS_UI_MODULES="$WORKBOOK_UI_MODULES" node scripts/test-progress-support-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assessment-workspace-browser-evidence
          path: ${{ runner.temp }}/assessment-workspace-artifacts
          if-no-files-found: warn
