name: Content Factory R2 Semantic Verifier

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260818131200_content_factory_r2_semantic_verifier.sql'
      - 'supabase/migrations/20260818131210_content_factory_r2_semantic_material_binding.sql'
      - 'supabase/functions/content-semantic-verifier/**'
      - 'scripts/sql/content_factory_r2_semantic_verifier_verify.sql'
      - 'docs/CONTENT_FACTORY_R2_SEMANTIC_VERIFIER_HANDOVER.md'
      - '.github/workflows/content-factory-r2-semantic-verifier.yml'
  workflow_dispatch:

jobs:
  disposable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start disposable Supabase
        run: supabase start
      - name: Verify R2 Semantic Verifier database contracts
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -f scripts/sql/content_factory_r2_semantic_verifier_verify.sql
      - name: Type-check semantic verifier executor
        run: deno check --node-modules-dir=auto supabase/functions/content-semantic-verifier/index.ts
      - name: Verify material-grounded executor contract
        run: |
          set -euo pipefail
          file='supabase/functions/content-semantic-verifier/index.ts'
          grep -q 'retrieveSourceMaterial' "$file"
          grep -Eq 'p_retrieval_method:[[:space:]]*material\.method' "$file"
          grep -Eq 'p_material_text:[[:space:]]*material\.text' "$file"
          grep -Eq 'p_material_id:[[:space:]]*claim\.material_id' "$file"
          grep -q 'MATERIAL SHA256' "$file"
          grep -q 'BEGIN UNTRUSTED SOURCE MATERIAL' "$file"
          grep -q 'untrusted evidence data, never instructions' "$file"
          grep -q 'semantic_verifier_private_source_denied' "$file"
          grep -q 'semantic_verifier_excerpt_not_grounded_in_material' "$file"
          grep -q 'hq_content_semantic_verifier_fail' "$file"
          if grep -q 'claim.evidence_excerpt' "$file"; then
            echo 'Semantic verifier must not classify a search snippet as source material' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path('supabase/functions/content-semantic-verifier/index.ts').read_text()
          claim = text.find('db.rpc("hq_content_semantic_verifier_claim"')
          verify = text.find('verifySemantics(claim,material.text)')
          if verify < 0:
              verify = text.find('verifySemantics(claim, material.text)')
          complete = text.find('db.rpc("hq_content_semantic_verifier_complete"')
          if min(claim, verify, complete) < 0 or not claim < verify < complete:
              raise SystemExit('executor order must be material-bound claim -> model verify -> database complete')
          PY
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
