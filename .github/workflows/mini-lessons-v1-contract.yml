name: Mini Lessons V1 Security and Ranking Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/explore/**'
      - 'app/api/hq/minis/**'
      - 'app/api/minis/**'
      - 'components/hq/HQShell.tsx'
      - 'app/hq/minis/**'
      - 'app/student/explore/page.tsx'
      - 'components/public/MiniLive*'
      - 'components/public/MiniVoice*'
      - 'app/mini/**'
      - 'supabase/migrations/*mini_voice*.sql'
      - 'scripts/test-mini-voice-contract.mjs'
      - 'components/public/MiniHomeSection.tsx'
      - 'lib/minis/**'
      - 'supabase/migrations/*mini_lessons*.sql'
      - 'supabase/migrations/*mini_lesson_requests*.sql'
      - 'supabase/migrations/*mini_open_creator*.sql'
      - 'scripts/test-mini-requests-contract.mjs'
      - 'scripts/test-mini-open-publishing-contract.mjs'
      - 'scripts/test-mini-lessons-contract.mjs'
      - '.github/workflows/mini-lessons-v1-contract.yml'

permissions:
  contents: read

jobs:
  minis-contract:
    name: Mini Lessons security, privacy and ranking unit proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import ./scripts/register-typescript.mjs scripts/test-mini-lessons-contract.mjs
      - run: node scripts/test-mini-requests-contract.mjs
      - run: node --test scripts/test-mini-open-publishing-contract.mjs

      - run: node --import ./scripts/register-typescript.mjs scripts/test-mini-voice-contract.mjs
