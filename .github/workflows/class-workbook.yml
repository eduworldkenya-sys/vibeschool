name: Canonical Class Workbook
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/class-workbook/**"
      - "lib/learner-intelligence/**"
      - "app/teacher/progress/**"
      - "scripts/test-progress-*"
      - "components/teacher/progress/**"
      - "lib/assessment/interventions.ts"
      - "lib/report-cards/service.ts"
      - "app/teacher/report-cards/**"
      - "app/teacher/assessment/interventions/**"
      - "components/teacher/workbook/**"
      - "app/teacher/classhub/**"
      - "app/teacher/schoolhub/**"
      - "app/teacher/profile/page.tsx"
      - "supabase/migrations/*school_class_responsibility*"
      - "scripts/test-class-school-responsibility-contract.mjs"
      - "scripts/test-class-school-responsibility-db.mjs"
      - "supabase/migrations/*class_workbook*"
      - "scripts/test-class-workbook*"
      - "scripts/test-classroom-workspace*"
      - "lib/classroom/**"
      - "components/teacher/classroom/**"
      - "supabase/migrations/*class_workspace*"
      - ".github/workflows/class-workbook.yml"
permissions:
  contents: read
concurrency:
  group: class-workbook-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workbook:
    name: Workbook projections and database isolation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/production-build-contract
        with:
          build_application: "false"
          prebuild_command: |
            node scripts/test-class-workbook.mjs
            node scripts/test-class-school-responsibility-contract.mjs
            node scripts/test-progress-workspace.mjs
            node scripts/test-progress-support.mjs
            node scripts/test-student-progress-record-contract.mjs
            node scripts/test-classroom-workspace.mjs
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/workbook-db" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Exercise actual migration and canonical group policies
        run: WORKBOOK_PGLITE_MODULE="$RUNNER_TEMP/workbook-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-class-workbook-db.mjs
      - name: Exercise class and school responsibility migration security
        run: WORKBOOK_PGLITE_MODULE="$RUNNER_TEMP/workbook-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-class-school-responsibility-db.mjs
      - name: Exercise consolidated Class OS migration and learner lifecycle
        run: WORKBOOK_PGLITE_MODULE="$RUNNER_TEMP/workbook-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-classroom-workspace-db.mjs
      - name: Install isolated DOM test runtime
        run: npm install --prefix "$RUNNER_TEMP/workbook-ui" --ignore-scripts --no-audit --no-fund jsdom@26.1.0 esbuild@0.28.2 @testing-library/dom@10.4.2
      - name: Exercise workbook interactions and recovery
        run: WORKBOOK_UI_MODULES="$RUNNER_TEMP/workbook-ui/node_modules" node scripts/test-class-workbook-ui.mjs
      - name: Exercise connected progress views and stale-scope recovery
        run: PROGRESS_UI_MODULES="$RUNNER_TEMP/workbook-ui/node_modules" node scripts/test-progress-workspace-ui.mjs
      - name: Exercise support and report context recovery
        run: PROGRESS_UI_MODULES="$RUNNER_TEMP/workbook-ui/node_modules" node scripts/test-progress-support-ui.mjs
      - name: Exercise classroom workspace interactions and recovery
        run: WORKBOOK_UI_MODULES="$RUNNER_TEMP/workbook-ui/node_modules" node scripts/test-classroom-workspace-ui.mjs
