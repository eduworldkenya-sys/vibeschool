name: Engineering Main Reconciliation

on:
  push:
    branches: [main]

concurrency:
  group: engineering-main-reconciliation
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  invalidate-affected:
    name: Mark semantically affected PRs RECONCILE REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify main delta and affected open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const before = context.payload.before;
            const after = context.payload.after;

            const domainsFor = (paths) => {
              const rules = {
                AUTH: ['src/app/auth/', 'src/lib/auth', 'middleware', 'oauth', 'password', 'onboarding'],
                DATABASE: ['supabase/migrations/', 'database.types', 'types/database'],
                AUTHORIZATION: ['rls', 'grant', 'revoke', 'security_definer', 'storage', 'authorization', 'policy'],
                IDENTITY: ['profile', 'student', 'teacher', 'parent', 'school_identity', 'membership', 'claim'],
                HQ: ['src/app/hq/', 'hq_', 'founder'],
                WORKER: ['worker', 'autopilot', 'workforce'],
                TELEMETRY: ['telemetry', 'analytics', 'observability', 'metric', 'event'],
                PAYMENTS: ['mpesa', 'payment', 'daraja', 'wallet', 'finance'],
                CI: ['.github/workflows/', '.github/actions/', 'engineering_control_plane', 'ci/'],
              };
              const out = new Set();
              for (const p of paths.map(x => x.toLowerCase())) {
                for (const [d, needles] of Object.entries(rules)) {
                  if (needles.some(n => p.includes(n.toLowerCase()))) out.add(d);
                }
              }
              return out;
            };

            const compare = await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: `${before}...${after}`, per_page: 100});
            const mainPaths = (compare.data.files || []).map(f => f.filename);
            const mainDomains = domainsFor(mainPaths);
            core.info(`main ${before} -> ${after}; domains=${[...mainDomains].sort().join(',')}`);

            const labels = [
              ['state:reconcile-required', 'FBCA04', 'Certification invalidated by relevant current-main change'],
              ['state:blocked-security', 'B60205', 'Promotion hard-blocked by a security finding'],
              ['state:merge-ready', '0E8A16', 'Exact-current-main certification is complete'],
            ];
            for (const [name, color, description] of labels) {
              try { await github.rest.issues.createLabel({owner, repo, name, color, description}); }
              catch (e) { if (e.status !== 422) throw e; }
            }

            const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', base: 'main', per_page: 100});
            for (const pr of prs) {
              if (pr.head.sha === after) continue;
              const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
              const prDomains = domainsFor(files.map(f => f.filename));
              const overlap = [...prDomains].filter(d => mainDomains.has(d));
              if (!overlap.length) {
                core.info(`#${pr.number}: unaffected; domains=${[...prDomains].join(',')}`);
                continue;
              }
              await github.rest.issues.addLabels({owner, repo, issue_number: pr.number, labels: ['state:reconcile-required']});
              const body = [
                `Engineering Control Plane: **RECONCILE REQUIRED**`,
                ``,
                `Current main advanced to \`${after}\`.`,
                `Semantic overlap: ${overlap.sort().join(', ')}.`,
                `No defect is inferred. Historical green evidence must not be used for promotion until this PR is reconciled and re-certified against exact-current main.`
              ].join('\n');
              await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
            }
