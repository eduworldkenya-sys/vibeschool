name: Engineering Main Reconciliation

on:
  push:
    branches: [main]

concurrency:
  group: engineering-main-reconciliation
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  invalidate-affected:
    name: Mark semantically affected PRs RECONCILE REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact promoted main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Classify main delta and affected open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const before = context.payload.before;
            const after = context.payload.after;
            const policy = JSON.parse(fs.readFileSync('.github/control-plane/policy.json', 'utf8'));

            const domainsFor = (paths) => {
              const out = new Set();
              for (const raw of paths) {
                if (!raw) continue;
                const p = String(raw).toLowerCase();
                for (const [domain, needles] of Object.entries(policy.domains)) {
                  if (needles.some(n => p.includes(String(n).toLowerCase()))) out.add(domain);
                }
              }
              return out;
            };

            const addLabelIfMissing = async (issueNumber, existingLabels, name) => {
              if (existingLabels.has(name)) return false;
              await github.rest.issues.addLabels({owner, repo, issue_number: issueNumber, labels: [name]});
              existingLabels.add(name);
              return true;
            };

            const removeLabelIfPresent = async (issueNumber, existingLabels, name) => {
              if (!existingLabels.has(name)) return false;
              try {
                await github.rest.issues.removeLabel({owner, repo, issue_number: issueNumber, name});
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              existingLabels.delete(name);
              return true;
            };

            const labels = [
              ['state:reconcile-required', 'FBCA04', 'Certification invalidated by relevant current-main change'],
              ['state:blocked-security', 'B60205', 'Promotion hard-blocked by a security finding'],
              ['state:merge-ready', '0E8A16', 'Exact-current-main certification is complete'],
            ];
            for (const [name, color, description] of labels) {
              try { await github.rest.issues.createLabel({owner, repo, name, color, description}); }
              catch (e) { if (e.status !== 422) throw e; }
            }

            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${before}...${after}`,
              per_page: 100,
            });
            const mainPaths = [];
            for (const f of compare.data.files || []) {
              mainPaths.push(f.filename);
              if (f.previous_filename) mainPaths.push(f.previous_filename);
            }
            const mainDomains = domainsFor(mainPaths);
            core.info(`policy=v${policy.version}; main ${before} -> ${after}; domains=${[...mainDomains].sort().join(',') || 'NONE'}`);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            const summary = {
              main_before: before,
              main_after: after,
              main_domains: [...mainDomains].sort(),
              open_prs: prs.length,
              affected: [],
              unaffected: [],
              fail_closed: [],
            };

            // Process sequentially so mutation order and evidence are deterministic.
            // A single pathological PR must never abort invalidation for the rest of the fleet.
            for (const pr of prs) {
              if (pr.head.sha === after) continue;
              const existingLabels = new Set((pr.labels || []).map(l => typeof l === 'string' ? l : l.name).filter(Boolean));
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                });
                const prPaths = [];
                for (const f of files) {
                  prPaths.push(f.filename);
                  if (f.previous_filename) prPaths.push(f.previous_filename);
                }
                const prDomains = domainsFor(prPaths);
                const overlap = [...prDomains].filter(d => mainDomains.has(d)).sort();

                if (!overlap.length) {
                  summary.unaffected.push({pr: pr.number, domains: [...prDomains].sort()});
                  core.info(`#${pr.number}: unaffected; domains=${[...prDomains].sort().join(',') || 'NONE'}`);
                  continue;
                }

                await removeLabelIfPresent(pr.number, existingLabels, 'state:merge-ready');
                const newlyInvalidated = await addLabelIfMissing(pr.number, existingLabels, 'state:reconcile-required');
                summary.affected.push({pr: pr.number, overlap, newly_invalidated: newlyInvalidated});

                if (newlyInvalidated) {
                  const body = [
                    `Engineering Control Plane: **RECONCILE REQUIRED**`,
                    ``,
                    `Current main advanced to \`${after}\`.`,
                    `Semantic overlap: ${overlap.join(', ')}.`,
                    `No defect is inferred. Historical green evidence must not be used for promotion until this PR is reconciled and re-certified against exact-current main.`
                  ].join('\n');
                  await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
                }
              } catch (e) {
                core.warning(`#${pr.number}: classification failed closed: ${e.message}`);
                await removeLabelIfPresent(pr.number, existingLabels, 'state:merge-ready');
                const newlyInvalidated = await addLabelIfMissing(pr.number, existingLabels, 'state:reconcile-required');
                summary.fail_closed.push({pr: pr.number, error: String(e.message || e), newly_invalidated: newlyInvalidated});
                if (newlyInvalidated) {
                  const body = [
                    `Engineering Control Plane: **RECONCILE REQUIRED — CLASSIFICATION INCOMPLETE**`,
                    ``,
                    `Current main advanced to \`${after}\`.`,
                    `This PR could not be classified completely, so certification is invalidated fail-closed rather than assumed safe.`,
                    `Classification error: \`${String(e.message || e).slice(0, 500)}\`.`
                  ].join('\n');
                  await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
                }
              }
            }

            core.summary
              .addHeading('Engineering Main Reconciliation')
              .addRaw(`Main: ${before} → ${after}\n`)
              .addRaw(`Domains: ${summary.main_domains.join(', ') || 'NONE'}\n`)
              .addRaw(`Open PRs: ${summary.open_prs}\n`)
              .addRaw(`Affected: ${summary.affected.length}\n`)
              .addRaw(`Unaffected: ${summary.unaffected.length}\n`)
              .addRaw(`Fail-closed: ${summary.fail_closed.length}\n`);
            await core.summary.write();
            core.info(JSON.stringify(summary));
