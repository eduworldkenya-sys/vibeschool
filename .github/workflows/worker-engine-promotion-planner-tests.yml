name: Worker Engine Promotion Planner Regression Gate

on:
  pull_request:
    paths:
      - scripts/worker-engine-build-ledger-aligned-stage.py
      - scripts/test-worker-engine-build-ledger-aligned-stage.py
      - .github/workflows/worker-engine-production-promotion-dry-run.yml
      - .github/workflows/worker-engine-promotion-planner-tests.yml
  push:
    branches-ignore:
      - main
    paths:
      - scripts/worker-engine-build-ledger-aligned-stage.py
      - scripts/test-worker-engine-build-ledger-aligned-stage.py
      - .github/workflows/worker-engine-production-promotion-dry-run.yml
      - .github/workflows/worker-engine-promotion-planner-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Ledger-aligned staging regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run staging regression suite
        run: python3 scripts/test-worker-engine-build-ledger-aligned-stage.py
