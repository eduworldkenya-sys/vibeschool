name: Worker Engine Promotion Planner Regression Gate

on:
  pull_request:
    paths:
      - supabase/migrations/*worker_engine*.sql
      - scripts/worker-engine-build-ledger-aligned-stage.py
      - scripts/test-worker-engine-build-ledger-aligned-stage.py
      - scripts/worker-engine-assert-dry-run-plan.py
      - scripts/test-worker-engine-assert-dry-run-plan.py
      - scripts/test-worker-engine-pgcrypto-qualification.py
      - scripts/worker-engine-verify-production-contract.py
      - .github/workflows/worker-engine-production-promotion-dry-run.yml
      - .github/workflows/worker-engine-production-promotion-apply.yml
      - .github/workflows/worker-engine-production-contract-verify.yml
      - .github/workflows/worker-engine-promotion-planner-tests.yml
  push:
    branches-ignore:
      - main
    paths:
      - supabase/migrations/*worker_engine*.sql
      - scripts/worker-engine-build-ledger-aligned-stage.py
      - scripts/test-worker-engine-build-ledger-aligned-stage.py
      - scripts/worker-engine-assert-dry-run-plan.py
      - scripts/test-worker-engine-assert-dry-run-plan.py
      - scripts/test-worker-engine-pgcrypto-qualification.py
      - scripts/worker-engine-verify-production-contract.py
      - .github/workflows/worker-engine-production-promotion-dry-run.yml
      - .github/workflows/worker-engine-production-promotion-apply.yml
      - .github/workflows/worker-engine-production-contract-verify.yml
      - .github/workflows/worker-engine-promotion-planner-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Worker Engine promotion regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run ledger-aligned staging regression suite
        run: python3 scripts/test-worker-engine-build-ledger-aligned-stage.py
      - name: Run dry-run output assertion regression suite
        run: python3 scripts/test-worker-engine-assert-dry-run-plan.py
      - name: Guard pgcrypto schema qualification
        run: python3 scripts/test-worker-engine-pgcrypto-qualification.py
      - name: Syntax-check production contract verifier
        run: python3 -m py_compile scripts/worker-engine-verify-production-contract.py
