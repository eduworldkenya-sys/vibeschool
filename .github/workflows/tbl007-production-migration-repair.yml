name: TBL-007 Production Migration Repair

on:
  workflow_dispatch:
    inputs:
      migration_version:
        description: "Exact migration version to repair (8–14 digits)"
        required: true
        type: string
      repair_status:
        description: "Migration ledger status"
        required: true
        type: choice
        options:
          - applied
          - reverted
      expected_head:
        description: "Exact 40-character main commit SHA approved for repair"
        required: true
        type: string
      approval_id:
        description: "External approval/change record identifier"
        required: true
        type: string
      confirmation:
        description: "Type: REPAIR <version> <status> ON yauqsxggtuxuykcbrtzf"
        required: true
        type: string

concurrency:
  group: production-migration-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Authorized production migration repair
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Configure this GitHub Environment with required reviewers.
    # Store SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID as environment secrets.
    environment: production-migration-repair

    env:
      EXPECTED_PROJECT_REF: yauqsxggtuxuykcbrtzf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout exact approved main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0

      - name: Normalize canonical repair request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tbl007-artifacts

          python3 - <<'PYREQUEST'
          import json
          from pathlib import Path

          request = {
              "migration_version": "${{ inputs.migration_version }}",
              "repair_status": "${{ inputs.repair_status }}",
              "expected_head": "${{ inputs.expected_head }}",
              "approval_id": "${{ inputs.approval_id }}",
              "confirmation": "${{ inputs.confirmation }}",
              "project_ref": "yauqsxggtuxuykcbrtzf",
              "environment": "PRODUCTION",
              "branch": "main",
              "source": "workflow_dispatch",
          }

          Path(
              ".tbl007-artifacts/workflow-repair-request.json"
          ).write_text(
              json.dumps(request, indent=2) + "\n",
              encoding="utf-8",
          )
          PYREQUEST

          python3 scripts/tbl009-repair-request.py             --input .tbl007-artifacts/workflow-repair-request.json             --output .tbl007-artifacts/normalized-repair-request.json

      - name: Verify immutable workflow inputs
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ inputs.migration_version }}'
          STATUS='${{ inputs.repair_status }}'
          EXPECTED_HEAD='${{ inputs.expected_head }}'
          APPROVAL_ID='${{ inputs.approval_id }}'
          CONFIRMATION='${{ inputs.confirmation }}'

          [[ "$VERSION" =~ ^[0-9]{8,14}$ ]] || {
            echo "Invalid migration version"
            exit 1
          }

          [[ "$STATUS" == "applied" || "$STATUS" == "reverted" ]] || {
            echo "Invalid repair status"
            exit 1
          }

          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_head must be a full 40-character commit SHA"
            exit 1
          }

          [[ -n "$APPROVAL_ID" && "$APPROVAL_ID" != "PENDING" ]] || {
            echo "A real approval ID is required"
            exit 1
          }

          ACTUAL_HEAD="$(git rev-parse HEAD)"
          [[ "$ACTUAL_HEAD" == "$EXPECTED_HEAD" ]] || {
            echo "Checked-out HEAD does not match approved HEAD"
            exit 1
          }

          git fetch origin main
          REMOTE_MAIN="$(git rev-parse origin/main)"
          [[ "$ACTUAL_HEAD" == "$REMOTE_MAIN" ]] || {
            echo "Repair is allowed only against the current origin/main HEAD"
            exit 1
          }

          EXPECTED_CONFIRMATION="REPAIR $VERSION $STATUS ON $EXPECTED_PROJECT_REF"
          [[ "$CONFIRMATION" == "$EXPECTED_CONFIRMATION" ]] || {
            echo "Confirmation phrase does not match the requested action"
            exit 1
          }

          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || {
            echo "SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          }

          [[ "$SUPABASE_PROJECT_ID" == "$EXPECTED_PROJECT_REF" ]] || {
            echo "SUPABASE_PROJECT_ID does not match production"
            exit 1
          }

          git diff --quiet
          git diff --cached --quiet
          [[ -z "$(git status --porcelain)" ]] || {
            echo "Working tree is not clean"
            exit 1
          }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link exact production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          [[ "$(cat supabase/.temp/project-ref)" == "$EXPECTED_PROJECT_REF" ]]

      - name: Capture fresh live ledger before repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tbl007-artifacts
          supabase migration list --linked \
            | tee .tbl007-artifacts/live-ledger-before.txt
          sha256sum .tbl007-artifacts/live-ledger-before.txt \
            | tee .tbl007-artifacts/live-ledger-before.sha256

      - name: Run repository validators
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-migration-classification.py
          python3 scripts/validate-tbl006-collision-register.py
          python3 scripts/test-tbl007-migration-repair-gate.py
          python3 scripts/test-tbl007-authorized-repair.py

      - name: Create approved preflight manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/tbl007-create-repair-manifest.py \
            --version '${{ inputs.migration_version }}' \
            --status '${{ inputs.repair_status }}' \
            --output .git/tbl007-ci-manifest.json \
            --approval-id '${{ inputs.approval_id }}'

          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          path = Path(".git/tbl007-ci-manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["approval_status"] = "APPROVED"
          data["approval_authority"] = "github_environment:production-migration-repair"
          data["github_run_id"] = "${{ github.run_id }}"
          data["github_actor"] = "${{ github.actor }}"
          data["live_ledger_before_sha256"] = Path(
              ".tbl007-artifacts/live-ledger-before.sha256"
          ).read_text(encoding="utf-8").split()[0]

          path.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
          )
          PYEOF

      - name: Issue single-use authorization
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/tbl007-migration-repair-gate.py \
            --manifest .git/tbl007-ci-manifest.json

          python3 - <<'PYEOF' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  ".git/tbl007-migration-repair-authorization.json"
              ).read_text(encoding="utf-8")
          )
          print(f"TBL007_AUTH_TOKEN={data['token']}")
          PYEOF

      - name: Execute authorized repair
        shell: bash
        env:
          TBL007_REPAIR_CONFIRM: >-
            REPAIR ${{ inputs.migration_version }}
            ${{ inputs.repair_status }}
            ON yauqsxggtuxuykcbrtzf
        run: |
          set -euo pipefail

          python3 scripts/tbl007-authorized-migration-repair.py \
            --token "$TBL007_AUTH_TOKEN" \
            --execute

      - name: Capture fresh live ledger after repair
        id: capture_after
        if: always()
        shell: bash
        run: |
          mkdir -p .tbl007-artifacts

          {
            echo "run_id=${{ github.run_id }}"
            echo "actor=${{ github.actor }}"
            echo "head=${{ inputs.expected_head }}"
            echo "version=${{ inputs.migration_version }}"
            echo "status=${{ inputs.repair_status }}"
            echo "approval_id=${{ inputs.approval_id }}"
            echo "project_ref=$EXPECTED_PROJECT_REF"
            echo -n "request_sha256="
            python3 - <<'PYHASH'
            import json
            from pathlib import Path

            data = json.loads(
                Path(
                    ".tbl007-artifacts/normalized-repair-request.json"
                ).read_text(encoding="utf-8")
            )
            print(data["request_sha256"])
            PYHASH
          } > .tbl007-artifacts/repair-context.txt

          if supabase migration list --linked \
            > .tbl007-artifacts/live-ledger-after.txt 2>&1
          then
            cat .tbl007-artifacts/live-ledger-after.txt
            sha256sum .tbl007-artifacts/live-ledger-after.txt \
              > .tbl007-artifacts/live-ledger-after.sha256
            echo "captured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to capture post-repair ledger" \
              | tee .tbl007-artifacts/live-ledger-after-error.txt
            echo "captured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify migration repair postflight
        if: ${{ steps.capture_after.outputs.captured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          test -s .tbl007-artifacts/live-ledger-before.txt
          test -s .tbl007-artifacts/live-ledger-after.txt

          python3 scripts/tbl008-migration-postflight.py \
            --before .tbl007-artifacts/live-ledger-before.txt \
            --after .tbl007-artifacts/live-ledger-after.txt \
            --version '${{ inputs.migration_version }}' \
            --status '${{ inputs.repair_status }}' \
            --report .tbl007-artifacts/postflight-report.json

      - name: Upload immutable repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbl007-migration-repair-${{ github.run_id }}
          path: .tbl007-artifacts/
          if-no-files-found: error
          retention-days: 90
