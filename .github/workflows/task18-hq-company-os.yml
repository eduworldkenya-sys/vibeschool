name: Task 18 HQ Company OS

on:
  pull_request:
    branches: [main]
    paths:
      - "app/hq/**"
      - "components/hq/**"
      - "lib/hq/**"
      - "middleware.ts"
      - "supabase/migrations/**"
      - "scripts/task18-hq-company-os-contract.mjs"
      - ".github/workflows/task18-hq-company-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: HQ Company OS exact-head certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Task 18 contract + canonical production build
        uses: ./.github/actions/production-build-contract
        with:
          prebuild_command: |
            node scripts/task18-hq-company-os-contract.mjs
            npm run typecheck
            npm run lint
          supabase_url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase_anon_key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
