name: Authoritative Curriculum Hierarchy Binding Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*curriculum_authority_hierarchy_binding*'
      - 'scripts/sql/curriculum_authority_hierarchy_binding_verify.sql'
      - 'docs/CURRICULUM_HIERARCHY_BINDING_HANDOVER_20260818.md'
      - '.github/workflows/curriculum-authority-hierarchy-binding-contract.yml'

permissions:
  contents: read

jobs:
  database-contract:
    name: Disposable-local source-bound hierarchy certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Disable seed
        run: |
          set -euo pipefail
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql /tmp/vibeschool-seed.sql.disabled; fi
      - name: Start disposable Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Rebuild full migration chain
        run: supabase db reset --local --no-seed
      - name: Certify hierarchy binding
        run: PGPASSWORD=postgres psql 'postgresql://postgres@127.0.0.1:54322/postgres' -f scripts/sql/curriculum_authority_hierarchy_binding_verify.sql
      - name: Destroy disposable Supabase
        if: always()
        run: supabase stop --no-backup > /dev/null 2>&1 || true
