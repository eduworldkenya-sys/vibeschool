name: Universal Commerce Daraja Sandbox Contracts

on:
  pull_request:
    paths:
      - 'lib/commerce/unified/**'
      - 'qa/commerce/unified-sandbox-*.sql'
      - 'docs/commerce/UNIFIED-DARAJA-SANDBOX.md'
      - '.github/workflows/unified-commerce-sandbox.yml'
  push:
    branches: [main]
    paths:
      - 'lib/commerce/unified/**'
      - 'qa/commerce/unified-sandbox-*.sql'
      - 'docs/commerce/UNIFIED-DARAJA-SANDBOX.md'
      - '.github/workflows/unified-commerce-sandbox.yml'

permissions:
  contents: read

jobs:
  sandbox-contracts:
    name: Universal Commerce Sandbox Contracts (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies, without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run sandbox contracts with injected transport (no real network)
        run: node --import ./scripts/register-typescript.mjs --test lib/commerce/unified/*.test.ts
      - name: Typecheck whole repository
        run: npm run typecheck

  disposable-postgres:
    name: Universal Commerce Disposable PostgreSQL Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-fixture-only
          POSTGRES_DB: commerce_sandbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_sandbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build temporary sandbox-only schema and assert invariants
        env:
          PGPASSWORD: disposable-fixture-only
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=commerce_sandbox_test
          psql -v ON_ERROR_STOP=1 -f qa/commerce/unified-sandbox-fixture.sql
          psql -v ON_ERROR_STOP=1 -f qa/commerce/unified-sandbox-assertions.sql
