name: Universal Commerce Daraja Sandbox Contracts

on:
  pull_request:
    paths:
      - 'lib/commerce/unified/**'
      - 'docs/commerce/UNIFIED-DARAJA-SANDBOX.md'
      - '.github/workflows/unified-commerce-sandbox.yml'
  push:
    branches: [main]
    paths:
      - 'lib/commerce/unified/**'
      - 'docs/commerce/UNIFIED-DARAJA-SANDBOX.md'
      - '.github/workflows/unified-commerce-sandbox.yml'

permissions:
  contents: read

jobs:
  sandbox-contracts:
    name: Universal Commerce Sandbox Contracts (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies, without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run sandbox contracts with injected transport (no real network)
        run: node --import ./scripts/register-typescript.mjs --test lib/commerce/unified/sandbox.test.ts
      - name: Typecheck whole repository
        run: npm run typecheck
