name: PWA Browser Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/manifest.ts'
      - 'app/layout.tsx'
      - 'app/apple-icon.tsx'
      - 'app/pwa-icons/**'
      - 'components/pwa/**'
      - 'public/sw.js'
      - 'public/offline.html'
      - 'scripts/test-pwa-browser.mjs'
      - '.github/workflows/pwa-browser-gate.yml'
  push:
    branches: [main]
    paths:
      - 'app/manifest.ts'
      - 'app/layout.tsx'
      - 'app/apple-icon.tsx'
      - 'app/pwa-icons/**'
      - 'components/pwa/**'
      - 'public/sw.js'
      - 'public/offline.html'
      - 'scripts/test-pwa-browser.mjs'
      - '.github/workflows/pwa-browser-gate.yml'

permissions:
  contents: read

jobs:
  chromium-pwa:
    name: Chromium installability and offline recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact app dependencies
        run: npm ci

      - name: Install isolated Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/vibeschool-pwa-server.log 2>&1 &
          echo $! > /tmp/vibeschool-pwa-server.pid

      - name: Wait for local production server
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vibeschool-pwa-server.log
          exit 1

      - name: Run Chromium PWA gate
        run: node scripts/test-pwa-browser.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/vibeschool-pwa-server.log || true
