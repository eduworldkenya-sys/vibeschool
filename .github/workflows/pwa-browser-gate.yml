name: PWA Browser Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/manifest.ts'
      - 'app/layout.tsx'
      - 'app/apple-icon.tsx'
      - 'app/pwa-icons/**'
      - 'components/pwa/**'
      - 'public/sw.js'
      - 'public/offline.html'
      - 'scripts/test-pwa-browser.mjs'
      - '.github/actions/production-build-contract/**'
      - '.github/workflows/pwa-browser-gate.yml'
  push:
    branches: [main]
    paths:
      - 'app/manifest.ts'
      - 'app/layout.tsx'
      - 'app/apple-icon.tsx'
      - 'app/pwa-icons/**'
      - 'components/pwa/**'
      - 'public/sw.js'
      - 'public/offline.html'
      - 'scripts/test-pwa-browser.mjs'
      - '.github/actions/production-build-contract/**'
      - '.github/workflows/pwa-browser-gate.yml'

permissions:
  contents: read

jobs:
  chromium-pwa:
    name: Chromium installability and offline recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Canonical production build
        uses: ./.github/actions/production-build-contract
        with:
          supabase_url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase_anon_key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install isolated Playwright runtime
        run: |
          rm -rf /tmp/vibeschool-pwa-browser
          mkdir -p /tmp/vibeschool-pwa-browser
          cd /tmp/vibeschool-pwa-browser
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/scripts/test-pwa-browser.mjs" ./test-pwa-browser.mjs

      - name: Start production server
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run start -- -p 3000 > /tmp/vibeschool-pwa-server.log 2>&1 &
          echo $! > /tmp/vibeschool-pwa-server.pid

      - name: Wait for local production server
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vibeschool-pwa-server.log
          exit 1

      - name: Run isolated Chromium PWA gate
        working-directory: /tmp/vibeschool-pwa-browser
        env:
          PWA_TEST_BASE_URL: http://127.0.0.1:3000
        run: node test-pwa-browser.mjs

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo '--- VibeSchool production server log ---'
          cat /tmp/vibeschool-pwa-server.log || true
          echo '--- Browser gate environment ---'
          test -f /tmp/vibeschool-pwa-browser/package.json && cat /tmp/vibeschool-pwa-browser/package.json || true
