name: Parent self-use UX migration
on:
  push:
    branches:
      - fix/shared-claim-code-10of10
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch parent learner profile
        run: python3 .github/parent_self_use_patch.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/parent/child/'[id]'/profile/page.tsx
          git commit -m 'feat: add parent-controlled student self-use access [claim-ux-parent-patched]'
          git push
