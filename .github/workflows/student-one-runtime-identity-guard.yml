name: Student One Runtime Identity Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260818190000_student_one_runtime_identity_guard.sql'
      - 'scripts/test-student-one-runtime-identity-guard.mjs'
      - 'docs/security/STUDENT_ONE_RUNTIME_IDENTITY_GUARD_20260818.md'
      - '.github/workflows/student-one-runtime-identity-guard.yml'
  push:
    branches:
      - main
      - 'cert/student-one-content-learning-events-**'
    paths:
      - 'supabase/migrations/20260818190000_student_one_runtime_identity_guard.sql'
      - 'scripts/test-student-one-runtime-identity-guard.mjs'
      - 'docs/security/STUDENT_ONE_RUNTIME_IDENTITY_GUARD_20260818.md'
      - '.github/workflows/student-one-runtime-identity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Fail-closed learner resolver and identity health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Student = 1 runtime identity guard
        run: node scripts/test-student-one-runtime-identity-guard.mjs
