name: Live Classroom Pilot
on:
  pull_request:
    paths:
      - 'app/student/live/**'
      - 'app/student/page.tsx'
      - 'app/student/tutoring/**'
      - 'app/teacher/tutoring/**'
      - 'app/parent/live/**'
      - 'app/teacher/classhub/**'
      - 'components/live-classroom/**'
      - 'supabase/migrations/*live_classroom*'
      - 'supabase/migrations/*live_lesson_history*'
      - 'supabase/migrations/*live_learner_tools*'
      - 'supabase/migrations/*live_teacher_workspace*'
      - 'scripts/test-live-classroom-pilot.mjs'
      - 'scripts/live-classroom-test-fixture.mjs'
      - 'scripts/test-live-classroom-browser.mjs'
      - '.github/workflows/live-classroom-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'components/live-classroom/**'
      - 'supabase/migrations/*live_classroom*'
      - 'supabase/migrations/*live_lesson_history*'
      - 'supabase/migrations/*live_learner_tools*'
      - 'supabase/migrations/*live_teacher_workspace*'
      - 'scripts/test-live-classroom-pilot.mjs'
      - 'scripts/live-classroom-test-fixture.mjs'
      - 'scripts/test-live-classroom-browser.mjs'
      - '.github/workflows/live-classroom-pilot.yml'
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned test engine
        run: npm install --prefix /tmp/live-test --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Exercise actual SQL migration and adversarial access paths
        run: node scripts/test-live-classroom-pilot.mjs

      - name: Install pinned browser test dependencies
        run: |
          mapfile -t ui_packages < <(node -e 'const p=require("./package-lock.json").packages; for(const n of ["react","react-dom","lucide-react"]) { const v=p["node_modules/"+n]?.version; if(!v)throw Error("Missing locked package "+n); console.log(n+"@"+v) }')
          npm install --prefix /tmp/live-test --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14 esbuild@0.25.12 playwright@1.56.1 "${ui_packages[@]}"
          /tmp/live-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise real classroom UI with disposable in-memory SQL fixtures
        timeout-minutes: 8
        run: node scripts/test-live-classroom-browser.mjs
