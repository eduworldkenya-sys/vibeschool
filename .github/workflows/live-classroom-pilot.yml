name: Live Classroom Pilot
on:
  pull_request:
    paths:
      - 'app/student/live/**'
      - 'app/student/page.tsx'
      - 'app/student/tutoring/**'
      - 'app/teacher/tutoring/**'
      - 'app/parent/live/**'
      - 'app/teacher/classhub/**'
      - 'components/live-classroom/**'
      - 'lib/live/voice.ts'
      - 'app/api/live/voice/**'
      - 'scripts/test-live-voice.mjs'
      - 'scripts/test-live-voice-browser.mjs'
      - 'supabase/migrations/*live_private_session_assets*'
      - 'scripts/test-live-class-assets.mjs'
      - 'lib/live/resourcePresentation.ts'
      - 'scripts/test-live-resource-presentation.mjs'
      - 'scripts/test-live-class-assets.mjs'
      - 'supabase/migrations/*live_private_session_assets*'
      - 'app/teacher/lesson-notes/page.tsx'
      - 'supabase/migrations/*live_classroom*'
      - 'supabase/migrations/*live_lesson_history*'
      - 'supabase/migrations/*live_presenter_scroll_follow*'
      - 'supabase/migrations/*live_learner_tools*'
      - 'supabase/migrations/*live_teacher_workspace*'
      - 'lib/live/mesh-*'
      - 'scripts/test-live-mesh.mjs'
      - 'scripts/test-live-mesh-browser.mjs'
      - 'supabase/migrations/*live_slide_study*'
      - 'supabase/migrations/*live_tuition_booking*'
      - 'scripts/test-live-tuition-booking.mjs'
      - 'components/vibetutor/ScheduledLiveClassroom.tsx'
      - 'app/tuition/lessons/**'
      - 'scripts/test-live-slide-study.mjs'
      - 'scripts/test-live-classroom-pilot.mjs'
      - 'scripts/live-classroom-test-fixture.mjs'
      - 'scripts/test-live-classroom-browser.mjs'
      - 'scripts/test-live-learner-notice.mjs'
      - '.github/workflows/live-classroom-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*live_slide_study*'
      - 'supabase/migrations/*live_tuition_booking*'
      - 'scripts/test-live-tuition-booking.mjs'
      - 'components/vibetutor/ScheduledLiveClassroom.tsx'
      - 'app/tuition/lessons/**'
      - 'scripts/test-live-slide-study.mjs'
      - 'components/live-classroom/**'
      - 'supabase/migrations/*live_private_session_assets*'
      - 'scripts/test-live-class-assets.mjs'
      - 'supabase/migrations/*live_classroom*'
      - 'supabase/migrations/*live_lesson_history*'
      - 'supabase/migrations/*live_presenter_scroll_follow*'
      - 'supabase/migrations/*live_learner_tools*'
      - 'supabase/migrations/*live_teacher_workspace*'
      - 'lib/live/mesh-*'
      - 'scripts/test-live-mesh.mjs'
      - 'scripts/test-live-mesh-browser.mjs'
      - 'scripts/test-live-classroom-pilot.mjs'
      - 'scripts/live-classroom-test-fixture.mjs'
      - 'scripts/test-live-classroom-browser.mjs'
      - 'scripts/test-live-learner-notice.mjs'
      - '.github/workflows/live-classroom-pilot.yml'
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned test engine
        run: npm install --prefix /tmp/live-test --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Exercise actual SQL migration and adversarial access paths
        run: node scripts/test-live-classroom-pilot.mjs
      - name: Verify booked-room authorization, isolation and cancellation
        run: node scripts/test-live-tuition-booking.mjs
      - name: Verify private VibeMesh signaling and microphone lifecycle
        run: node --experimental-strip-types --test scripts/test-live-mesh.mjs lib/live/mesh-*.test.mjs
      - name: Exercise independent study migration and learner isolation
        run: node scripts/test-live-slide-study.mjs
      - name: Install exact locked application dependencies for voice policy tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Live Voice server authorization and media policy contracts
        run: npm run test:live-voice

      - name: Exercise private classroom file migration, storage and adversarial RLS
        run: node scripts/test-live-class-assets.mjs
      - name: Verify eligible learner Live notification and fail-closed filtering
        run: node --experimental-strip-types scripts/test-live-learner-notice.mjs
      - name: Verify school-only resource sharing and bounded presentation contract
        run: node --experimental-strip-types scripts/test-live-resource-presentation.mjs
      - name: Install pinned browser test dependencies
        run: |
          mapfile -t ui_packages < <(node -e 'const p=require("./package-lock.json").packages; for(const n of ["react","react-dom","lucide-react"]) { const v=p["node_modules/"+n]?.version; if(!v)throw Error("Missing locked package "+n); console.log(n+"@"+v) }')
          npm install --prefix /tmp/live-test --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14 esbuild@0.25.12 playwright@1.56.1 "${ui_packages[@]}"
          /tmp/live-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise real classroom UI with disposable in-memory SQL fixtures
        timeout-minutes: 8
        run: node scripts/test-live-classroom-browser.mjs
      - name: Exercise opt-in in-place slide sync in real teacher and learner browsers
        timeout-minutes: 8
        env:
          TEST_LIVE_SLIDE_UPDATE: '1'
        run: node scripts/test-live-classroom-browser.mjs
      - name: Verify voice consent, grants, revocations and token renewal in Chromium
        timeout-minutes: 4
        run: node scripts/test-live-voice-browser.mjs
      - name: Verify two browsers exchange direct audio through private SQL
        timeout-minutes: 4
        run: |
          node scripts/test-live-mesh-browser.mjs
          MESH_OPEN_CLASSROOMS=1 node scripts/test-live-mesh-browser.mjs
