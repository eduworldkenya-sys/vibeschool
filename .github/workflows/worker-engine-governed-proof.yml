name: Worker Engine Governed Proof

on:
  pull_request:
    paths:
      - 'lib/hq/workforce/governed-runtime.ts'
      - 'lib/hq/workforce/governed-runtime.test.ts'
      - 'lib/hq/workforce/watchdog.ts'
      - 'lib/hq/workforce/types.ts'
      - '.github/workflows/worker-engine-governed-proof.yml'
      - '.github/workflows/hq-control-room-certification.yml'
  workflow_dispatch:

jobs:
  governed-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile governed proof against current contracts
        run: |
          rm -rf .tmp/worker-engine-governed-proof
          npx --no-install tsc lib/hq/workforce/governed-runtime.test.ts \
            --outDir .tmp/worker-engine-governed-proof \
            --module commonjs \
            --target es2022 \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --types node
      - name: Run governed adversarial proof
        run: node --test .tmp/worker-engine-governed-proof/governed-runtime.test.js
      - name: Validate proof contract and reject escape hatches
        run: |
          test -s lib/hq/workforce/governed-runtime.test.ts
          grep -q 'status: "active"' lib/hq/workforce/governed-runtime.test.ts
          grep -q 'status: "probation"' lib/hq/workforce/governed-runtime.test.ts
          grep -q 'watchdog fail-closes before execution' lib/hq/workforce/governed-runtime.test.ts
          grep -q 'authority deny blocks execution' lib/hq/workforce/governed-runtime.test.ts
          grep -q 'fallback requires approval' lib/hq/workforce/governed-runtime.test.ts
          grep -q 'context is sanitized before executor' lib/hq/workforce/governed-runtime.test.ts
          grep -q 'metric trigger delegates durable admission' lib/hq/workforce/governed-runtime.test.ts
          grep -q 'persistence failure fails closed' lib/hq/workforce/governed-runtime.test.ts
          grep -q 'clarification must be structured' lib/hq/workforce/governed-runtime.test.ts
          if grep -nE 'as[[:space:]]+(any|unknown)|@ts-ignore|@ts-nocheck|eslint-disable|\.skip\(' lib/hq/workforce/governed-runtime.test.ts; then
            echo 'Governed proof contains a forbidden type/test escape hatch.' >&2
            exit 1
          fi
